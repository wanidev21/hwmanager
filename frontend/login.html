<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HW Manager">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>HW Manager - 로그인</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/static/js/firebase-service.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    /* 시그널 디자인 (app.css와 같은 톤: 콘크리트·검정·안전 주황) */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Gothic A1', -apple-system, 'Noto Sans KR', sans-serif;
      background: #ECEAE4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111111;
    }

    .login-card {
      background: #ffffff;
      border: 2px solid #111111;
      box-shadow: 8px 8px 0 #111111;
      width: 380px;
      display: flex;
      flex-direction: column;
    }
    .login-stripe {
      height: 12px;
      background: repeating-linear-gradient(-45deg, #111111 0 10px, #FF5A1F 10px 20px);
    }
    .login-head {
      background: #111111;
      color: #ECEAE4;
      padding: 26px 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .login-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #FF5A1F;
      letter-spacing: 0.08em;
    }
    .login-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 40px;
      line-height: 1;
      letter-spacing: 0.01em;
    }
    .login-subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #C9C5BA;
    }
    .login-body {
      padding: 26px 28px 24px;
      display: flex;
      flex-direction: column;
    }

    .error-box {
      display: none;
      width: 100%;
      background: #FF5A1F;
      border: 2px solid #111111;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 14px;
    }
    .error-box.show { display: block; }

    .btn-google {
      width: 100%;
      height: 54px;
      background: #ffffff;
      color: #111111;
      border: 2px solid #111111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-google:hover  { background: #FFD23F; }
    .btn-google:active { transform: translate(2px, 2px); }
    .btn-google:disabled { opacity: 0.55; cursor: not-allowed; }

    .login-note {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 600;
      color: #4A4740;
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 56px 16px env(safe-area-inset-bottom);
      }
      .login-card { width: 100%; box-shadow: 6px 6px 0 #111111; }
      .login-title { font-size: 36px; }
    }

    /* 뒤로가기 종료 안내 */
    .exit-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(17,17,17,0.45);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .exit-overlay.show { display: flex; }
    .exit-box {
      background: #ffffff; border: 2px solid #111111; width: 100%; max-width: 320px;
      padding: 22px 20px 18px; box-shadow: 6px 6px 0 #111111;
    }
    .exit-title { font-family: 'Black Han Sans', sans-serif; font-size: 22px; margin-bottom: 8px; }
    .exit-msg { font-size: 13px; font-weight: 600; color: #4A4740; line-height: 1.6; margin-bottom: 18px; }
    .exit-btn {
      width: 100%; height: 48px; border: 2px solid #111111;
      background: #FF5A1F; color: #111111; font-size: 15px; font-weight: 800;
      font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-stripe" aria-hidden="true"></div>
    <div class="login-head">
      <span class="login-tag">FIELD ENGINEER TOOL</span>
      <h1 class="login-title">HW MANAGER</h1>
      <span class="login-subtitle">서버 H/W 엔지니어 업무 관리</span>
    </div>
    <div class="login-body">

    <div class="error-box" id="login-error"></div>

    <button class="btn-google" id="btn-google" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google로 로그인
    </button>

    <p class="login-note">등록된 Google 계정만 이용할 수 있습니다</p>
    </div>
  </div>

  <div class="exit-overlay" id="exit-overlay">
    <div class="exit-box">
      <div class="exit-title">앱을 종료할까요?</div>
      <div class="exit-msg">뒤로가기를 한 번 더 누르면 종료됩니다</div>
      <button class="exit-btn" id="exit-stay">계속 사용</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn-google');

    // ── 뒤로가기 → 종료 안내 (모바일·설치된 앱) ──
    // 기록 구조 [보호용(guard), 로그인]. 뒤로가기로 guard에 오면 안내를 띄우고,
    // 거기서 한 번 더 누르면 기록 밖으로 나가 앱 종료 (스크립트로는 앱을 닫을 수 없음)
    // 뒤로가기로 이 페이지에 온 경우 (앱 → 뒤로 → 로그인 기록). 로그인 상태여도 앱으로 되돌려 보내지 않음
    const navEntry = performance.getEntriesByType('navigation')[0];
    const cameBack = !!navEntry && navEntry.type === 'back_forward';

    if (!cameBack && (matchMedia('(display-mode: standalone)').matches || matchMedia('(pointer: coarse)').matches)) {
      const exitOverlay = document.getElementById('exit-overlay');
      history.replaceState({ guard: true }, '');
      history.pushState({}, '');
      window.addEventListener('popstate', e => {
        if (e.state && e.state.guard) exitOverlay.classList.add('show');
      });
      document.getElementById('exit-stay').addEventListener('click', () => {
        exitOverlay.classList.remove('show');
        history.pushState({}, '');
      });
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg; el.classList.add('show');
    }
    function hideError() {
      document.getElementById('login-error').classList.remove('show');
    }
    function handleLoginError(e) {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      if (e.code === 'app/email-not-allowed') {
        showError('등록되지 않은 계정입니다. 관리자에게 문의하세요');
      } else if (e.code === 'auth/popup-blocked') {
        showError('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요');
      } else {
        showError('로그인 중 오류가 발생했습니다: ' + e.message);
      }
    }

    async function doGoogleLogin() {
      hideError();
      btn.disabled = true;
      // 리다이렉트 로그인 후 결과가 유실돼도 '방금 로그인한 것'임을 알 수 있도록 표시
      sessionStorage.setItem('hw-login-pending', '1');
      try {
        const result = await FS.loginWithGoogle();
        if (!result) return; // 리다이렉트 방식: 페이지 이동 후 아래 bootstrap에서 처리
        await FS.completeLogin(result);
        window.location.replace('/');
      } catch (e) {
        sessionStorage.removeItem('hw-login-pending');
        handleLoginError(e);
        btn.disabled = false;
      }
    }

    // 리다이렉트 로그인 결과를 먼저 처리한 뒤 로그인 상태 확인
    (async () => {
      const btnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = '로그인 확인 중...';
      try {
        const result = await FS.handleRedirectResult();
        if (result && result.user) {
          await FS.completeLogin(result);
          window.location.replace('/');
          return;
        }
      } catch (e) {
        handleLoginError(e);
      }
      btn.innerHTML = btnHtml;
      btn.disabled = false;

      // 로그인 페이지에서 로그인된 상태:
      // - 방금 로그인(hw-login-pending) → 그대로 진행 (모바일에서 리다이렉트 결과가 유실돼도 인증은 끝남)
      // - 뒤로가기로 옴 → 앱으로 보내지 않고 계속 뒤로
      // - 직접 열었는데 30분 넘게 미사용 → 로그아웃
      let handled = false;
      const IDLE_MS = 30 * 60 * 1000;
      FS.onAuthChanged(async user => {
        if (!user || handled) return;
        handled = true;
        const pending = sessionStorage.getItem('hw-login-pending');
        sessionStorage.removeItem('hw-login-pending');
        if (!pending) {
          // 방금 로그인한 게 아님 → 뒤로가기로 왔으면 계속 뒤로 (앱 종료 방향)
          if (cameBack) { history.back(); return; }
          // 30분 넘게 쓰지 않은 세션으로 /login을 직접 열면 자동 로그아웃 우회가 되므로 로그아웃
          const last = parseInt(localStorage.getItem('hw-last-active') || '0');
          if (Date.now() - last > IDLE_MS) {
            await FS.logout();
            location.reload();   // logout()이 Firestore를 종료하므로 새로 불러와 로그인 화면으로
            return;
          }
        }
        btn.disabled = true;
        btn.textContent = '로그인 중...';
        try {
          await FS.completeLogin({ user });
          window.location.replace('/');
        } catch (e) {
          handled = false;
          handleLoginError(e);
          btn.innerHTML = btnHtml;
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
