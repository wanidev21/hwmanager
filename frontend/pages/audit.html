<!-- 변경 이력: 티켓·장비·고객사·프로젝트의 등록·수정·삭제 (누가·언제·무엇을). 추가 전용 기록 -->
<style>
  .au-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .au-chip { height:36px; padding:0 12px; border:1px solid var(--ink); background:var(--surface); color:var(--text); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .au-chip.on { background:var(--ink); color:var(--bg); }
  html[data-theme="dark"] .au-chip.on { background:#ECEAE4; color:#111111; }
  .au-list { border:1px solid var(--ink); background:var(--surface); }
  .au-row { display:grid; grid-template-columns:120px 64px 70px minmax(0,1fr) 110px; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid var(--border); font-size:13px; }
  .au-row:first-child { border-top:none; }
  .au-time { font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--text-sub); }
  .au-act { font-size:11px; font-weight:700; padding:2px 6px; border:1px solid var(--ink); text-align:center; }
  .au-act.a-등록 { background:var(--success-bg); color:var(--success); border-color:var(--success); }
  .au-act.a-수정 { background:var(--surface-2); color:var(--text-sub); border-color:var(--border); }
  .au-act.a-삭제 { background:var(--primary); color:#111111; }
  .au-entity { font-size:12px; font-weight:700; color:var(--text-sub); }
  .au-label { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .au-detail { display:block; font-size:12px; font-weight:400; color:var(--text-hint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .au-by { font-size:12px; color:var(--text-sub); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .au-more { display:block; width:100%; margin-top:10px; }
  @media (max-width:768px) {
    .au-row { grid-template-columns:auto auto minmax(0,1fr); grid-template-areas:"time act ent" "label label label" "by by by"; row-gap:4px; }
    .au-time { grid-area:time; } .au-act { grid-area:act; } .au-entity { grid-area:ent; }
    .au-label { grid-area:label; white-space:normal; } .au-by { grid-area:by; text-align:left; }
    .au-chip { height:40px; }
  }
</style>

<div class="au-toolbar">
  <div id="au-actions" class="flex gap-1" style="flex-wrap:wrap;"></div>
  <div id="au-entities" class="flex gap-1" style="flex-wrap:wrap;"></div>
  <input type="search" class="form-input" id="au-q" placeholder="이름·hostname·작업자 검색" oninput="renderAudit()" style="flex:1 1 200px;min-width:0;">
</div>

<div class="au-list" id="au-list"></div>
<div id="au-empty" class="empty-state" style="display:none;"><div class="empty-icon"></div><div>기록이 없습니다</div></div>
<button class="btn au-more" id="au-more" onclick="loadAudit(true)" style="display:none;">더 보기</button>

<script>
FS.requireAuth();

let auRows = [];
let auLast = null;          // 페이지 나눔 커서
let auAction = '';
let auEntity = '';
const AU_PAGE = 200;

function init() {
  auRows = []; auLast = null; auAction = ''; auEntity = '';
  document.getElementById('au-q').value = '';
  renderAuditFilters();
  loadAudit(false);
}

// 이력은 계속 쌓이므로 실시간 구독 대신 최근 것부터 나눠서 조회
async function loadAudit(more) {
  try {
    let q = firebase.firestore().collection('audit_logs').orderBy('at', 'desc').limit(AU_PAGE);
    if (more && auLast) q = q.startAfter(auLast);
    const snap = await q.get();
    if (!document.getElementById('au-list')) return;   // 그 사이 다른 화면으로 이동
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    auRows = more ? auRows.concat(rows) : rows;
    auLast = snap.docs[snap.docs.length - 1] || auLast;
    document.getElementById('au-more').style.display = snap.size === AU_PAGE ? '' : 'none';
    renderAudit();
  } catch (e) {
    Toast.error('변경 이력을 불러오지 못했습니다: ' + (e.code || e.message));
  }
}

function renderAuditFilters() {
  const chip = (val, cur, fn, label) =>
    `<button class="au-chip${val === cur ? ' on' : ''}" onclick="${fn}('${val}')">${label}</button>`;
  document.getElementById('au-actions').innerHTML =
    ['', '등록', '수정', '삭제'].map(a => chip(a, auAction, 'setAuAction', a || '전체 작업')).join('');
  document.getElementById('au-entities').innerHTML =
    ['', '티켓', '작업', '장비', '고객사', '프로젝트'].map(a => chip(a, auEntity, 'setAuEntity', a || '전체 대상')).join('');
}
function setAuAction(a) { auAction = a; renderAuditFilters(); renderAudit(); }
function setAuEntity(a) { auEntity = a; renderAuditFilters(); renderAudit(); }

function auFmt(ts) {
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
  if (!d) return '';
  const p = n => String(n).padStart(2, '0');
  return `${String(d.getFullYear()).slice(2)}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderAudit() {
  const q = document.getElementById('au-q').value.trim().toLowerCase();
  const list = auRows.filter(r =>
    (!auAction || r.action === auAction) &&
    (!auEntity || r.entity === auEntity) &&
    (!q || [r.label, r.detail, r.by_name].some(v => String(v || '').toLowerCase().includes(q))));
  document.getElementById('au-empty').style.display = list.length ? 'none' : '';
  document.getElementById('au-list').style.display = list.length ? '' : 'none';
  document.getElementById('au-list').innerHTML = list.map(r => `
    <div class="au-row">
      <span class="au-time">${auFmt(r.at)}</span>
      <span class="au-act a-${FS.esc(r.action)}">${FS.esc(r.action)}</span>
      <span class="au-entity">${FS.esc(r.entity)}</span>
      <span class="au-label">${FS.esc(r.label || '-')}${r.detail ? `<span class="au-detail">${FS.esc(r.detail)}</span>` : ''}</span>
      <span class="au-by">${FS.esc(r.by_name || '')}</span>
    </div>`).join('');
}

init();
</script>
