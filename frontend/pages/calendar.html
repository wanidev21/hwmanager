<!-- 캘린더: 내 일정(개인) + 팀 작업 일정 (Google 캘린더 연동 없음) -->
<style>
/* 일정 색상 중 토큰에 없는 빨강·보라 (다크모드 보정 포함) */
:root { --ev-red-bg:#FFE1D6; --ev-red-text:#B8340B; --ev-purple-bg:#EDE3FF; --ev-purple-text:#5B2A9E; }
html[data-theme="dark"] { --ev-red-bg:#3A1A10; --ev-red-text:#FF8A5C; --ev-purple-bg:#2A1F40; --ev-purple-text:#C9A8FF; }
.cal-wrap { display:flex; flex-direction:column; height:calc(100vh - 120px); min-height:560px; }
@media (max-width:768px) {
  .cal-wrap { height:calc(100dvh - 120px); min-height:400px; }
  .cal-month-label { font-size:16px; min-width:110px; }
  .cal-nav, .cal-today-btn { height:40px; }
  .cal-nav { width:40px; }
}

/* ── 툴바 ── */
.cal-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.cal-month-label { font-family:var(--font-heading); font-size:18px; font-weight:800; color:var(--text); min-width:140px; text-align:center; }
.cal-nav {
  width:32px; height:32px; border-radius:0; border:2px solid var(--ink);
  background:var(--surface); color:var(--text); font-size:16px; font-weight:800; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background 0.1s;
}
.cal-nav:hover { background:var(--bg); }
.cal-today-btn {
  height:32px; padding:0 12px; border-radius:0; border:2px solid var(--ink);
  background:var(--surface); color:var(--text); font-size:12px; font-weight:800;
  cursor:pointer; font-family:inherit; transition:background 0.1s;
}
.cal-today-btn:hover { background:var(--bg); }
.cal-spacer { flex:1; }

/* ── 요일 헤더 ── */
.cal-week-header {
  display:grid; grid-template-columns:repeat(7,1fr);
  border:2px solid var(--ink); border-bottom:none; border-radius:0; overflow:hidden;
}
/* 요일 머리줄: 검정 띠 (테마 무관) → 주말 색은 검정 위에서 읽히는 밝은 값 */
.cal-week-header div {
  padding:8px 0; text-align:center; font-size:11px; font-weight:800;
  color:#ECEAE4; background:#111111; letter-spacing:0.04em;
}
.cal-week-header div:first-child { color:#FF8A5C; }
.cal-week-header div:last-child  { color:#9DB5FF; }

/* ── 그리드 ── */
.cal-grid {
  display:grid; grid-template-columns:repeat(7,1fr);
  flex:1; border:2px solid var(--ink); border-top:none;
  border-radius:0; overflow:hidden;
}
.cal-cell {
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  padding:6px 7px; cursor:pointer; min-height:110px;
  transition:background 0.1s; overflow:hidden;
  display:flex; flex-direction:column; gap:2px;
}
.cal-cell:nth-child(7n)   { border-right:none; }
.cal-cell:hover           { background:var(--bg); }
.cal-cell.cal-other       { background:var(--surface-2); cursor:default; }
.cal-cell.cal-other:hover { background:var(--surface-2); }
.cal-cell.cal-today       { background:var(--primary-light); }
.cal-cell.cal-today:hover { background:var(--primary-light); }

.cal-date-num {
  font-size:12px; font-weight:500; color:var(--text-sub);
  width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  border-radius:0; margin-bottom:2px; flex-shrink:0;
}
.cal-date-num.is-today { background:var(--primary); color:#111111; font-weight:800; border-radius:0; }
.cal-date-num.is-sun   { color:var(--danger); }
.cal-date-num.is-sat   { color:var(--info); }

.cal-event-pill {
  font-size:11px; font-weight:500; padding:2px 6px; border-radius:0;
  cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.5;
}
.cal-event-pill:hover { filter:brightness(0.93); }
.cal-more {
  font-size:10px; color:var(--text-hint); padding:1px 4px; cursor:pointer; font-weight:500;
}
.cal-more:hover { color:var(--primary-text); }
.cal-event-pill.is-job { border-left:3px solid #111111; font-weight:700; }
.cal-event-pill.is-done { opacity:.55; text-decoration:line-through; }
.cal-legend { display:flex; gap:12px; font-size:11px; font-weight:700; color:var(--text-sub); }
.cal-legend i { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; border:1.5px solid var(--ink); }
.cal-loading { grid-column:span 7; display:flex; align-items:center; justify-content:center; padding:40px; color:var(--text-hint); font-size:13px; }

/* ── 날짜별 일정 목록 모달 ── */
.day-ev-list { display:flex; flex-direction:column; gap:5px; max-height:360px; overflow-y:auto; }
.day-ev-item {
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border-radius:0; cursor:pointer; border:1px solid var(--border); transition:background 0.1s;
}
.day-ev-item:hover { background:var(--bg); }
.day-ev-dot { width:9px; height:9px; border-radius:0; flex-shrink:0; }
.day-ev-info { flex:1; min-width:0; }
.day-ev-title { font-size:13px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.day-ev-meta { font-size:11px; color:var(--text-hint); margin-top:1px; }
.day-ev-time { font-size:11px; color:var(--text-hint); white-space:nowrap; flex-shrink:0; }
/* ── 모달 ── */
.ev-color-picker { display:flex; gap:10px; align-items:center; margin-top:4px; flex-wrap:wrap; }
.ev-color-dot {
  width:32px; height:32px; border-radius:0; border:2px solid var(--ink);
  cursor:pointer; flex-shrink:0; transition:outline-color 0.1s;
  outline:3px solid transparent; outline-offset:2px;
}
.ev-color-dot:hover    { outline-color:var(--border); }
.ev-color-dot.selected { outline-color:var(--signal); }
/* ── 모바일: 달력은 점으로 압축, 날짜를 누르면 그날 일정 목록 ── */
.cal-dots { display:none; }
@media (max-width:768px) {
  .cal-wrap { height:auto; min-height:0; }
  .cal-toolbar { gap:6px; }
  .cal-grid { flex:none; }
  .cal-cell { min-height:58px; padding:4px 2px 6px; align-items:center; gap:3px; }
  .cal-cell:hover { background:transparent; }
  .cal-cell.cal-today:hover { background:var(--primary-light); }
  .cal-cell:not(.cal-other):active { background:var(--bg); }
  .cal-cell .cal-event-pill, .cal-cell .cal-more { display:none; }
  .cal-date-num { font-size:13px; width:26px; height:26px; margin-bottom:0; }
  .cal-dots { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:3px; max-width:100%; }
  .cal-dot { width:6px; height:6px; border-radius:0; flex-shrink:0; }
  .ev-color-dot { width:40px; height:40px; }
  .cal-dot-more { font-size:9px; line-height:1; color:var(--text-sub); font-weight:600; }
  .day-ev-item { padding:12px; }
  .day-ev-title { white-space:normal; }
  .day-ev-list { max-height:60vh; }
}
</style>

<div class="cal-wrap">
  <!-- 툴바 -->
  <div class="cal-toolbar">
    <button class="cal-nav" onclick="prevMonth()" aria-label="이전 달">‹</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button class="cal-nav" onclick="nextMonth()" aria-label="다음 달">›</button>
    <button class="cal-today-btn" onclick="goToday()">오늘</button>
    <div class="cal-legend"><span><i style="background:var(--info-bg);"></i>내 일정</span><span><i style="background:var(--primary);"></i>팀 작업</span></div>
    <div class="cal-spacer"></div>
    <button class="btn btn-primary" onclick="openEventModal(null,'')">+ 일정 추가</button>
  </div>

  <!-- 요일 헤더 -->
  <div class="cal-week-header">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>
  <div class="cal-grid" id="cal-grid">
    <div class="cal-loading">불러오는 중...</div>
  </div>
</div>

<!-- 일정 모달 (내 일정만. 팀 작업은 작업 일정 화면에서) -->
<div class="modal-overlay" id="ev-modal" style="display:none;" onclick="if(event.target===this)closeEventModal()">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3 id="ev-modal-title">새 일정</h3>
      <button class="modal-close" onclick="closeEventModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">제목 *</label>
        <input type="text" class="form-input" id="f-ev-title" placeholder="일정 제목">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">날짜 *</label>
          <input type="date" class="form-input" id="f-ev-date">
        </div>
        <div class="form-group">
          <label class="form-label">시작</label>
          <input type="time" class="form-input" id="f-ev-start">
        </div>
        <div class="form-group">
          <label class="form-label">종료</label>
          <input type="time" class="form-input" id="f-ev-end">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea class="form-textarea" id="f-ev-desc" rows="2" placeholder="상세 내용 (선택)"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">색상</label>
        <div class="ev-color-picker">
          <div class="ev-color-dot" data-color="blue"   style="background:var(--info);" onclick="setEvColor('blue')"></div>
          <div class="ev-color-dot" data-color="orange" style="background:var(--primary);" onclick="setEvColor('orange')"></div>
          <div class="ev-color-dot" data-color="green"  style="background:var(--success);" onclick="setEvColor('green')"></div>
          <div class="ev-color-dot" data-color="red"    style="background:var(--ev-red-text);" onclick="setEvColor('red')"></div>
          <div class="ev-color-dot" data-color="purple" style="background:var(--ev-purple-text);" onclick="setEvColor('purple')"></div>
        </div>
        <input type="hidden" id="f-ev-color" value="blue">
      </div>
      <div class="text-hint" style="font-size:12px;">내 일정은 나만 봅니다. 팀이 함께 보는 현장 작업은 '작업 일정'에 등록하세요.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete-ev" onclick="deleteEvent()" style="margin-right:auto;display:none;">삭제</button>
      <button class="btn" onclick="closeEventModal()">닫기</button>
      <button class="btn btn-primary" id="btn-save-ev" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- 날짜별 전체 일정 모달 -->
<div class="modal-overlay" id="day-events-modal" style="display:none;" onclick="if(event.target===this)closeDayEventsModal()">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3 id="day-events-title"></h3>
      <button class="modal-close" onclick="closeDayEventsModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="day-ev-list" id="day-ev-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDayEventsModal()">닫기</button>
      <button class="btn btn-primary" onclick="closeDayEventsModal();setTimeout(()=>openEventModal(null,_dayEventsDate),50)">+ 일정 추가</button>
    </div>
  </div>
</div>

<script>
FS.requireAuth();

// 화면 표시용 색 (Firestore에는 키 이름만 저장). 토큰이라 라이트·다크 모두 대응
const EV_COLORS = {
  blue:   { bg:'var(--info-bg)',       text:'var(--info)',           dot:'var(--info)' },
  orange: { bg:'var(--primary)',       text:'#111111',               dot:'var(--primary)' },
  green:  { bg:'var(--success-bg)',    text:'var(--success)',        dot:'var(--success)' },
  red:    { bg:'var(--ev-red-bg)',     text:'var(--ev-red-text)',    dot:'var(--ev-red-text)' },
  purple: { bg:'var(--ev-purple-bg)',  text:'var(--ev-purple-text)', dot:'var(--ev-purple-text)' },
};

let curYear, curMonth;
let fsEvents       = [];   // 내 일정 (calendar_events, 본인 것만)
let jobEvents      = [];   // 팀 작업 일정 (jobs) — 누르면 작업 일정 화면으로
let editingId      = null;
let calSaving      = false;
let _dayEventsDate = '';

function init() {
  const now = new Date();
  curYear = now.getFullYear(); curMonth = now.getMonth();
  editingId = null; calSaving = false;
  // 뒤로 가기로 돌아온 경우 보던 달
  if (window.hwPageFilter && window.hwPageFilter.page === 'calendar') {
    const m = /^(\d{4})-(\d{1,2})$/.exec(window.hwPageFilter.ym || '');
    if (m) { curYear = +m[1]; curMonth = +m[2]; }
    window.hwPageFilter = null;
  }
  const uid = FS.getCurrentUser()?.uid;
  FS.watch([['calendar_events', [['user_id', '==', uid]]], ['jobs']], ([events, jobs]) => {
    fsEvents = events;
    jobEvents = jobs.filter(j => j.date && j.status !== '취소').map(j => {
      const items = Object.values(j.items || {});
      return {
        id: 'job:' + j.id, source: 'job', done: j.status === '완료',
        date: j.date, start_time: j.time || '', title: j.title || '',
        meta: ['팀 작업', j.assignee, items.length ? `준비 ${items.filter(i => i.done).length}/${items.length}` : '', j.status === '완료' ? '완료' : '']
          .filter(Boolean).join(' · '),
      };
    });
    renderCalendar();
    if (document.getElementById('day-events-modal').style.display === 'flex') openDayEventsModal(_dayEventsDate);
  });
}

function pageViewState() {
  return { filter: { ym: `${curYear}-${curMonth}` }, label: '캘린더' };
}

function allEvents() { return [...fsEvents, ...jobEvents]; }

function prevMonth() { if (--curMonth < 0) { curMonth = 11; curYear--; } renderCalendar(); }
function nextMonth() { if (++curMonth > 11) { curMonth = 0; curYear++; } renderCalendar(); }
function goToday()   { const n = new Date(); curYear = n.getFullYear(); curMonth = n.getMonth(); renderCalendar(); }

function evPillStyle(ev) {
  const c = ev.source === 'job' ? EV_COLORS.orange : (EV_COLORS[ev.color] || EV_COLORS.blue);
  return `background:${c.bg};color:${c.text};`;
}
function evDotColor(ev) {
  if (ev.source === 'job') return 'var(--ink)';
  return EV_COLORS[ev.color]?.dot || EV_COLORS.blue.dot;
}
function evLabel(ev) { return ev.source === 'job' ? '작업 · ' + ev.title : ev.title; }

function renderCalendar() {
  if (!document.getElementById('cal-grid')) return;
  const label = new Date(curYear, curMonth, 1)
    .toLocaleDateString('ko-KR', { year:'numeric', month:'long' });
  document.getElementById('cal-month-label').textContent = label;

  const firstWd     = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const prevDays    = new Date(curYear, curMonth, 0).getDate();
  const todayStr    = FS.localDate();
  const ym          = `${curYear}-${pad(curMonth+1)}`;

  const byDate = {};
  allEvents().filter(e => (e.date || '').startsWith(ym)).forEach(e => {
    (byDate[e.date] = byDate[e.date] || []).push(e);
  });
  Object.values(byDate).forEach(arr =>
    arr.sort((a,b) => (a.start_time||'').localeCompare(b.start_time||''))
  );

  let html = '';
  for (let i = 0; i < firstWd; i++) {
    html += `<div class="cal-cell cal-other"><div class="cal-date-num" style="opacity:.3;">${prevDays - firstWd + 1 + i}</div></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds   = `${ym}-${pad(d)}`;
    const isTd = ds === todayStr;
    const wd   = (firstWd + d - 1) % 7;
    const evs  = byDate[ds] || [];
    const numCls = ['cal-date-num',
      isTd              && 'is-today',
      !isTd && wd === 0 && 'is-sun',
      !isTd && wd === 6 && 'is-sat',
    ].filter(Boolean).join(' ');

    let evHtml = evs.slice(0, 3).map(ev => {
      const timeTag = ev.start_time ? `<span style="opacity:.65;font-size:10px;">${escHtml(ev.start_time)} </span>` : '';
      return `<div class="cal-event-pill${ev.source === 'job' ? ' is-job' : ''}${ev.done ? ' is-done' : ''}" style="${evPillStyle(ev)}"
        onclick="openEventModal('${ev.id}',null);event.stopPropagation();"
        title="${escHtml(evLabel(ev))}">${timeTag}${escHtml(evLabel(ev))}</div>`;
    }).join('');
    if (evs.length > 3) {
      evHtml += `<div class="cal-more" onclick="openDayEventsModal('${ds}');event.stopPropagation();">+${evs.length - 3}개 더</div>`;
    }
    // 모바일용 점 표시 (최대 3개 + 개수)
    if (evs.length) {
      evHtml += `<div class="cal-dots">${evs.slice(0, 3).map(ev =>
        `<span class="cal-dot" style="background:${evDotColor(ev)};"></span>`
      ).join('')}${evs.length > 3 ? `<span class="cal-dot-more">+${evs.length - 3}</span>` : ''}</div>`;
    }
    html += `<div class="cal-cell${isTd ? ' cal-today' : ''}" onclick="onCalCellClick('${ds}')">
      <div class="${numCls}">${d}</div>${evHtml}</div>`;
  }
  const rem = (firstWd + daysInMonth) % 7;
  for (let i = 1; i <= (rem ? 7 - rem : 0); i++) {
    html += `<div class="cal-cell cal-other"><div class="cal-date-num" style="opacity:.3;">${i}</div></div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function calIsMobile() { return window.matchMedia('(max-width:768px)').matches; }

// 날짜 칸 클릭: PC는 바로 새 일정, 폰은 그날 일정 목록(+ 추가 버튼)
function onCalCellClick(ds) {
  if (calIsMobile()) openDayEventsModal(ds);
  else openEventModal(null, ds);
}

// ── 날짜별 전체 일정 ──
function openDayEventsModal(dateStr) {
  _dayEventsDate = dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('day-events-title').textContent =
    d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
  const evs = allEvents().filter(e => e.date === dateStr)
    .sort((a,b) => (a.start_time||'').localeCompare(b.start_time||''));
  document.getElementById('day-ev-list').innerHTML = evs.map(ev => {
    const timeStr = ev.start_time ? escHtml(`${ev.start_time}${ev.end_time ? '–' + ev.end_time : ''}`) : '종일';
    return `<div class="day-ev-item" onclick="closeDayEventsModal();setTimeout(()=>openEventModal('${ev.id}',null),50)">
      <div class="day-ev-dot" style="background:${evDotColor(ev)};"></div>
      <div class="day-ev-info">
        <div class="day-ev-title">${escHtml(evLabel(ev))}</div>
        ${ev.meta ? `<div class="day-ev-meta">${escHtml(ev.meta)}</div>` : ''}
      </div>
      <div class="day-ev-time">${timeStr}</div>
    </div>`;
  }).join('') || '<p style="color:var(--text-hint);font-size:13px;text-align:center;padding:20px 0;">일정이 없습니다</p>';
  document.getElementById('day-events-modal').style.display = 'flex';
}
function closeDayEventsModal() { document.getElementById('day-events-modal').style.display = 'none'; }

// ── 일정 모달 ──
function openEventModal(id, dateStr) {
  if (id && id.startsWith('job:')) {   // 팀 작업은 작업 일정 화면에서 보고 고침
    window.hwPageFilter = { page: 'jobs', jobId: id.slice(4) };
    loadPage('jobs');
    return;
  }
  editingId = id || null;
  ['f-ev-title','f-ev-start','f-ev-end','f-ev-desc'].forEach(i => document.getElementById(i).value = '');
  setEvColor('blue');
  if (id) {
    const ev = fsEvents.find(e => e.id === id);
    if (!ev) return;
    document.getElementById('ev-modal-title').textContent = '일정 수정';
    document.getElementById('f-ev-title').value = ev.title       || '';
    document.getElementById('f-ev-date').value  = ev.date        || '';
    document.getElementById('f-ev-start').value = ev.start_time  || '';
    document.getElementById('f-ev-end').value   = ev.end_time    || '';
    document.getElementById('f-ev-desc').value  = ev.description || '';
    setEvColor(ev.color || 'blue');
    document.getElementById('btn-delete-ev').style.display = '';
  } else {
    document.getElementById('ev-modal-title').textContent = '새 일정';
    document.getElementById('f-ev-date').value = dateStr || FS.localDate();   // 날짜 미지정(+ 일정 추가) → 오늘
    document.getElementById('btn-delete-ev').style.display = 'none';
  }
  document.getElementById('ev-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('f-ev-title').focus(), 50);
}
function closeEventModal() { document.getElementById('ev-modal').style.display = 'none'; }

function setEvColor(color) {
  document.getElementById('f-ev-color').value = color;
  document.querySelectorAll('.ev-color-dot').forEach(el =>
    el.classList.toggle('selected', el.dataset.color === color)
  );
}

// ── 저장 (서버 응답을 기다리지 않음: 오프라인이어도 바로 반영) ──
function saveEvent() {
  if (calSaving) return;
  const title = document.getElementById('f-ev-title').value.trim();
  const date  = document.getElementById('f-ev-date').value;
  if (!title) { Toast.error('제목을 입력하세요'); return; }
  if (!date)  { Toast.error('날짜를 입력하세요'); return; }
  const data = {
    user_id: FS.getCurrentUser().uid,
    color: document.getElementById('f-ev-color').value || 'blue',
    year_month: date.slice(0, 7),
    title, date,
    start_time:  document.getElementById('f-ev-start').value,
    end_time:    document.getElementById('f-ev-end').value,
    description: document.getElementById('f-ev-desc').value.trim(),
  };
  if (data.start_time && data.end_time && data.end_time < data.start_time) {
    Toast.error('종료 시간이 시작 시간보다 빠릅니다'); return;
  }
  calSaving = true;
  setTimeout(() => { calSaving = false; }, 800);   // 두 번 탭해 중복 저장 방지
  if (editingId) {
    FS.updateNow('calendar_events', editingId, data);
    const idx = fsEvents.findIndex(e => e.id === editingId);
    if (idx >= 0) fsEvents[idx] = { ...fsEvents[idx], ...data };
    Toast.success('수정되었습니다');
  } else {
    const newId = FS.addNow('calendar_events', data);
    if (!fsEvents.some(e => e.id === newId)) fsEvents.push({ id: newId, ...data });
    Toast.success('일정이 추가되었습니다');
  }
  renderCalendar();
  closeEventModal();
}

async function deleteEvent() {
  if (!editingId) return;
  if (!await Dialog.confirm('이 일정을 삭제하시겠습니까?', true)) return;
  try { await FS.remove('calendar_events', editingId); }
  catch (e) { Toast.error('삭제 실패: ' + (e.code || e.message)); return; }
  fsEvents = fsEvents.filter(e => e.id !== editingId);
  renderCalendar(); closeEventModal();
  Toast.success('삭제되었습니다');
}

// ── 키보드 ── (스크립트는 최초 진입 때 한 번만 실행되므로 리스너가 다른 화면에서도 남음 → 캘린더 화면일 때만)
document.addEventListener('keydown', e => {
  if (!document.getElementById('cal-grid')) return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if ([...document.querySelectorAll('.modal-overlay')].some(m => getComputedStyle(m).display !== 'none')) return;
  if (e.key === 'ArrowLeft')  prevMonth();
  if (e.key === 'ArrowRight') nextMonth();
});

function pad(n)    { return String(n).padStart(2,'0'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
