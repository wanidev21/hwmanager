<!-- 고객사·프로젝트·장비 -->
<style>
.cust-layout { display:flex; gap:16px; align-items:flex-start; }
.cust-col-left { width:290px; flex-shrink:0; }
.cust-col-right { flex:1; min-width:0; }
@media (max-width:960px) {
  .cust-layout { flex-direction:column; }
  .cust-col-left { width:100%; }
  #cust-list { max-height:none !important; }   /* 세로 배치에서는 목록 안쪽 스크롤(이중 스크롤) 없이 */
}
/* 장비 검색 결과 */
.asset-hit { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
.asset-hit:hover { background:var(--bg); }
.asset-hit-name { font-size:13px; font-weight:600; color:var(--text); }
.asset-hit-meta { font-size:11px; color:var(--text-hint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hit-group { padding:6px 14px; font-size:11px; font-weight:600; color:var(--text-hint); background:var(--bg); border-bottom:1px solid var(--border); }
/* 고객사 담당자 연락처 */
.cust-contact { display:flex; flex-wrap:wrap; gap:6px 14px; padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-sub); }
.cust-contact a { color:var(--primary-text); text-decoration:none; font-weight:500; }
/* 장비 상세 (읽기 전용) */
.av-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px 16px; }
.av-item { min-width:0; }
.av-label { font-size:10px; font-weight:600; color:var(--text-hint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.av-val { font-size:13px; color:var(--text); word-break:break-all; user-select:text; }
.av-full { grid-column:1 / -1; }
/* 워런티 기간 편집 */
.wp-row { display:grid; grid-template-columns:96px minmax(0,1fr) minmax(0,1fr) 36px; gap:6px; align-items:center; margin-bottom:6px; }
.wp-row .wp-memo { grid-column:2 / 4; }
.wp-del { width:36px; height:36px; border:1.5px solid var(--ink); background:var(--surface); color:var(--text-sub); display:flex; align-items:center; justify-content:center; cursor:pointer; }
@media (max-width:768px) { .wp-row { grid-template-columns:84px minmax(0,1fr) 36px; } .wp-row .wp-end { grid-column:2 / 3; } .wp-row .wp-memo { grid-column:2 / 3; } }
.wp-sub { font-size:11px; color:var(--text-hint); font-weight:600; }
.cust-item {
  padding:10px 14px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background 0.1s;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.cust-item:last-child { border-bottom:none; }
.cust-item:hover { background:var(--bg); }
.cust-item.active { background:var(--signal); border-left:6px solid var(--ink); padding-left:8px; }
html[data-theme="dark"] .cust-item.active { color:#111111; }
html[data-theme="dark"] .cust-item.active .btn-ghost { color:#111111 !important; }
.mono-cell { font-family:var(--font-mono); font-size:12px; }
html[data-theme="dark"] .cust-item.active .cust-item-name, html[data-theme="dark"] .cust-item.active .cust-item-meta { color:#111111; }
.cust-item-info { flex:1; min-width:0; }
.cust-item-name { font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cust-item-meta { font-size:11px; color:var(--text-hint); margin-top:2px; }
.cust-item-actions { display:none; gap:3px; flex-shrink:0; }
.cust-item:hover .cust-item-actions { display:flex; }
.cust-item.active .cust-item-actions { display:flex; }

.panel-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap;
}
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:13px; overflow:hidden; flex:1; min-width:0; }
.bc-link { color:var(--primary-text); cursor:pointer; font-weight:500; white-space:nowrap; flex-shrink:0; }
.bc-link:hover { text-decoration:underline; }
.bc-cur { font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bc-sep { color:var(--text-hint); flex-shrink:0; }
  /* 장비 이력 타임라인 */
  .av-tl { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--border); font-size:13px; }
  .av-tl.link { cursor:pointer; }
  .av-tl.link:hover { background:var(--surface-2); }
  .av-tl.future .av-tl-date { color:var(--primary-text); }
  .av-tl-date { font-family:var(--font-mono); font-size:11px; color:var(--text-hint); white-space:nowrap; }
  .av-tl-kind { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:800; color:var(--text-sub); white-space:nowrap; }
  .av-tl-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .av-tl-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .av-tl-sub { font-size:11px; color:var(--text-hint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .av-tl-more { margin-top:8px; width:100%; }
  @media (max-width:768px) { .av-tl { padding:11px 0; } .av-tl-kind span { display:none; } }
</style>

<script>
FS.requireAuth();

let allCustomers     = [];
let allProjects      = [];
let allAssets        = [];
let selectedCustomerId = null;
let selectedProjectId  = null;
let avAssetId = null;   // 장비 상세 창에 표시 중인 장비

function daysLeft(dateStr) {
  if (!dateStr) return null;
  let d;
  if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    const [y, mo, dy] = dateStr.split('-').map(Number);
    d = new Date(y, mo - 1, dy);
  } else {
    d = dateStr.toDate ? dateStr.toDate() : new Date(dateStr);
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.ceil((d - today) / 86400000);
}

function warrantyBadge(dateStr) {
  const d = daysLeft(dateStr);
  if (d === null) return '<span class="badge badge-gray">-</span>';
  if (d < 0)    return '<span class="badge badge-danger">만료됨</span>';
  if (d <= 30)  return `<span class="badge badge-danger">${d}일</span>`;
  if (d <= 90)  return `<span class="badge badge-warning">${d}일</span>`;
  return `<span class="badge badge-success">${d}일</span>`;
}

function escHtml(s) { return FS.esc(s); }   // 숫자 등 문자열이 아닌 값도 안전하게

function init() {
  // 페이지 재진입 시 패널은 초기 상태로 그려지므로 선택도 초기화
  selectedCustomerId = null;
  selectedProjectId  = null;
  avAssetId = null;
  // 홈 검색에서 장비를 눌러 들어온 경우: 첫 데이터가 오면 해당 장비 상세 열기
  // 뒤로 가기로 돌아온 경우: 보던 고객사·프로젝트·장비·검색어 복원
  let pending = null;
  if (window.hwPageFilter && window.hwPageFilter.page === 'customers') {
    pending = { ...window.hwPageFilter };
    document.getElementById('cust-search').value = pending.q || '';
    window.hwPageFilter = null;
  }
  FS.watch([['customers'], ['projects'], ['assets']], ([custs, projs, assets]) => {
    allCustomers = custs;
    allProjects  = projs;
    allAssets    = assets;
    allCustomers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    // 다른 기기에서 선택 중인 항목이 삭제된 경우
    if (selectedCustomerId && !allCustomers.some(c => c.id === selectedCustomerId)) {
      selectedCustomerId = null; selectedProjectId = null;
      showPanel('none');
    } else if (selectedProjectId && !allProjects.some(p => p.id === selectedProjectId)) {
      selectedProjectId = null;
      showPanel('projects');
    }

    renderCustomers();
    if (document.getElementById('proj-panel').style.display !== 'none') renderProjects();
    if (document.getElementById('asset-panel').style.display !== 'none') renderAssets();
    if (pending) {
      const p = pending; pending = null;
      if (p.assetId && allAssets.some(a => a.id === p.assetId)) jumpToAsset(p.assetId);
      else if (p.projectId && allProjects.some(x => x.id === p.projectId)) {
        selectedCustomerId = allProjects.find(x => x.id === p.projectId).customer_id;
        renderCustomers();
        selectProject(p.projectId);
      } else if (p.customerId && allCustomers.some(c => c.id === p.customerId)) selectCustomer(p.customerId);
    }
  });
}

// 화면 상태 (뒤로 가기로 돌아왔을 때 복원 — index.html)
function pageViewState() {
  const avOpen = avAssetId && document.getElementById('asset-view-modal').style.display === 'flex';
  const a = avOpen ? allAssets.find(x => x.id === avAssetId) : null;
  const p = allProjects.find(x => x.id === selectedProjectId);
  const c = allCustomers.find(x => x.id === selectedCustomerId);
  return {
    filter: { customerId: selectedCustomerId, projectId: selectedProjectId, assetId: a ? a.id : null, q: document.getElementById('cust-search').value },
    key: a ? 'asset:' + a.id : '',
    label: a ? (a.hostname || '장비') : p ? (p.name || '프로젝트') : c ? (c.name || '고객사') : '고객사·자산',
  };
}

// ── 고객사 목록 ──────────────────────────────────────────────────────────────
function renderCustomers() {
  const q = (document.getElementById('cust-search').value || '').trim().toLowerCase();
  const has = v => String(v ?? '').toLowerCase().includes(q);
  const projHit = new Set(q ? allProjects.filter(p => has(p.name)).map(p => p.customer_id) : []);
  const data = allCustomers.filter(c =>
    !q || has(c.name) || has(c.contact) || projHit.has(c.id)
  );
  // 현장 조회용: Hostname · S/N · IP · 모델 · 위치로 장비 바로 찾기
  const hits = q ? allAssets.filter(a =>
    has(a.hostname) || has(a.serial) || has(a.ip_address) || has(a.model) || has(a.location)
  ).slice(0, 30) : [];
  const custName = id => (allCustomers.find(c => c.id === id) || {}).name || '-';
  const projName = id => (allProjects.find(p => p.id === id) || {}).name || '-';
  const hitHtml = hits.length ? `<div class="hit-group">장비 ${hits.length}건</div>` + hits.map(a => `
    <div class="asset-hit" onclick="jumpToAsset('${a.id}')">
      <div class="asset-hit-name">${FS.esc(a.hostname || '-')}</div>
      <div class="asset-hit-meta">${FS.esc(custName(a.customer_id))} › ${FS.esc(projName(a.project_id))}${a.ip_address ? ' · ' + FS.esc(a.ip_address) : ''}${a.serial ? ' · ' + FS.esc(a.serial) : ''}</div>
    </div>`).join('') + (data.length ? '<div class="hit-group">고객사</div>' : '') : '';

  document.getElementById('cust-empty').style.display = (data.length || hits.length) ? 'none' : '';
  document.getElementById('cust-list').innerHTML = hitHtml + data.map(c => {
    const projCount  = allProjects.filter(p => p.customer_id === c.id).length;
    const assetCount = allAssets.filter(a => a.customer_id === c.id).length;
    const active = selectedCustomerId === c.id ? ' active' : '';
    return `<div class="cust-item${active}" onclick="selectCustomer('${c.id}')">
      <div class="cust-item-info">
        <div class="cust-item-name">${escHtml(c.name || '')}</div>
        <div class="cust-item-meta">프로젝트 ${projCount}개 · 장비 ${assetCount}대</div>
      </div>
      <div class="cust-item-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="openCustModal('${c.id}')" aria-label="수정">${FS.icon('edit', 16)}</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteCustomer('${c.id}')" aria-label="삭제">${FS.icon('trash', 16)}</button>
      </div>
    </div>`;
  }).join('');
}

function selectCustomer(id) {
  selectedCustomerId = id;
  selectedProjectId  = null;
  renderCustomers();
  showPanel('projects');
  renderProjects();

}

// 장비 검색 결과 → 해당 고객사·프로젝트의 장비 목록 + 상세
function jumpToAsset(id) {
  const a = allAssets.find(x => x.id === id);
  if (!a) return;
  selectedCustomerId = a.customer_id;
  selectedProjectId  = a.project_id;
  renderCustomers();

}

    ['모델명', a.model], ['S/N', a.serial],
    ['IP', a.ip_address], ['위치', a.location],
    ['OS', a.os], ['CPU', a.cpu],
    ['메모리', a.memory], ['GPU', a.gpu],

// 이 장비의 이력 타임라인: 장애 티켓·작업 일정·변경 이력을 시간순으로 (1회 조회, 최근 것이 위)
const AV_TL_STEP = 8;
async function avLoadTickets(assetId) {
  const body = document.getElementById('av-body');
  const box = document.createElement('div');
  box.className = 'av-item av-full';
  box.innerHTML = '<div class="av-label">이력</div><div class="av-val" style="color:var(--text-hint);">불러오는 중...</div>';
  body.appendChild(box);
  const [tk, jb, au] = await Promise.allSettled([
    FS.getAll('tickets', [['asset_id', '==', assetId]]),
    FS.getAll('jobs', [['asset_id', '==', assetId]]),
    FS.getAll('audit_logs', [['entity_id', '==', assetId]]),
  ]);
  if (avAssetId !== assetId) return;   // 그 사이 다른 장비를 열었음
  const ms = v => !v ? 0 : typeof v === 'string' ? new Date(v + 'T00:00:00').getTime() : v.toDate ? v.toDate().getTime() : new Date(v).getTime();
  const TBADGE = { '접수':'badge-info','진행중':'badge-warning','처리중':'badge-warning','보류':'badge-gray','완료':'badge-success' };
  const JBADGE = { '예정':'badge-info','완료':'badge-success','취소':'badge-gray' };
  const rows = [];
  (tk.value || []).forEach(t => rows.push({
    t: ms(t.created_at), kind: '장애', icon: 'alert',
    title: t.title || '(제목 없음)', sub: [t.priority, t.assignee].filter(Boolean).join(' · '),
    badge: `<span class="badge ${TBADGE[t.status || '접수'] || 'badge-gray'}">${FS.esc(t.status || '접수')}</span>`,
    open: `window.hwPageFilter={page:'tickets',ticketId:'${t.id}'};loadPage('tickets')`,
  }));
  (jb.value || []).forEach(j => rows.push({
    t: ms(j.date) + (j.time ? (parseInt(j.time) || 0) * 3600000 : 0), kind: '작업', icon: 'tasks',
    title: j.title || '(제목 없음)', sub: [j.time, j.assignee].filter(Boolean).join(' · '),
    badge: `<span class="badge ${JBADGE[j.status || '예정'] || 'badge-gray'}">${FS.esc(j.status || '예정')}</span>`,
    open: `window.hwPageFilter={page:'jobs',jobId:'${j.id}'};loadPage('jobs')`,
  }));
  (au.value || []).forEach(x => rows.push({
    t: ms(x.at || x.created_at), kind: '기록', icon: 'edit',
    title: `장비 정보 ${x.action || ''}`, sub: [x.by_name, x.detail].filter(Boolean).join(' · '),
    badge: '', open: '',
  }));
  rows.sort((a, b) => b.t - a.t);
  const tCount = (tk.value || []).length, jCount = (jb.value || []).length;
  const head = `<div class="av-label">이력 <span style="font-weight:600;">${[tCount ? '장애 ' + tCount : '', jCount ? '작업 ' + jCount : ''].filter(Boolean).join(' · ')}</span></div>`;
  if (!rows.length) { box.innerHTML = head + '<div class="av-val" style="color:var(--text-hint);">이력 없음</div>'; return; }
  const now = Date.now();
  const row = r => `<div class="av-tl${r.open ? ' link' : ''}${r.t > now ? ' future' : ''}"${r.open ? ` onclick="${r.open}"` : ''}>
      <span class="av-tl-date">${r.t ? FS.formatDate(new Date(r.t)) : '-'}</span>
      <span class="av-tl-kind">${FS.icon(r.icon, 14)}<span>${r.kind}</span></span>
      <span class="av-tl-main"><span class="av-tl-title">${FS.esc(r.title)}</span>${r.sub ? `<span class="av-tl-sub">${FS.esc(r.sub)}</span>` : ''}</span>
      ${r.badge}
    </div>`;
  let shown = AV_TL_STEP;
  const draw = () => {
    box.innerHTML = head + rows.slice(0, shown).map(row).join('') +
      (rows.length > shown ? `<button class="btn btn-sm av-tl-more">이전 이력 ${rows.length - shown}건 더 보기</button>` : '');
    const more = box.querySelector('.av-tl-more');
    if (more) more.onclick = () => { shown += AV_TL_STEP * 2; draw(); };
  };
  draw();
}
function closeAssetView() { document.getElementById('asset-view-modal').style.display = 'none'; avAssetId = null; }

// 여러 문서를 원자적으로 삭제 (batch 한도 500 → 나눠서)
async function batchDelete(refs) {
  const db = firebase.firestore();
  for (let i = 0; i < refs.length; i += 450) {
    const batch = db.batch();
    refs.slice(i, i + 450).forEach(([col, id]) => batch.delete(db.collection(col).doc(id)));
    await batch.commit();
  }
}

// 삭제할 고객사에 연결된 티켓 수 (티켓은 함께 삭제하지 않고 안내만)
async function countLinkedTickets(customerId) {
  try { return (await FS.getAll('tickets', [['customer_id', '==', customerId]])).length; }
  catch (e) { return 0; }
}

// ── 고객사 CRUD ───────────────────────────────────────────────────────────────
function openCustModal(id) {
  document.getElementById('cust-modal-title').textContent = id ? '고객사 수정' : '고객사 등록';
  document.getElementById('f-cust-id').value = id || '';
  if (id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) { Toast.error('이미 삭제된 항목입니다'); return; }
    document.getElementById('f-cust-name').value    = c.name    || '';
    document.getElementById('f-cust-contact').value = c.contact || '';
    document.getElementById('f-cust-phone').value   = c.phone   || '';
    document.getElementById('f-cust-email').value   = c.email   || '';
    document.getElementById('f-cust-address').value = c.address || '';
    document.getElementById('f-cust-memo').value    = c.memo    || '';
  } else {
    ['f-cust-name','f-cust-contact','f-cust-phone','f-cust-email','f-cust-address','f-cust-memo']
      .forEach(i => document.getElementById(i).value = '');
  }
  document.getElementById('cust-modal').style.display = 'flex';
}
function closeCustModal() { document.getElementById('cust-modal').style.display = 'none'; }

async function saveCustomer() {
  const name = document.getElementById('f-cust-name').value.trim();
  if (!name) { Toast.error('고객사명을 입력하세요'); return; }
  const data = {
    name,
    contact: document.getElementById('f-cust-contact').value.trim(),
    phone:   document.getElementById('f-cust-phone').value.trim(),
    email:   document.getElementById('f-cust-email').value.trim(),
    address: document.getElementById('f-cust-address').value.trim(),
    memo:    document.getElementById('f-cust-memo').value.trim(),
  };
  const id = document.getElementById('f-cust-id').value;
  if (id) {
    await FS.update('customers', id, data);
    FS.audit('수정', '고객사', id, data.name);
    const idx = allCustomers.findIndex(x => x.id === id);
    if (idx >= 0) allCustomers[idx] = { ...allCustomers[idx], ...data };
  } else {
    const newId = await FS.add('customers', { ...data, ...FS.creator() });
    FS.audit('등록', '고객사', newId, data.name);
    if (!allCustomers.some(x => x.id === newId)) allCustomers.push({ id: newId, ...data });
    allCustomers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }
  closeCustModal();
  renderCustomers();
  if (selectedCustomerId) renderProjects();
  Toast.success(id ? '수정되었습니다' : '고객사가 등록되었습니다');
}

async function deleteCustomer(id) {
  const c = allCustomers.find(x => x.id === id);
  const projCount  = allProjects.filter(p => p.customer_id === id).length;
  const assetCount = allAssets.filter(a => a.customer_id === id).length;
  const ticketCount = await countLinkedTickets(id);
  let msg = `'${c?.name || ''}' 고객사를 삭제하시겠습니까?`;
  if (projCount || assetCount) msg += `\n프로젝트 ${projCount}개, 장비 ${assetCount}대가 함께 삭제됩니다.`;
  if (ticketCount) msg += `\n연결된 장애 티켓 ${ticketCount}건은 고객사 없이 남습니다.`;
  if (!await Dialog.confirm(msg, true)) return;

  const delAssets   = allAssets.filter(a => a.customer_id === id);
  const delProjects = allProjects.filter(p => p.customer_id === id);
  try {
    await batchDelete([
      ...delAssets.map(a => ['assets', a.id]),
      ...delProjects.map(p => ['projects', p.id]),
      ['customers', id],
    ]);
    FS.audit('삭제', '고객사', id, allCustomers.find(x => x.id === id)?.name,
      (delProjects.length || delAssets.length) ? `프로젝트 ${delProjects.length}개 · 장비 ${delAssets.length}대 함께 삭제: ${delAssets.map(a => a.hostname).filter(Boolean).join(', ')}` : '');
  } catch (e) {
    Toast.error('삭제 실패: ' + e.message);
    return;
  }
  allAssets    = allAssets.filter(a => a.customer_id !== id);
  allProjects  = allProjects.filter(p => p.customer_id !== id);
  allCustomers = allCustomers.filter(c => c.id !== id);
  if (selectedCustomerId === id) {
    selectedCustomerId = null; selectedProjectId = null;
    showPanel('none');
  }
  renderCustomers();
  Toast.success('삭제되었습니다');
}

// ── 프로젝트 CRUD ─────────────────────────────────────────────────────────────
function openProjModal(id) {
  document.getElementById('proj-modal-title').textContent = id ? '프로젝트 수정' : '프로젝트 추가';
  document.getElementById('f-proj-id').value = id || '';
  if (id) {
    const p = allProjects.find(x => x.id === id);
    if (!p) { Toast.error('이미 삭제된 항목입니다'); return; }
    document.getElementById('f-proj-name').value         = p.name            || '';
    document.getElementById('f-proj-vendor').value       = p.vendor          || '';
    document.getElementById('f-proj-device-type').value  = p.device_type     || '';
    document.getElementById('f-proj-quantity').value     = p.quantity        || '';
    document.getElementById('f-proj-install-date').value = p.install_date    || '';
    document.getElementById('f-proj-memo').value         = p.memo            || '';
    wpRows = FS.warrantyPeriods(p);
  } else {
    ['f-proj-name','f-proj-vendor','f-proj-device-type','f-proj-quantity',
     'f-proj-install-date','f-proj-memo']
      .forEach(i => document.getElementById(i).value = '');
    wpRows = [];
  }
  if (!wpRows.length) wpRows = [{ type: '기본', start: '', end: '', memo: '' }];

function closeProjModal() { document.getElementById('proj-modal').style.display = 'none'; }

// ── 워런티 기간 편집 (기본 → 연장 → 연장 ...) ──
let wpRows = [];
function wpSync() {
  document.querySelectorAll('#wp-rows .wp-row').forEach((row, i) => {
    wpRows[i] = {
      type:  row.querySelector('.wp-type').value,
      start: row.querySelector('.wp-start').value,
      end:   row.querySelector('.wp-end').value,
      memo:  row.querySelector('.wp-memo').value.trim(),
    };
  });
}
function wpRender() {
  document.getElementById('wp-rows').innerHTML = wpRows.map((r, i) => `
    <div class="wp-row">
      <select class="form-select wp-type" aria-label="구분">
        <option${r.type === '기본' ? ' selected' : ''}>기본</option>
        <option${r.type !== '기본' ? ' selected' : ''}>연장</option>
      </select>
      <input type="date" class="form-input wp-start" value="${FS.esc(r.start)}" aria-label="시작일" onchange="wpAutoEnd(${i})">
      <input type="date" class="form-input wp-end" value="${FS.esc(r.end)}" aria-label="종료일">
      <button type="button" class="wp-del" onclick="wpRemove(${i})" aria-label="기간 삭제">${FS.icon('close', 14)}</button>
      <input type="text" class="form-input wp-memo" value="${FS.esc(r.memo)}" placeholder="메모 (계약번호·갱신 조건 등)">
    </div>`).join('');
}
function wpAddDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + days); return FS.localDate(d);
}
function wpAddYears(dateStr, years) {
  const d = new Date(dateStr + 'T00:00:00'); d.setFullYear(d.getFullYear() + years); d.setDate(d.getDate() - 1); return FS.localDate(d);
}
// 연장: 직전 종료일 다음 날부터 1년
function wpAdd() {
  wpSync();
  const last = [...wpRows].reverse().find(r => r.end);
  const start = last ? wpAddDays(last.end, 1) : '';
  wpRows.push({ type: wpRows.length ? '연장' : '기본', start, end: start ? wpAddYears(start, 1) : '', memo: '' });
  wpRender();
}
function wpRemove(i) { wpSync(); wpRows.splice(i, 1); if (!wpRows.length) wpRows.push({ type: '기본', start: '', end: '', memo: '' }); wpRender(); }
// 시작일만 넣으면 종료일 자동 (기본 3년, 연장 1년) — 비어 있을 때만
function wpAutoEnd(i) {
  wpSync();
  const r = wpRows[i];
  if (r.start && !r.end) { r.end = wpAddYears(r.start, r.type === '기본' ? 3 : 1); wpRender(); }
}

async function saveProject() {
  const name = document.getElementById('f-proj-name').value.trim();
  if (!name) { Toast.error('프로젝트명을 입력하세요'); return; }
  const data = {
    customer_id:     selectedCustomerId,
    name,
    vendor:          document.getElementById('f-proj-vendor').value.trim(),
    device_type:     document.getElementById('f-proj-device-type').value.trim(),
    quantity:        Number(document.getElementById('f-proj-quantity').value) || 0,
    install_date:    document.getElementById('f-proj-install-date').value,
    memo:            document.getElementById('f-proj-memo').value.trim(),
  };
  // 워런티: 기간 목록 + 호환용 최초 시작일·최종 만료일 (현황·개요 화면은 warranty_expire 기준)
  wpSync();
  if (wpRows.some(r => r.start && !r.end)) { Toast.error('워런티 종료일이 비어 있는 기간이 있습니다'); return; }
  const periods = wpRows.filter(r => r.end).sort((a, b) => (a.start || a.end).localeCompare(b.start || b.end));
  if (periods.some(r => r.start && r.start > r.end)) { Toast.error('워런티 시작일이 종료일보다 늦습니다'); return; }
  // 이어지지 않는 기간(공백)·겹치는 기간은 실수일 수 있으니 확인
  const issues = [];
  for (let i = 1; i < periods.length; i++) {
    const prev = periods[i - 1], cur = periods[i];
    if (!cur.start) continue;
    const next = wpAddDays(prev.end, 1);
    if (cur.start > next) issues.push(`공백: ${FS.formatDate(next)} ~ ${FS.formatDate(wpAddDays(cur.start, -1))}`);
    if (cur.start <= prev.end) issues.push(`겹침: ${FS.formatDate(cur.start)} ~ ${FS.formatDate(prev.end)}`);
  }
  if (issues.length && !await Dialog.confirm(`워런티 기간을 확인하세요.\n${issues.join('\n')}\n그대로 저장할까요?`)) return;
  data.warranty_periods = periods;
  data.warranty_expire  = periods.length ? periods.map(r => r.end).sort().pop() : '';
  data.warranty_start   = periods.find(r => r.start)?.start || '';
  const id = document.getElementById('f-proj-id').value;
  if (id) {
    await FS.update('projects', id, data);
    FS.audit('수정', '프로젝트', id, data.name, allCustomers.find(c => c.id === data.customer_id)?.name);
    const idx = allProjects.findIndex(x => x.id === id);
    if (idx >= 0) allProjects[idx] = { ...allProjects[idx], ...data };
  } else {
    const newId = await FS.add('projects', { ...data, ...FS.creator() });
    FS.audit('등록', '프로젝트', newId, data.name, allCustomers.find(c => c.id === data.customer_id)?.name);
    if (!allProjects.some(x => x.id === newId)) allProjects.push({ id: newId, ...data });
  }
  closeProjModal();
  renderProjects();
  renderCustomers();
  Toast.success(id ? '수정되었습니다' : '프로젝트가 추가되었습니다');
}

async function deleteProject(id) {
  const p = allProjects.find(x => x.id === id);
  const assetCount = allAssets.filter(a => a.project_id === id).length;
  let msg = `'${p?.name || ''}' 프로젝트를 삭제하시겠습니까?`;
  if (assetCount) msg += `\n장비 ${assetCount}대가 함께 삭제됩니다.`;
  if (!await Dialog.confirm(msg, true)) return;

  const delAssets = allAssets.filter(a => a.project_id === id);
  try {
    await batchDelete([...delAssets.map(a => ['assets', a.id]), ['projects', id]]);
    FS.audit('삭제', '프로젝트', id, p?.name,
      delAssets.length ? `장비 ${delAssets.length}대 함께 삭제: ${delAssets.map(a => a.hostname).filter(Boolean).join(', ')}` : '');
  } catch (e) {
    Toast.error('삭제 실패: ' + e.message);
    return;
  }
  allAssets   = allAssets.filter(a => a.project_id !== id);
  allProjects = allProjects.filter(p => p.id !== id);
  if (selectedProjectId === id) { selectedProjectId = null; showPanel('projects'); }
  renderProjects();
  renderCustomers();
  Toast.success('삭제되었습니다');
}

// ── CSV 일괄 가져오기 ─────────────────────────────────────────────────────────
const CSV_FIELDS = [
  'hostname','device_type','model','serial','location','ip_address','os','status',
  'cpu','memory','gpu','disk','bmc_version','bios_version','driver_version',
  'install_date','vendor_case_no','memo'
];
const CSV_LABELS = [
  'Hostname(필수)','장비유형','모델명','S/N','위치','IP주소','OS','상태(운영중/장애/점검중/폐기)',
  'CPU','메모리','GPU','디스크','BMC버전','BIOS버전','드라이버버전',
  '설치일(YYYY-MM-DD)','벤더케이스번호','메모'
];

function downloadCsvTemplate() {
  const sample = [
    'server-01','GPU서버','DGX H100','SN123456','Rack-A01','192.168.1.10',
    'Ubuntu 22.04','운영중','Intel Xeon Gold 6338','512GB DDR4','NVIDIA H100 x8',
    'NVMe 3.84TB x4','3.00.00','1.12.3','550.107.02','2024-01-15','','샘플 장비'
  ];
  const rows = [
    CSV_LABELS.map(h => `"${h}"`).join(','),
    sample.map(v => `"${v}"`).join(',')
  ];
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asset_template.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// 따옴표 안의 줄바꿈(엑셀 메모 칸 등)까지 처리하도록 전체 텍스트를 한 글자씩 파싱
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, '');
  const result = [];
  let row = [], field = '', inQuote = false;
  const endRow = () => { row.push(field); if (row.some(v => v.trim())) result.push(row); row = []; field = ''; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuote) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuote = false;
      else field += c;
    } else if (c === '"') inQuote = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\r') { if (text[i + 1] === '\n') i++; endRow(); }
    else if (c === '\n') endRow();
    else field += c;
  }
  if (field || row.length) endRow();
  return result;
}

async function importAssetCsv(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;

  // Map header row to field names (supports Korean labels or English field names)
  const headerLookup = {};
  CSV_LABELS.forEach((lbl, i) => { headerLookup[lbl.toLowerCase()] = CSV_FIELDS[i]; });
  CSV_FIELDS.forEach(f => { headerLookup[f.toLowerCase()] = f; });
  const mapHeader = r => r.map(h => headerLookup[h.trim().toLowerCase()] || null);

  // 한국어 엑셀의 'CSV (쉼표로 분리)' 저장은 CP949 → UTF-8로 읽어 헤더가 안 맞으면 EUC-KR로 다시 읽기
  const buf = await file.arrayBuffer();
  let rows = parseCsv(new TextDecoder('utf-8').decode(buf));
  let colMap = rows.length ? mapHeader(rows[0]) : [];
  if (!colMap.includes('hostname')) {
    rows = parseCsv(new TextDecoder('euc-kr').decode(buf));
    colMap = rows.length ? mapHeader(rows[0]) : [];
  }
  if (rows.length < 2) { Toast.error('데이터 행이 없습니다'); return; }
  if (!colMap.includes('hostname')) { Toast.error('Hostname 열을 찾을 수 없습니다. 템플릿 양식을 사용하세요'); return; }

  const validRows = [];
  const errors = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (row.every(c => !c.trim())) continue;
    const obj = { customer_id: selectedCustomerId, project_id: selectedProjectId };
    colMap.forEach((field, ci) => { if (field) obj[field] = (row[ci] || '').trim(); });
    if (!obj.hostname) { errors.push(`행 ${i + 1}: hostname 없음`); continue; }
    if (!obj.status) obj.status = '운영중';
    validRows.push(obj);
  }

  if (errors.length && !validRows.length) {
    Toast.error(errors[0]);
    return;
  }
  if (!validRows.length) { Toast.error('추가할 장비가 없습니다'); return; }

  try {
    const ids = await Promise.all(validRows.map(d => FS.add('assets', { ...d, ...FS.creator() })));
    FS.audit('등록', '장비', '', `CSV 일괄 ${ids.length}대`, validRows.map(d => d.hostname).join(', '));
    ids.forEach((id, i) => allAssets.push({ id, ...validRows[i] }));
    renderAssets();
    renderCustomers();
    renderProjects();
    Toast.success(`${validRows.length}대 추가되었습니다`);
  } catch (e) {
    Toast.error('추가 중 오류: ' + e.message);
  }
}
