<!-- 고객사·프로젝트·장비 -->
<style>
.cust-layout { display:flex; gap:16px; align-items:flex-start; }
.cust-col-left { width:290px; flex-shrink:0; }
.cust-col-right { flex:1; min-width:0; }
@media (max-width:960px) {
  .cust-layout { flex-direction:column; }
  .cust-col-left { width:100%; }
}
.cust-item {
  padding:10px 14px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background 0.1s;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.cust-item:last-child { border-bottom:none; }
.cust-item:hover { background:var(--bg); }
.cust-item.active { background:#fdf0eb; border-left:3px solid var(--primary); padding-left:11px; }
.cust-item-info { flex:1; min-width:0; }
.cust-item-name { font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cust-item-meta { font-size:11px; color:var(--text-hint); margin-top:2px; }
.cust-item-actions { display:none; gap:3px; flex-shrink:0; }
.cust-item:hover .cust-item-actions { display:flex; }
.cust-item.active .cust-item-actions { display:flex; }

.panel-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap;
}
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:13px; overflow:hidden; flex:1; min-width:0; }
.bc-link { color:var(--primary); cursor:pointer; font-weight:500; white-space:nowrap; flex-shrink:0; }
.bc-link:hover { text-decoration:underline; }
.bc-cur { font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bc-sep { color:var(--text-hint); flex-shrink:0; }
</style>

<div class="flex-between mb-3">
  <div style="font-size:16px;font-weight:600;">고객사 관리</div>
  <button class="btn btn-primary" onclick="openCustModal()">+ 고객사 등록</button>
</div>

<div class="cust-layout">
  <!-- 좌측: 고객사 목록 -->
  <div class="cust-col-left">
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
        <input type="text" class="form-input" id="cust-search"
          placeholder="고객사 검색..." oninput="renderCustomers()" style="margin:0;">
      </div>
      <div id="cust-list" style="max-height:calc(100vh - 238px);overflow-y:auto;"></div>
      <div id="cust-empty" class="empty-state" style="display:none;">
        <div class="empty-icon">🏢</div><div>등록된 고객사가 없습니다</div>
      </div>
    </div>
  </div>

  <!-- 우측: 프로젝트 / 장비 패널 -->
  <div class="cust-col-right">
    <!-- 기본 안내 -->
    <div id="right-placeholder" class="card"
      style="display:flex;align-items:center;justify-content:center;height:160px;color:var(--text-hint);font-size:13px;">
      ← 고객사를 선택하면 프로젝트 목록이 표시됩니다
    </div>

    <!-- 프로젝트 패널 -->
    <div id="proj-panel" style="display:none;">
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="panel-hdr">
          <div class="breadcrumb">
            <span id="bc-cust-name" class="bc-cur"></span>
            <span class="bc-sep">›</span>
            <span style="color:var(--text-hint);font-size:12px;">프로젝트</span>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openProjModal()">+ 프로젝트 추가</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="table table-clickable">
            <thead>
              <tr>
                <th>프로젝트명</th><th>벤더</th><th>장비유형</th>
                <th>등록장비</th><th>설치일</th><th>워런티만료</th><th>상태</th>
                <th style="width:90px;"></th>
              </tr>
            </thead>
            <tbody id="proj-tbody"></tbody>
          </table>
        </div>
        <div id="proj-empty" class="empty-state" style="display:none;">
          <div class="empty-icon">📦</div><div>등록된 프로젝트가 없습니다</div>
        </div>
      </div>
    </div>

    <!-- 장비 패널 -->
    <div id="asset-panel" style="display:none;">
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="panel-hdr">
          <div class="breadcrumb">
            <span id="bc-cust-name2" class="bc-link" onclick="backToProjects()"></span>
            <span class="bc-sep">›</span>
            <span id="bc-proj-name" class="bc-cur"></span>
          </div>
          <div class="flex gap-1">
            <button class="btn btn-sm" onclick="backToProjects()">← 프로젝트</button>
            <button class="btn btn-sm" onclick="downloadCsvTemplate()">↓ 템플릿</button>
            <button class="btn btn-sm" onclick="document.getElementById('csv-import-input').click()">CSV 일괄 추가</button>
            <button class="btn btn-primary btn-sm" onclick="openAssetModal()">+ 장비 추가</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="table table-clickable">
            <thead>
              <tr>
                <th>Hostname</th><th>S/N</th><th>IP</th><th>OS</th>
                <th>상태</th><th>BMC버전</th><th>드라이버버전</th>
                <th style="width:90px;"></th>
              </tr>
            </thead>
            <tbody id="asset-tbody"></tbody>
          </table>
        </div>
        <div id="asset-empty" class="empty-state" style="display:none;">
          <div class="empty-icon">🖥</div><div>등록된 장비가 없습니다</div>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="csv-import-input" accept=".csv" style="display:none;" onchange="importAssetCsv(this)">

<!-- 고객사 모달 -->

  <div class="modal">
    <div class="modal-header">

    </div>
    <div class="modal-body">

<script>
FS.requireAuth();

let allCustomers     = [];
let allProjects      = [];
let allAssets        = [];
let selectedCustomerId = null;
let selectedProjectId  = null;

function daysLeft(dateStr) {
  if (!dateStr) return null;
  let d;
  if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    const [y, mo, dy] = dateStr.split('-').map(Number);
    d = new Date(y, mo - 1, dy);
  } else {
    d = dateStr.toDate ? dateStr.toDate() : new Date(dateStr);
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.ceil((d - today) / 86400000);
}

function warrantyBadge(dateStr) {
  const d = daysLeft(dateStr);
  if (d === null) return '<span class="badge badge-gray">-</span>';
  if (d < 0)    return '<span class="badge badge-danger">만료됨</span>';
  if (d <= 30)  return `<span class="badge badge-danger">${d}일</span>`;
  if (d <= 90)  return `<span class="badge badge-warning">${d}일</span>`;
  return `<span class="badge badge-success">${d}일</span>`;
}

function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function init() {
  // 페이지 재진입 시 패널은 초기 상태로 그려지므로 선택도 초기화
  selectedCustomerId = null;
  selectedProjectId  = null;
  FS.watch([['customers'], ['projects'], ['assets']], ([custs, projs, assets]) => {
    allCustomers = custs;
    allProjects  = projs;
    allAssets    = assets;
    allCustomers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    // 다른 기기에서 선택 중인 항목이 삭제된 경우
    if (selectedCustomerId && !allCustomers.some(c => c.id === selectedCustomerId)) {
      selectedCustomerId = null; selectedProjectId = null;
      showPanel('none');
    } else if (selectedProjectId && !allProjects.some(p => p.id === selectedProjectId)) {
      selectedProjectId = null;
      showPanel('projects');
    }

    renderCustomers();
    if (document.getElementById('proj-panel').style.display !== 'none') renderProjects();
    if (document.getElementById('asset-panel').style.display !== 'none') renderAssets();
  });
}

// ── 고객사 목록 ──────────────────────────────────────────────────────────────
function renderCustomers() {
  const q = (document.getElementById('cust-search').value || '').toLowerCase();
  const data = allCustomers.filter(c =>
    !q || (c.name || '').toLowerCase().includes(q) || (c.contact || '').toLowerCase().includes(q)
  );
  document.getElementById('cust-empty').style.display = data.length ? 'none' : '';
  document.getElementById('cust-list').innerHTML = data.map(c => {
    const projCount  = allProjects.filter(p => p.customer_id === c.id).length;
    const assetCount = allAssets.filter(a => a.customer_id === c.id).length;
    const active = selectedCustomerId === c.id ? ' active' : '';
    return `<div class="cust-item${active}" onclick="selectCustomer('${c.id}')">
      <div class="cust-item-info">
        <div class="cust-item-name">${escHtml(c.name || '')}</div>
        <div class="cust-item-meta">프로젝트 ${projCount}개 · 장비 ${assetCount}대</div>
      </div>
      <div class="cust-item-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="openCustModal('${c.id}')">✏</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteCustomer('${c.id}')">×</button>
      </div>
    </div>`;
  }).join('');
}

function selectCustomer(id) {
  selectedCustomerId = id;
  selectedProjectId  = null;
  renderCustomers();
  showPanel('projects');
  renderProjects();
}

// ── 패널 전환 ────────────────────────────────────────────────────────────────
function showPanel(panel) {
  document.getElementById('right-placeholder').style.display = panel === 'none'     ? '' : 'none';
  document.getElementById('proj-panel').style.display         = panel === 'projects' ? '' : 'none';
  document.getElementById('asset-panel').style.display        = panel === 'assets'   ? '' : 'none';
}

// ── 프로젝트 패널 ────────────────────────────────────────────────────────────
function renderProjects() {
  const c = allCustomers.find(x => x.id === selectedCustomerId);
  document.getElementById('bc-cust-name').textContent = c?.name || '';
  const projs = allProjects.filter(p => p.customer_id === selectedCustomerId);
  document.getElementById('proj-empty').style.display = projs.length ? 'none' : '';
  document.getElementById('proj-tbody').innerHTML = projs.map(p => {
    return `<tr onclick="selectProject('${p.id}')">
      <td style="font-weight:500;">${escHtml(p.name || '')}</td>
      <td>${escHtml(p.vendor || '-')}</td>
      <td>${escHtml(p.device_type || '-')}</td>
      <td>${allAssets.filter(a => a.project_id === p.id).length}대</td>
      <td>${FS.formatDate(p.install_date) || '-'}</td>
      <td>${p.warranty_expire ? FS.formatDate(p.warranty_expire) : '-'}</td>
      <td>${warrantyBadge(p.warranty_expire)}</td>
      <td onclick="event.stopPropagation()">
        <div class="flex gap-1">
          <button class="btn btn-ghost btn-sm" onclick="openProjModal('${p.id}')">✏</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteProject('${p.id}')">×</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function selectProject(id) {
  selectedProjectId = id;
  showPanel('assets');
  renderAssets();
}

function backToProjects() {
  selectedProjectId = null;
  showPanel('projects');
  renderProjects();
}

// ── 장비 패널 ────────────────────────────────────────────────────────────────
function renderAssets() {
  const c = allCustomers.find(x => x.id === selectedCustomerId);
  const p = allProjects.find(x => x.id === selectedProjectId);
  document.getElementById('bc-cust-name2').textContent = c?.name || '';
  document.getElementById('bc-proj-name').textContent  = p?.name || '';

  const assets = allAssets.filter(a => a.project_id === selectedProjectId);
  document.getElementById('asset-empty').style.display = assets.length ? 'none' : '';
  document.getElementById('asset-tbody').innerHTML = assets.map(a => {
    const sc = a.status === '운영중' ? 'badge-success' : a.status === '장애' ? 'badge-danger' : 'badge-warning';
    return `<tr>
      <td style="font-weight:500;">${escHtml(a.hostname || '-')}</td>
      <td>${escHtml(a.serial || '-')}</td>
      <td>${escHtml(a.ip_address || '-')}</td>
      <td>${escHtml(a.os || '-')}</td>
      <td><span class="badge ${sc}">${FS.esc(a.status || '-')}</span></td>
      <td>${escHtml(a.bmc_version || '-')}</td>
      <td>${escHtml(a.driver_version || '-')}</td>
      <td onclick="event.stopPropagation()">
        <div class="flex gap-1">
          <button class="btn btn-ghost btn-sm" onclick="openAssetModal('${a.id}')">✏</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteAsset('${a.id}')">×</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── 고객사 CRUD ───────────────────────────────────────────────────────────────
function openCustModal(id) {
  document.getElementById('cust-modal-title').textContent = id ? '고객사 수정' : '고객사 등록';
  document.getElementById('f-cust-id').value = id || '';
  if (id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) { Toast.error('이미 삭제된 항목입니다'); return; }

async function deleteCustomer(id) {
  const projCount  = allProjects.filter(p => p.customer_id === id).length;
  const assetCount = allAssets.filter(a => a.customer_id === id).length;
  const msg = (projCount || assetCount)
    ? `프로젝트 ${projCount}개, 장비 ${assetCount}대가 함께 삭제됩니다. 삭제하시겠습니까?`
    : '삭제하시겠습니까?';
  if (!await Dialog.confirm(msg, true)) return;

  const delAssets   = allAssets.filter(a => a.customer_id === id);
  const delProjects = allProjects.filter(p => p.customer_id === id);
  await Promise.all([
    ...delAssets.map(a => FS.remove('assets', a.id)),
    ...delProjects.map(p => FS.remove('projects', p.id)),
    FS.remove('customers', id),
  ]);
  allAssets    = allAssets.filter(a => a.customer_id !== id);
  allProjects  = allProjects.filter(p => p.customer_id !== id);
  allCustomers = allCustomers.filter(c => c.id !== id);
  if (selectedCustomerId === id) {
    selectedCustomerId = null; selectedProjectId = null;
    showPanel('none');
  }
  renderCustomers();
  Toast.success('삭제되었습니다');
}

// ── CSV 일괄 가져오기 ─────────────────────────────────────────────────────────
const CSV_FIELDS = [
  'hostname','device_type','model','serial','location','ip_address','os','status',
  'cpu','memory','gpu','disk','bmc_version','bios_version','driver_version',
  'install_date','vendor_case_no','memo'
];
const CSV_LABELS = [
  'Hostname(필수)','장비유형','모델명','S/N','위치','IP주소','OS','상태(운영중/장애/점검중/폐기)',
  'CPU','메모리','GPU','디스크','BMC버전','BIOS버전','드라이버버전',
  '설치일(YYYY-MM-DD)','벤더케이스번호','메모'
];

function downloadCsvTemplate() {
  const sample = [
    'server-01','GPU서버','DGX H100','SN123456','Rack-A01','192.168.1.10',
    'Ubuntu 22.04','운영중','Intel Xeon Gold 6338','512GB DDR4','NVIDIA H100 x8',
    'NVMe 3.84TB x4','3.00.00','1.12.3','550.107.02','2024-01-15','','샘플 장비'
  ];
  const rows = [
    CSV_LABELS.map(h => `"${h}"`).join(','),
    sample.map(v => `"${v}"`).join(',')
  ];
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asset_template.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function parseCsv(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let field = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuote && line[i + 1] === '"') { field += '"'; i++; }
        else inQuote = !inQuote;
      } else if (c === ',' && !inQuote) {
        row.push(field); field = '';
      } else {
        field += c;
      }
    }
    row.push(field);
    result.push(row);
  }
  return result;
}

async function importAssetCsv(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;

  const text = await file.text();
  const rows = parseCsv(text);
  if (rows.length < 2) { Toast.error('데이터 행이 없습니다'); return; }

  // Map header row to field names (supports Korean labels or English field names)
  const headerLookup = {};
  CSV_LABELS.forEach((lbl, i) => { headerLookup[lbl.toLowerCase()] = CSV_FIELDS[i]; });
  CSV_FIELDS.forEach(f => { headerLookup[f.toLowerCase()] = f; });

  const colMap = rows[0].map(h => headerLookup[h.trim().toLowerCase()] || null);

  const validRows = [];
  const errors = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (row.every(c => !c.trim())) continue;
    const obj = { customer_id: selectedCustomerId, project_id: selectedProjectId };
    colMap.forEach((field, ci) => { if (field) obj[field] = (row[ci] || '').trim(); });
    if (!obj.hostname) { errors.push(`행 ${i + 1}: hostname 없음`); continue; }
    if (!obj.status) obj.status = '운영중';
    validRows.push(obj);
  }

  if (errors.length && !validRows.length) {
    Toast.error(errors[0]);
    return;
  }
  if (!validRows.length) { Toast.error('추가할 장비가 없습니다'); return; }

  try {
    const ids = await Promise.all(validRows.map(d => FS.add('assets', d)));
    ids.forEach((id, i) => allAssets.push({ id, ...validRows[i] }));
    renderAssets();
    renderCustomers();
    renderProjects();
    Toast.success(`${validRows.length}대 추가되었습니다`);
  } catch (e) {
    Toast.error('추가 중 오류: ' + e.message);
  }
}
