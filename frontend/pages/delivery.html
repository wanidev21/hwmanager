<!-- 납품확인서 -->
<style>
.view { display:none; }
.view.active { display:block; }

/* ── 목록 액션 버튼 ── */
.dl-btn {
  height:28px; padding:0 10px; border-radius:0; border:1.5px solid var(--ink);
  font-size:11px; font-weight:700; cursor:pointer; display:inline-flex;
  align-items:center; gap:4px; background:var(--surface); color:var(--text-sub);
  transition:background 0.1s; font-family:inherit; white-space:nowrap;
}
.dl-btn:hover { background:var(--bg); }
.dl-btn-print { background:var(--success-bg); border-color:var(--success); color:var(--success); }
.dl-btn-print:hover { filter:brightness(0.95); }
.dl-btn-del { color:var(--danger); border-color:var(--danger); }
.dl-btn-del:hover { background:var(--primary-light); }

/* ── 편집 툴바 ── */
.edit-toolbar {
  display:flex; align-items:center; gap:8px; margin-bottom:20px;
  padding-bottom:16px; border-bottom:1px solid var(--border);
}
.edit-toolbar h3 { flex:1; font-size:15px; font-weight:600; }

/* ── 품목 입력 테이블 ── */
.item-table { width:100%; border-collapse:collapse; border:2px solid var(--ink); }
/* 머리줄: 검정 띠 (테마 무관) */
.item-table thead th {
  font-size:11px; font-weight:800; color:#ECEAE4; letter-spacing:0.04em;
  padding:8px 10px; background:#111111;
  border-right:1px solid #3A3833; border-bottom:2px solid var(--ink);
  text-align:left; white-space:nowrap;
}
.item-table thead th:last-child { border-right:none; }
.item-table tbody td {
  padding:3px 4px; vertical-align:middle;
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
}
.item-table tbody td:last-child { border-right:none; }
.item-table tbody tr:nth-child(even) td { background:var(--surface-2); }
.item-table input, .item-table select {
  width:100%; border:1px solid transparent; border-radius:0; padding:5px 7px;
  font-size:12px; background:transparent; font-family:inherit; color:var(--text);
  transition:border-color 0.12s, background 0.12s;
}
.item-table input:focus, .item-table select:focus {
  outline:none; border-color:var(--primary-text); background:var(--surface);
}
.item-table input[type=number] { text-align:center; }
.item-table select { cursor:pointer; }

/* ── 서명 ── */
.sig-area { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:16px; }
/* ── 목록 행 / 미리보기 ── */
#list-tbody tr { cursor:pointer; }
.dn-list-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.dn-preview-modal { max-width:860px; width:calc(100vw - 32px); }
.dn-preview-box { position:relative; overflow:hidden; background:var(--surface-2); border:2px solid var(--ink); border-radius:0; }
.dn-preview-box iframe {
  position:absolute; top:0; left:0; width:794px; height:1123px;
  border:0; background:#fff; transform-origin:top left;
}
.dn-list-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
.dn-list-toolbar #delivery-search { max-width:280px; }
@media (max-width:768px) {
  /* 폰: 목록 행 터치 → 미리보기 (미리보기에서 수정·서명 가능, 목록의 인쇄·수정·삭제 버튼 열은 숨김) */
  .dn-col-opt, .dn-pc-only { display:none !important; }
  .dn-list-toolbar .form-select { width:auto !important; }
  .dn-list-toolbar { flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .dn-list-toolbar #delivery-search { max-width:none; flex:1 1 100%; }
  .dn-list-toolbar #status-filter { flex:1; width:auto !important; }
  .dn-list-toolbar .dn-spacer { display:none; }
  #list-tbody td { padding-top:12px; padding-bottom:12px; }
  .dn-grid4 { grid-template-columns:1fr 1fr !important; }
  .dn-table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .dn-table-scroll .item-table { min-width:700px; }
  .dn-preview-modal .modal-body { padding:10px; }
  .sig-area { grid-template-columns:1fr; gap:12px; }
  /* 편집 툴바: 줄바꿈 + 상단 고정 (긴 문서에서도 저장 버튼에 바로 닿도록) */
  .edit-toolbar {
    flex-wrap:wrap; gap:6px; position:sticky; top:0; z-index:20;
    background:var(--bg); padding-top:8px; margin-top:-8px; margin-bottom:14px; padding-bottom:10px;
  }
  .edit-toolbar h3 { flex:1 1 auto; }
  .item-table { font-size:11px; }
  .item-table thead th, .item-table tbody td { padding:5px 6px; }
  /* iOS는 16px 미만 입력칸에 포커스하면 화면을 확대하므로 16px 이상 */
  .item-table input, .item-table select { font-size:16px; min-height:40px; }
}
/* 서명 칸: 검정 펜으로 그리므로 다크모드에서도 흰 바탕 */
.sig-box canvas {
  border:2px solid var(--ink); border-radius:0;
  cursor:crosshair; display:block; width:100%; background:#FFFFFF;
  touch-action:none;   /* 서명 중 화면 스크롤 방지 */
}
.sig-box label { font-size:12px; font-weight:800; color:var(--text-sub); display:block; margin-bottom:6px; }

/* ── 자동완성 ── */
.ac-wrap { position:relative; }
.ac-list {
  position:absolute; top:100%; left:0; right:0; background:var(--surface);
  border:2px solid var(--ink); border-radius:0; z-index:200;
  max-height:150px; overflow-y:auto; display:none;
  box-shadow:4px 4px 0 rgba(17,17,17,0.25);
}
.ac-list.open { display:block; }
.ac-item { padding:6px 10px; font-size:12px; cursor:pointer; color:var(--text-sub); }
.ac-item:hover { background:var(--bg); }

/* ════════════════════════════════════════════
   인쇄 전용 스타일
════════════════════════════════════════════ */
@media screen { .print-doc { display:none !important; } }
/* 폰: 품목 확인 */
.dp-meta { font-size:12px; color:var(--text-sub); margin-bottom:10px; line-height:1.6; }
.dp-note { font-size:13px; background:var(--surface-2); border-left:3px solid var(--ink); padding:8px 10px; margin-bottom:10px; white-space:pre-wrap; }
.dp-items { border:2px solid var(--ink); }
.dp-item { display:flex; gap:10px; padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); }
.dp-item:first-child { border-top:none; }
.dp-no { font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--text-hint); min-width:18px; }
.dp-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.dp-desc { font-size:14px; font-weight:800; word-break:break-word; user-select:text; }
.dp-sub { font-size:12px; color:var(--text-sub); }
/* 품목 ↔ 장비 연결 */
.dn-link-btn { min-width:96px; height:30px; padding:0 8px; border:1.5px dashed var(--ink); background:var(--surface); color:var(--text-sub); font-family:inherit; font-size:12px; font-weight:700; white-space:nowrap; }
.dn-link-btn.on { border-style:solid; background:var(--ink); color:var(--bg); font-family:var(--font-mono); }
.dn-link-btn:hover { background:var(--signal); color:#111111; }
.dap-search { margin-bottom:10px; }
.dap-group { font-family:var(--font-mono); font-size:11px; font-weight:700; padding:6px 10px; background:#111111; color:#ECEAE4; display:flex; justify-content:space-between; align-items:center; }
.dap-group button { background:none; border:1px solid #ECEAE4; color:#ECEAE4; font-family:inherit; font-size:11px; padding:1px 6px; }
.dap-list { border:2px solid var(--ink); max-height:50vh; overflow-y:auto; }
.dap-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border-top:1px solid var(--border); cursor:pointer; }
.dap-row:hover { background:var(--surface-2); }
.dap-row input { width:18px; height:18px; accent-color:var(--primary); flex-shrink:0; }
.dap-host { font-family:var(--font-mono); font-weight:700; font-size:13px; }
.dap-meta { font-size:11px; color:var(--text-hint); font-family:var(--font-mono); }
.dap-count { font-size:12px; font-weight:800; margin-right:auto; }
.dp-assets { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.dp-asset { font-family:var(--font-mono); font-size:12px; font-weight:700; padding:3px 7px; border:1.5px solid var(--ink); background:var(--surface-2); color:var(--text); cursor:pointer; }
.dp-asset:active { background:var(--signal); color:#111111; }
.dnb-preview { font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border-left:3px solid var(--ink); padding:8px 10px; line-height:1.7; max-height:160px; overflow-y:auto; white-space:pre; }
.dnb-warn { font-size:12px; font-weight:700; color:#111111; background:var(--signal); padding:6px 10px; margin-top:8px; }
.dnb-warn.err { background:var(--primary); }
.dp-qty { font-family:var(--font-mono); font-size:14px; font-weight:700; white-space:nowrap; }
mark.dp-hit { background:var(--signal); color:#111111; }

@media print {
  @page { size:A4 portrait; margin:0; }

  /* 인쇄하는 동안 dnPrint()가 #print-doc을 body 바로 아래로 옮김 → 나머지 화면은 숨기고
     앱 레이아웃(100vh·overflow:hidden)에 잘리지 않게 해서 여러 페이지로 인쇄 */
  html, body.dn-printing { height:auto !important; overflow:visible !important; }
  body.dn-printing { display:block !important; background:#fff !important; }
  body.dn-printing > *:not(.print-doc) { display:none !important; }

  .print-doc {
    display:block !important;
    position:relative;
    width:210mm; min-height:297mm;
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size:9.5pt; color:#1a1a1a;
    background:#fff;
    box-sizing:border-box;
    padding:14mm 16mm 12mm;
  }
  /* 품목이 적으면 한 장에 맞춰 푸터를 바닥에 붙임 (품목이 많으면 블록 흐름으로 다음 장에 이어짐) */
  .print-doc.pd-one-page {
    display:flex !important; flex-direction:column;
    height:297mm; overflow:hidden;
  }
  .print-doc:not(.pd-one-page) .pd-footer { margin-top:6mm; }
  .pd-table thead { display:table-header-group; }   /* 다음 장에도 머리글 반복 */
  .pd-table tr { break-inside:avoid; page-break-inside:avoid; }
  .pd-confirm { break-after:avoid; page-break-after:avoid; }
  .pd-sigs, .pd-sig { break-inside:avoid; page-break-inside:avoid; }

  /* 최상단 장식 바 */
  .pd-topbar {
    height:8px;
    background:linear-gradient(90deg,#e8540a 0%,#f97316 60%,#fed7aa 100%);
    margin:-14mm -16mm 0;
    margin-bottom:7mm;
  }

  /* 헤더 */
  .pd-header {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:end;
    gap:0 6mm;
    margin-bottom:7mm;
    padding-bottom:5mm;
    border-bottom:2px solid #1a1a1a;
  }
  .pd-brand { line-height:1.2; }
  .pd-brand-name {
    font-size:18pt; font-weight:900; color:#e8540a;
    letter-spacing:-0.02em;
  }
  .pd-brand-contact { font-size:6.8pt; color:#888; margin-top:1.5mm; white-space:nowrap; letter-spacing:0.01em; }
  .pd-doc-title {
    text-align:center;
    font-size:21pt; font-weight:900; color:#1a1a1a;
    letter-spacing:0.45em;
    text-indent:0.45em; /* 마지막 글자 좌우 대칭 */
  }
  .pd-doc-meta {
    text-align:right;
    font-size:8pt; color:#555; line-height:1.9;
    border-left:3px solid #e8540a; padding-left:4mm;
  }
  .pd-doc-meta strong { color:#1a1a1a; }

  /* 수신처 블록 */
  .pd-recipient-block {
    display:grid; grid-template-columns:1fr 1fr;
    gap:3mm; margin-bottom:6mm;
  }
  .pd-recipient {
    background:#fdf4f0; border-left:4px solid #e8540a;
    padding:3mm 4mm;
  }
  .pd-recipient-label { font-size:7.5pt; color:#e8540a; font-weight:700; margin-bottom:1mm; }
  .pd-recipient-name { font-size:12pt; font-weight:800; color:#1a1a1a; }
  .pd-recipient-suffix { font-size:9pt; color:#555; margin-left:2mm; }
  .pd-project-block {
    display:flex; flex-direction:column; justify-content:center;
    padding:3mm 4mm; border:1px solid #e0e0e0; background:#fafafa;
  }
  .pd-project-label { font-size:7.5pt; color:#888; margin-bottom:1mm; }
  .pd-project-name { font-size:9.5pt; font-weight:600; color:#1a1a1a; }

  /* 본문 안내 */
  .pd-intro {
    font-size:9pt; color:#444; margin-bottom:4mm;
    padding:2.5mm 4mm; background:#f9f9f9; border:1px solid #e8e8e8;
    text-align:center; letter-spacing:0.02em;
  }

  /* 품목 테이블 */
  .pd-table { width:100%; border-collapse:collapse; margin-bottom:5mm; flex:1; }
  .pd-table thead tr { background:#1a1a1a; }
  .pd-table thead th {
    padding:2.5mm 3mm; color:#fff; font-size:8.5pt; font-weight:700;
    text-align:center; letter-spacing:0.04em; border:1px solid #1a1a1a;
  }
  .pd-table thead th:nth-child(2) { text-align:left; }
  .pd-table tbody tr:nth-child(even) { background:#f8f8f8; }
  .pd-table tbody tr:last-child td { border-bottom:2px solid #1a1a1a; }
  .pd-table tbody td {
    padding:2.5mm 3mm; border:1px solid #aaa;
    font-size:9pt; vertical-align:middle;
  }
  .pd-table td.c { text-align:center; }
  .pd-table td.desc { font-weight:500; }
  /* 빈 행 채우기 */
  .pd-table tbody tr.empty-row td { color:transparent; border-color:#eee; }

  /* 확인 문구 */
  .pd-confirm {
    text-align:center; font-size:9.5pt; color:#333;
    padding:3mm 0; letter-spacing:0.03em;
    border-top:1px solid #ddd;
    margin-bottom:6mm;
  }

  /* 서명 영역 */
  .pd-sigs { display:grid; grid-template-columns:1fr 1fr; gap:8mm; }
  .pd-sig {
    border:1.5px solid #bbb;
    display:grid; grid-template-rows:auto auto 1fr auto;
    overflow:hidden;
  }
  .pd-sig-head {
    background:#1a1a1a; color:#fff;
    text-align:center; font-size:9pt; font-weight:700;
    padding:2mm; letter-spacing:0.1em;
  }
  .pd-sig-name {
    text-align:center; font-size:10pt; font-weight:600;
    padding:2.5mm; border-bottom:1px solid #ddd; color:#1a1a1a;
  }
  .pd-sig-canvas {
    min-height:28mm; display:flex; align-items:center; justify-content:center;
    padding:2mm;
  }
  .pd-sig-canvas img { max-width:100%; max-height:26mm; display:block; margin:auto; }
  .pd-sig-canvas .sig-empty-line {
    width:60%; height:1px; background:#ddd; margin:auto; margin-top:24mm;
  }
  .pd-sig-date {
    text-align:center; font-size:7.5pt; color:#999;
    padding:2mm; border-top:1px solid #eee; background:#fafafa;
  }

  /* 하단 푸터 */
  .pd-footer {
    margin-top:auto; padding-top:4mm;
    border-top:1px solid #e0e0e0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .pd-footer-left { font-size:7.5pt; color:#aaa; }
  .pd-footer-right { font-size:7.5pt; color:#bbb; }

  /* 바닥 장식 바 */
  .pd-bottombar {
    height:5px;
    background:linear-gradient(90deg,#fed7aa 0%,#f97316 40%,#e8540a 100%);
    margin:0 -16mm -12mm;
    margin-top:4mm;
  }
}
</style>

<!-- ── 목록 뷰 ─────────────────────────── -->
<div class="view active" id="view-list">
  <div class="dn-list-toolbar">
    <input type="text" class="form-input" id="delivery-search"
      placeholder="문서번호·고객사·프로젝트·품목 검색" oninput="renderList()">
    <select class="form-select" id="status-filter" onchange="renderList()" style="width:110px;">
      <option value="">전체 상태</option>
      <option value="작성중">작성중</option>
      <option value="완료">완료</option>
    </select>
    <div class="dn-spacer" style="flex:1;"></div>
    <button class="btn btn-primary dn-pc-only" onclick="openEditor()">+ 새 납품확인서</button>
  </div>
  <div class="text-hint dn-mobile-note" style="font-size:12px;font-weight:600;margin:-4px 0 10px;">폰에서는 품목 확인만 됩니다. 작성·수정·서명·인쇄는 PC에서 하세요.</div>
  <div class="card" style="padding:0;overflow:hidden;">
    <div class="dn-list-scroll">
    <table class="table">
      <thead>
        <tr>
          <th>문서번호</th>
          <th>고객사</th>
          <th class="dn-col-opt">프로젝트</th>
          <th>납품일</th>
          <th class="dn-col-opt">품목수</th>
          <th>상태</th>
          <th class="dn-pc-only" style="width:170px;"></th>
        </tr>
      </thead>
      <tbody id="list-tbody"></tbody>
    </table>
    </div>
    <div id="list-empty" class="empty-state" style="display:none;">
      <div class="empty-icon"></div><div>납품확인서가 없습니다</div>
    </div>
  </div>
</div>

<!-- ── 편집 뷰 ─────────────────────────── -->
<div class="view" id="view-edit">
  <div class="edit-toolbar">
    <button class="btn" onclick="showList()">← 목록</button>
    <h3 id="edit-title">새 납품확인서</h3>
    <button class="btn dn-save-btn" id="btn-complete" onclick="saveDraft('완료')"
      style="background:var(--success-bg);border-color:var(--success);color:var(--success);"><i data-icon="check" data-size="16"></i> 완료 처리</button>
    <button class="btn" onclick="previewFromEditor()"><i data-icon="eye" data-size="16"></i> 미리보기</button>
    <!-- 저장: 현재 상태 유지 (완료 문서를 저장해도 작성중으로 되돌리지 않음) -->
    <button class="btn btn-primary dn-save-btn" onclick="saveDraft()">저장</button>
    <button class="btn" id="btn-print-edit" onclick="printFromEditor()" style="display:none;"><i data-icon="printer" data-size="16"></i> 인쇄</button>
  </div>

  <div class="card mb-3">
    <div class="card-header"><span class="card-title">기본 정보</span></div>
    <div class="dn-grid4" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;">
      <div class="form-group">
        <label class="form-label">고객사</label>
        <select class="form-select" id="h-customer"><option value="">고객사 선택</option></select>
        <input type="text" class="form-input mt-1" id="h-customer-text" placeholder="직접 입력" style="display:none;">
        <button class="btn btn-ghost btn-sm" style="margin-top:4px;font-size:11px;" onclick="toggleCustomerInput()">직접 입력 전환</button>
      </div>
      <div class="form-group">
        <label class="form-label">프로젝트명</label>
        <input type="text" class="form-input" id="h-project" placeholder="예: 서버 증설 프로젝트">
      </div>
      <div class="form-group">
        <label class="form-label">납품일</label>
        <input type="date" class="form-input" id="h-date">
      </div>
      <div class="form-group">
        <label class="form-label">문서번호</label>
        <input type="text" class="form-input" id="h-docno" placeholder="예: DN-2025-001">
      </div>
    </div>
    <div style="margin-top:8px;">
      <div class="form-group">
        <label class="form-label">비고</label>
        <input type="text" class="form-input" id="h-note" placeholder="특이사항 (선택)">
      </div>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:11px;font-weight:600;color:var(--text-hint);margin-bottom:8px;letter-spacing:0.04em;">공급자 연락처 (납품확인서 인쇄 시 표시)</div>
      <div class="dn-grid4" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">모바일 (M)</label>
          <input type="text" class="form-input" id="h-contact-mobile" placeholder="010-0000-0000">
        </div>
        <div class="form-group">
          <label class="form-label">전화 (T)</label>
          <input type="text" class="form-input" id="h-contact-tel" placeholder="02-0000-0000">
        </div>

<!-- 인라인 display:none: 인쇄 중 body로 옮겨진 채 페이지를 떠나도(이 페이지 CSS가 사라져도) 화면에 드러나지 않도록.
     인쇄 CSS의 display:block !important가 인쇄 때만 이를 덮어씀 -->
<div class="print-doc" id="print-doc" style="display:none;"></div>

<!-- 폰: 품목 확인 (A4 미리보기 대신 읽기 쉬운 목록) -->
<div class="modal-overlay" id="parts-modal" style="display:none;" onclick="if(event.target===this)closeParts()">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h3 id="dp-title">납품 품목</h3>
      <button class="modal-close" onclick="closeParts()">×</button>
    </div>
    <div class="modal-body" id="dp-body"></div>
  </div>
</div>

<script>
FS.requireAuth();

const UNIT_OPTIONS = ['EA','대','개','식','set','Box','Roll','m','기타'];
const MODEL_OPTIONS = ['Server','Storage','GPU','Switch','NIC','HDD','SSD','NVMe','Memory','RAID','PSU','Cable','Rack','Software','Service','Other'];

let deliveryNotes = [], deliveryCusts = [];
let deliveryItemsByNote = {};   // 품목 검색용 (delivery_id → 품목들)
let dnAssets = [], dnProjects = [];   // 품목 ↔ 장비 연결용
const dnIsPhone = () => window.matchMedia('(max-width:768px)').matches;
let editingNoteId = null, useCustomerText = false, editingStatus = '작성중';
let dnSaving = false;        // 저장 중복 클릭 방지
let dnDirty = false;         // 편집 화면에 저장 안 된 변경이 있는지
let dnEditorToken = 0;       // openEditor 경합 방지 (A 열다가 B 열면 A의 늦은 결과 무시)
const dnSigToken = {};       // 캔버스별 서명 이미지 로드 경합 방지
const DN_ONE_PAGE_MAX = 12;  // 이 품목 수 이하면 한 장 레이아웃 (초과 시 여러 장)

const AC_KEY = 'dn_desc_hist';

// 공급자 연락처는 기기별로 기억 (localStorage)
const CONTACT_KEY = 'dn_last_contact';
const CONTACT_FIELDS = ['h-contact-mobile','h-contact-tel','h-contact-fax','h-contact-email'];
function loadLastContact() {
  try { return JSON.parse(localStorage.getItem(CONTACT_KEY) || '{}'); } catch { return {}; }
}
function saveLastContact() {
  const v = {};
  CONTACT_FIELDS.forEach(f => { v[f] = document.getElementById(f).value.trim(); });
  try { localStorage.setItem(CONTACT_KEY, JSON.stringify(v)); } catch {}
}
const getHist = () => { try { return JSON.parse(localStorage.getItem(AC_KEY)||'[]'); } catch { return []; } };
const addHist = v => { if (!v) return; let h = getHist().filter(x=>x!==v); h.unshift(v); localStorage.setItem(AC_KEY, JSON.stringify(h.slice(0,100))); };

function init() {
  dnDirty = false; dnSaving = false;
  // 이전 인쇄에서 body로 옮겨진 채 남은 인쇄 DOM 정리
  document.querySelectorAll('body > .print-doc').forEach(el => el.remove());
  document.body.classList.remove('dn-printing');
  // 편집 화면 입력 변경 감지 (요소는 페이지 진입마다 새로 생기므로 여기서 한 번씩 바인딩)
  const editView = document.getElementById('view-edit');
  ['input','change'].forEach(t => editView.addEventListener(t, () => { dnDirty = true; }));
  // 메뉴 이동 등으로 페이지를 떠날 때 확인 (index.html loadPage가 호출, true면 떠나도 됨)
  window.beforePageLeave = () => dnConfirmLeave();

  // 목록·고객사만 실시간 반영 (작성 중인 편집 화면 입력값은 건드리지 않음)
  document.querySelector('.dn-mobile-note').style.display = dnIsPhone() ? '' : 'none';
  let pendingNote = null;   // 장비 이력 등에서 특정 납품확인서를 열려고 온 경우
  if (window.hwPageFilter && window.hwPageFilter.page === 'delivery') {
    pendingNote = window.hwPageFilter.noteId || null;
    window.hwPageFilter = null;
  }
  FS.watch([['delivery_notes'], ['customers'], ['delivery_items'], ['assets'], ['projects']], ([notes, custs, items, assets, projs]) => {
    deliveryNotes = notes;
    deliveryCusts = custs;
    dnAssets = assets;
    dnProjects = projs;
    if (pendingNote) { const id = pendingNote; pendingNote = null; setTimeout(() => openPreview(id), 0); }
    deliveryItemsByNote = {};
    items.forEach(it => { (deliveryItemsByNote[it.delivery_id] = deliveryItemsByNote[it.delivery_id] || []).push(it); });
    Object.values(deliveryItemsByNote).forEach(arr => arr.sort((a, b) => (a.seq || 0) - (b.seq || 0)));
    deliveryNotes.sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));
    FS.setOptions(document.getElementById('h-customer'),
      deliveryCusts.map(c => ({ value:c.id, label:c.name||c.id })));
    renderList();
  });
}

// 편집 화면에 저장 안 된 변경이 있는지 (다른 페이지에서 호출돼도 안전하도록 화면 존재 여부도 확인)
function dnHasUnsaved() {
  return dnDirty && !!document.querySelector('#page-content #view-edit.active #item-tbody');
}
// 떠나도 되면 true. 변경 사항이 있으면 확인 창
async function dnConfirmLeave() {
  if (!dnHasUnsaved()) return true;
  const ok = await Dialog.confirm('저장하지 않은 변경 내용이 있습니다.\n저장하지 않고 나가시겠습니까?', true);
  if (ok) dnDirty = false;
  return ok;
}
// 탭 닫기·새로고침 시 브라우저 기본 경고
window.addEventListener('beforeunload', e => {
  if (typeof dnHasUnsaved === 'function' && dnHasUnsaved()) { e.preventDefault(); e.returnValue = ''; }
});

function toggleCustomerInput() {
  useCustomerText = !useCustomerText;
  document.getElementById('h-customer').style.display = useCustomerText ? 'none' : '';
  document.getElementById('h-customer-text').style.display = useCustomerText ? '' : 'none';
}

function renderList() {
  const q = (document.getElementById('delivery-search')?.value||'').toLowerCase();
  const sf = document.getElementById('status-filter')?.value||'';
  const filtered = deliveryNotes.filter(n => {
    const cName = deliveryCusts.find(c=>c.id===n.customer_id)?.name || n.customer_name || '';
    const itemText = (deliveryItemsByNote[n.id] || []).map(it => [it.description, it.model, it.note, ...(it.asset_hosts || [])].join(' ')).join(' ');
    return (!q || [n.doc_number||'', cName, n.project_name||'', itemText].some(s=>s.toLowerCase().includes(q)))
        && (!sf || (n.status||'작성중') === sf);
  });
  document.getElementById('list-empty').style.display = filtered.length ? 'none' : '';
  document.getElementById('list-tbody').innerHTML = filtered.map(n => {
    const cName = deliveryCusts.find(c=>c.id===n.customer_id)?.name || n.customer_name || '-';
    const isDone = (n.status||'작성중') === '완료';
    const itemCount = n.item_count ?? 0;
    return `<tr onclick="openPreview('${n.id}')">
      <td style="font-weight:600;font-size:12px;">${FS.esc(n.doc_number||'-')}</td>
      <td>${FS.esc(cName)}</td>
      <td class="dn-col-opt" style="color:var(--text-sub);font-size:12px;">${FS.esc(n.project_name||'-')}</td>
      <td style="color:var(--text-sub);">${FS.esc(n.delivery_date||'-')}</td>
      <td class="dn-col-opt" style="text-align:center;">${itemCount}</td>
      <td><span class="badge ${isDone?'badge-success':'badge-warning'}">${FS.esc(n.status||'작성중')}</span></td>
      <td class="dn-pc-only" onclick="event.stopPropagation()">
        <div class="flex gap-1" style="justify-content:flex-end;">
          ${isDone?`<button class="dl-btn dl-btn-print" onclick="printById('${n.id}')">${FS.icon('printer', 14)} 인쇄</button>`:''}
          <button class="dl-btn" onclick="openEditor('${n.id}')">수정</button>
          <button class="dl-btn dl-btn-del" onclick="deleteNote('${n.id}')">삭제</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ← 목록 버튼·뒤로가기(index.html _closeTopLayer) 공용. 변경 사항이 있으면 확인 후 이동
function showList(force) {
  if (force !== true && dnHasUnsaved()) {
    dnConfirmLeave().then(ok => { if (ok) showList(true); });
    return;
  }
  dnDirty = false;
  dnEditorToken++;   // 로딩 중인 openEditor 결과 무시
  document.getElementById('view-edit').classList.remove('active');
  document.getElementById('view-list').classList.add('active');
}

async function openEditor(id) {
  if (dnIsPhone()) { Toast.info('작성·수정·서명은 PC에서 해 주세요'); return; }
  const myToken = ++dnEditorToken;
  dnDirty = false;
  editingNoteId = id || null;
  document.getElementById('view-list').classList.remove('active');
  document.getElementById('view-edit').classList.add('active');
  document.getElementById('page-content')?.scrollTo(0, 0);   // 목록을 내려 둔 상태에서도 편집 화면 맨 위부터
  useCustomerText = false;
  ['h-customer','h-customer-text','h-project','h-date','h-docno','h-note',
   'sig-supplier-name','sig-receiver-name',
   'h-contact-mobile','h-contact-tel','h-contact-fax','h-contact-email',
  ].forEach(i => { const el=document.getElementById(i); if(el) el.value=''; });
  document.getElementById('h-customer').style.display = '';
  document.getElementById('h-customer-text').style.display = 'none';
  clearCanvas('canvas-supplier'); clearCanvas('canvas-receiver');
  document.getElementById('item-tbody').innerHTML = '';

  if (id) {
    document.getElementById('edit-title').textContent = '납품확인서 수정';
    const note = deliveryNotes.find(n=>n.id===id);
    editingStatus = note?.status || '작성중';
    if (note) {
      if (note.customer_name && !note.customer_id) {
        useCustomerText = true;
        document.getElementById('h-customer').style.display = 'none';
        document.getElementById('h-customer-text').style.display = '';
      }
      document.getElementById('h-customer').value = note.customer_id||'';
      document.getElementById('h-customer-text').value = note.customer_name||'';
      document.getElementById('h-project').value = note.project_name||'';
      document.getElementById('h-date').value = note.delivery_date||'';
      document.getElementById('h-docno').value = note.doc_number||'';
      document.getElementById('h-note').value = note.note||'';
      document.getElementById('h-contact-mobile').value = note.contact_mobile||'';
      document.getElementById('h-contact-tel').value    = note.contact_tel||'';
      document.getElementById('h-contact-fax').value    = note.contact_fax||'';
      document.getElementById('h-contact-email').value  = note.contact_email||'';
      document.getElementById('sig-supplier-name').value = note.supplier_name||'';
      document.getElementById('sig-receiver-name').value = note.receiver_name||'';
      if (note.supplier_sig) drawSig('canvas-supplier', note.supplier_sig);
      if (note.receiver_sig) drawSig('canvas-receiver', note.receiver_sig);
    }
    let items = [];
    try {
      items = await FS.getAll('delivery_items',[['delivery_id','==',id]]);
    } catch (e) {
      Toast.error('품목을 불러오지 못했습니다: ' + (e.code || e.message));
    }
    if (myToken !== dnEditorToken) return;   // 그 사이 다른 문서를 열었거나 목록으로 나감
    items.sort((a,b)=>(a.seq||0)-(b.seq||0));
    items.length ? items.forEach(addItemRow) : addItemRow();
  } else {
    document.getElementById('edit-title').textContent = '새 납품확인서';
    editingStatus = '작성중';
    // 공급자 연락처: 이 기기에서 마지막으로 저장한 값으로 채움 (코드에 개인정보를 두지 않음)
    const lastContact = loadLastContact();
    CONTACT_FIELDS.forEach(f => { document.getElementById(f).value = lastContact[f] || ''; });
    addItemRow();
  }
  document.getElementById('btn-print-edit').style.display = editingStatus==='완료' ? '' : 'none';
  document.getElementById('btn-complete').style.display = editingStatus==='완료' ? 'none' : '';
  initCanvases();
}

function addItemRow(item) {
  const tbody = document.getElementById('item-tbody');
  const seq = tbody.children.length + 1;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td style="text-align:center;color:var(--text-hint);font-size:11px;">${seq}</td>
    <td><div class="ac-wrap">
      <input type="text" placeholder="품목명" value="${FS.esc(item?.description||'')}"
        oninput="showAC(this)" onblur="setTimeout(()=>hideAC(this),150)" onfocus="showAC(this)">
      <div class="ac-list"></div>
    </div></td>
    <td><select>${[...MODEL_OPTIONS, ...(item?.model && !MODEL_OPTIONS.includes(item.model) ? [item.model] : [])]   // 목록에 없는 기존 값도 유지 (저장 시 바뀌지 않도록)
      .map(m=>`<option ${m===(item?.model||'Server')?'selected':''}>${FS.esc(m)}</option>`).join('')}</select></td>
    <td><input type="number" min="1" value="${FS.esc(item?.qty||1)}" style="text-align:center;"></td>
    <td><select>${UNIT_OPTIONS.map(u=>`<option ${u===(item?.unit||'EA')?'selected':''}>${u}</option>`).join('')}</select></td>
    <td><input type="text" placeholder="비고" value="${FS.esc(item?.note||'')}"></td>
    <td><button type="button" class="dn-link-btn" onclick="dnOpenAssetPicker(this.closest('tr'))"></button></td>
    <td><button class="btn btn-ghost btn-sm" onclick="removeRow(this)" style="color:var(--danger);">×</button></td>`;
  tr.dataset.assets = JSON.stringify(Array.isArray(item?.asset_ids) ? item.asset_ids : []);
  tbody.appendChild(tr);
  dnRenderLinkBtn(tr);
}

function removeRow(btn) {
  dnDirty = true;
  btn.closest('tr').remove();
  document.querySelectorAll('#item-tbody tr').forEach((tr,i)=>{ tr.cells[0].textContent=i+1; });
}

function showAC(input) {
  const q = input.value.toLowerCase();
  const list = input.parentNode.querySelector('.ac-list');
  const hist = getHist().filter(h=>h.toLowerCase().includes(q) && h!==input.value);
  if (!hist.length) { list.classList.remove('open'); return; }
  list.innerHTML = '';
  hist.slice(0,8).forEach(h=>{
    const d=document.createElement('div'); d.className='ac-item'; d.textContent=h;
    d.addEventListener('mousedown',()=>{ input.value=h; dnDirty=true; list.classList.remove('open'); });
    list.appendChild(d);
  });
  list.classList.add('open');
}
function hideAC(input) { input.parentNode.querySelector('.ac-list').classList.remove('open'); }

function getItemRows() {
  return [...document.querySelectorAll('#item-tbody tr')].map(tr=>{
    const inputs = tr.querySelectorAll('input');
    const sels = tr.querySelectorAll('select');
    const asset_ids = dnRowAssets(tr);
    return { description:inputs[0]?.value.trim()||'', model:sels[0]?.value||'', qty:parseInt(inputs[1]?.value)||1, unit:sels[1]?.value||'EA', note:inputs[2]?.value.trim()||'',
             asset_ids, asset_hosts: asset_ids.map(id => dnAssetName(id)) };   // 장비가 삭제돼도 이름은 남도록
  })
    // 품목명·비고가 모두 빈 행은 저장하지 않음 (새 문서의 기본 빈 행 등)
    .filter(r => r.description || r.note)

// status 생략(저장 버튼) 시 현재 상태 유지, '완료'면 완료 처리
async function saveDraft(status) {
  if (dnSaving) return;
  status = status || editingStatus || '작성중';
  dnSaving = true;
  const btns = [...document.querySelectorAll('#view-edit .dn-save-btn')];
  btns.forEach(b => { b.disabled = true; });
  const wasDirty = dnDirty;
  dnDirty = false;   // 저장 중에 입력한 내용은 다시 변경으로 잡히도록 먼저 초기화
  try {
    await dnSaveNote(status);
  } catch (e) {
    dnDirty = dnDirty || wasDirty;
    console.error('[delivery] save', e);
    Toast.error('저장 실패: ' + (e.code || e.message));
  } finally {
    dnSaving = false;
    btns.forEach(b => { b.disabled = false; });
  }
}

async function dnSaveNote(status) {
  const customerId = useCustomerText ? '' : document.getElementById('h-customer').value;
  const customerName = useCustomerText
    ? document.getElementById('h-customer-text').value.trim()
    : (deliveryCusts.find(c=>c.id===customerId)?.name||'');
  const items = getItemRows();
  items.forEach(i=>{ if(i.description) addHist(i.description); });
  saveLastContact();
  const noteData = {
    customer_id:   customerId,
    customer_name: customerName,
    project_name:  document.getElementById('h-project').value.trim(),
    delivery_date: document.getElementById('h-date').value,
    doc_number:    document.getElementById('h-docno').value.trim(),
    note:          document.getElementById('h-note').value.trim(),
    contact_mobile: document.getElementById('h-contact-mobile').value.trim(),
    contact_tel:    document.getElementById('h-contact-tel').value.trim(),
    contact_fax:    document.getElementById('h-contact-fax').value.trim(),
    contact_email:  document.getElementById('h-contact-email').value.trim(),
    supplier_name: document.getElementById('sig-supplier-name').value.trim(),
    receiver_name: document.getElementById('sig-receiver-name').value.trim(),
    supplier_sig:  document.getElementById('canvas-supplier').toDataURL(),
    receiver_sig:  document.getElementById('canvas-receiver').toDataURL(),
    item_count:    items.length,
    status,
    ...dnAssetIndex(items),
  };
  // 문서 + 품목(기존 삭제·새로 기록)을 batch 하나로 커밋 → 중간 실패로 품목이 사라지거나 중복되지 않음
  // (FS.add/update와 같은 created_at/updated_at 규칙 유지. batch 한도 500건)
  const db  = firebase.firestore();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  const itemsCol = db.collection('delivery_items');
  let noteId = editingNoteId;
  if (noteId) {
    const old = await FS.getAll('delivery_items',[['delivery_id','==',noteId]]);
    batch.update(db.collection('delivery_notes').doc(noteId), { ...noteData, updated_at: now });
    old.forEach(i => batch.delete(itemsCol.doc(i.id)));
  } else {
    const ref = db.collection('delivery_notes').doc();
    noteId = ref.id;
    batch.set(ref, { ...noteData, created_at: now, updated_at: now });
  }
  items.forEach(item => batch.set(itemsCol.doc(), { ...item, delivery_id: noteId, created_at: now, updated_at: now }));
  await batch.commit();

  if (editingNoteId) {
    const idx = deliveryNotes.findIndex(n=>n.id===editingNoteId);
    if (idx>=0) deliveryNotes[idx]={...deliveryNotes[idx],...noteData};
  } else {
    editingNoteId = noteId;
    deliveryNotes.unshift({id:noteId,...noteData});
    document.getElementById('edit-title').textContent = '납품확인서 수정';
  }
  editingStatus = status;
  Toast.success(status==='완료' ? '완료 처리되었습니다' : '저장되었습니다');
  document.getElementById('btn-print-edit').style.display = status==='완료' ? '' : 'none';
  document.getElementById('btn-complete').style.display = status==='완료' ? 'none' : '';
  renderList();
}

async function deleteNote(id) {
  if (!await Dialog.confirm('이 납품확인서를 삭제하시겠습니까?', true)) return;
  const items = await FS.getAll('delivery_items',[['delivery_id','==',id]]);
  await Promise.all(items.map(i=>FS.remove('delivery_items',i.id)));
  await FS.remove('delivery_notes', id);
  deliveryNotes = deliveryNotes.filter(n=>n.id!==id);
  renderList();
  Toast.success('삭제되었습니다');
}

async function waitForPrintImages() {
  const imgs = [...document.querySelectorAll('#print-doc img')];
  if (!imgs.length) return;
  await Promise.all(imgs.map(img => new Promise(resolve => {
    if (img.complete && img.naturalWidth > 0) resolve();
    else { img.onload = resolve; img.onerror = resolve; }
  })));
}

async function printById(id) {

// #print-doc을 인쇄 동안만 body 바로 아래로 옮겨 인쇄 (앱 레이아웃에 잘리지 않고 여러 장 인쇄)
function dnPrint() {
  const doc = document.getElementById('print-doc');
  if (!doc) return;
  const home = doc.parentNode, next = doc.nextSibling;
  // 여러 장일 때: 2쪽부터 위·아래 여백 (1쪽은 상단 장식 바가 끝에 붙도록 위 여백 0)
  let pageStyle = null;
  if (!doc.classList.contains('pd-one-page')) {
    pageStyle = document.createElement('style');
    pageStyle.textContent = '@page { size:A4 portrait; margin:12mm 0 12mm; } @page :first { margin-top:0; }';
    document.head.appendChild(pageStyle);
  }
  document.body.appendChild(doc);
  document.body.classList.add('dn-printing');
  let restored = false;
  const restore = () => {
    if (restored) return;
    restored = true;
    document.body.classList.remove('dn-printing');
    if (pageStyle) pageStyle.remove();
    // 그 사이 다른 페이지로 이동했으면 원래 자리가 없으므로 제거
    if (home && home.isConnected) home.insertBefore(doc, next && next.parentNode === home ? next : null);
    else doc.remove();
  };
  window.addEventListener('afterprint', restore, { once:true });
  window.print();
  // afterprint가 오지 않아 body에 남아도 인라인 display:none으로 화면엔 안 보이고, init()에서 정리됨
}

// ── 미리보기 ───────────────────────────────────────────────
// @media print 안의 인쇄 양식 CSS를 화면용으로 추출 (body 숨김·@page 규칙 제외)
function getPrintCss() {
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const r of rules) {
      if (r.type === CSSRule.MEDIA_RULE && r.media.mediaText === 'print' &&
          [...r.cssRules].some(x => x.selectorText === '.print-doc')) {
        return [...r.cssRules]
          .filter(x => x.selectorText && x.selectorText !== 'body *')
          .map(x => x.cssText).join('\n');
      }
    }
  }
  return '';
}

// #print-doc에 그려진 문서를 iframe으로 띄우고 화면 폭에 맞춰 축소
// (iframe은 sandbox="allow-same-origin": 스크립트 실행 불가, 높이 측정을 위해 문서 접근만 허용)
function showPreview(actionsHtml) {
  const src = document.getElementById('print-doc');
  const frame = document.getElementById('preview-frame');
  frame.style.height = '1123px';
  frame.onload = () => fitPreview();   // 문서 길이(여러 장)에 맞춰 높이 조정
  frame.srcdoc =
    `<!doctype html><html><head><meta charset="utf-8"><style>
      html,body{margin:0;background:#fff;}
      ${getPrintCss()}
      .print-doc{position:relative !important;inset:auto !important;}
    </style></head><body><div class="${FS.esc(src.className)}">${src.innerHTML}</div></body></html>`;
  document.getElementById('preview-actions').innerHTML = actionsHtml;
  document.getElementById('preview-modal').style.display = 'flex';
  fitPreview();
}
function fitPreview() {
  const box = document.getElementById('preview-box');
  const frame = document.getElementById('preview-frame');
  if (!box || !frame || !box.clientWidth) return;
  let h = 1123;   // A4 한 장 (794×1123px)
  try {
    const d = frame.contentDocument;
    if (d && d.body && d.body.firstElementChild) h = Math.max(1123, Math.ceil(d.body.firstElementChild.offsetHeight));
  } catch {}
  frame.style.height = h + 'px';
  const scale = Math.min(1, box.clientWidth / 794);
  frame.style.transform = `scale(${scale})`;
  box.style.height = Math.ceil(h * scale) + 'px';
}
window.addEventListener('resize', () => {
  if (document.getElementById('preview-modal')?.style.display === 'flex') fitPreview();
});
function closePreview() {
  document.getElementById('preview-modal').style.display = 'none';
}

function dnAssetIndex(items) {

  const projs = dnProjects.filter(p => p.customer_id === cid).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  sel.innerHTML = projs.map(p => `<option value="${p.id}">${FS.esc(p.name || '(이름 없음)')}</option>`).join('') + '<option value="__new">+ 새 프로젝트</option>';
  // 납품확인서의 프로젝트명과 같은 프로젝트가 있으면 그것, 없으면 새 프로젝트(이름 미리 채움)
  const same = projs.find(p => (p.name || '').trim() === projName);
  sel.value = same ? same.id : projs.length && !projName ? projs[0].id : '__new';
  document.getElementById('dnb-proj-new').value = projName;
  dnBulkPreview();
}
function dnBulkPlan() {
  const qty = Math.max(0, Math.min(200, parseInt(document.getElementById('dnb-qty').value) || 0));
  const prefix = document.getElementById('dnb-prefix').value.trim();
  const start = Math.max(0, parseInt(document.getElementById('dnb-start').value) || 0);
  const digits = parseInt(document.getElementById('dnb-digits').value) || 1;
  const serials = document.getElementById('dnb-serials').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const rows = Array.from({ length: qty }, (_, i) => ({ hostname: prefix + String(start + i).padStart(digits, '0'), serial: serials[i] || '' }));
  return { qty, prefix, serials, rows };
}
function dnBulkPreview() {
  const isNew = document.getElementById('dnb-proj').value === '__new';
  document.getElementById('dnb-proj-new').style.display = isNew ? '' : 'none';
  const { qty, prefix, serials, rows } = dnBulkPlan();
  const cid = document.getElementById('dnb-cust').value;
  const box = document.getElementById('dnb-preview');
  box.textContent = !prefix || !qty ? 'Hostname 앞부분과 수량을 입력하세요'
    : rows.map(r => `${r.hostname.padEnd(18)} ${r.serial || '(S/N 없음)'}`).join('\n');
  const warns = [], errs = [];
  if (!cid) errs.push('고객사를 선택하세요');
  if (isNew && !document.getElementById('dnb-proj-new').value.trim()) errs.push('새 프로젝트 이름을 입력하세요');
  if (serials.length > qty) errs.push(`S/N이 ${serials.length}개로 수량(${qty})보다 많습니다`);
  else if (serials.length && serials.length < qty) warns.push(`S/N ${serials.length}개 — 나머지 ${qty - serials.length}대는 S/N 없이 등록`);
  const hostTaken = rows.filter(r => dnAssets.some(a => a.customer_id === cid && (a.hostname || '').toLowerCase() === r.hostname.toLowerCase())).map(r => r.hostname);
  if (prefix && hostTaken.length) errs.push(`이미 있는 Hostname: ${hostTaken.slice(0, 5).join(', ')}${hostTaken.length > 5 ? ` 외 ${hostTaken.length - 5}` : ''}`);
  const snTaken = rows.filter(r => r.serial && dnAssets.some(a => (a.serial || '').toLowerCase() === r.serial.toLowerCase())).map(r => r.serial);
  if (snTaken.length) warns.push(`이미 등록된 S/N: ${snTaken.slice(0, 5).join(', ')}${snTaken.length > 5 ? ` 외 ${snTaken.length - 5}` : ''}`);
  const dupSn = serials.filter((s, i) => serials.indexOf(s) !== i);
  if (dupSn.length) errs.push(`S/N 중복 입력: ${[...new Set(dupSn)].join(', ')}`);
  document.getElementById('dnb-warn').innerHTML = errs.map(e => `<div class="dnb-warn err">${FS.esc(e)}</div>`).join('') + warns.map(w => `<div class="dnb-warn">${FS.esc(w)}</div>`).join('');
  const ok = !errs.length && prefix && qty;
  const btn = document.getElementById('dnb-save');
  btn.disabled = !ok;
  btn.textContent = ok ? `${qty}대 등록하고 연결` : '등록하고 연결';
  return ok;
}
function dnSaveBulk() {
  if (!dnBulkPreview() || !dnPickRow) return;
  const cid = document.getElementById('dnb-cust').value;
  let pid = document.getElementById('dnb-proj').value;
  if (pid === '__new') {
    const name = document.getElementById('dnb-proj-new').value.trim();
    pid = FS.addNow('projects', { customer_id: cid, name, install_date: document.getElementById('dnb-date').value, ...FS.creator() });
    FS.audit('등록', '프로젝트', pid, name, '납품확인서에서 장비 일괄 등록');
    dnProjects.push({ id: pid, customer_id: cid, name });
  }
  const base = {
    customer_id: cid, project_id: pid,
    device_type: document.getElementById('dnb-type').value.trim(),
    model: document.getElementById('dnb-model').value.trim(),
    install_date: document.getElementById('dnb-date').value,
    status: '운영중',
    location: '', ip_address: '', os: '', cpu: '', memory: '', gpu: '', disk: '',
    bmc_version: '', bios_version: '', raid_version: '', driver_version: '', vendor_case_no: '',
    memo: `납품: ${document.getElementById('h-docno').value.trim() || '납품확인서'}`,
  };
  // 서버 응답을 기다리지 않음 (오프라인이어도 바로 반영, 연결되면 동기화)
  const ids = dnBulkPlan().rows.map(r => {
    const data = { ...base, hostname: r.hostname, serial: r.serial };
    const id = FS.addNow('assets', { ...data, ...FS.creator() });
    dnAssets.push({ id, ...data });
    return id;
  });
  FS.audit('등록', '장비', '', `납품확인서 일괄 ${ids.length}대`, dnBulkPlan().rows.map(r => r.hostname).join(', '));
  ids.forEach(id => dnPickSel.add(id));
  dnCloseBulk();
  dnApplyAssetPicker();
  Toast.success(`장비 ${ids.length}대 등록·연결 — 납품확인서를 저장하세요`);
}

function dnCloseAssetPicker() { document.getElementById('dn-asset-modal').style.display = 'none'; dnPickRow = null; }
function dnApplyAssetPicker() {
  if (dnPickRow) {
    // 고른 순서 대신 호스트네임 순으로 저장
    const ids = [...dnPickSel].sort((a, b) => dnAssetName(a).localeCompare(dnAssetName(b), 'ko', { numeric: true }));
    dnPickRow.dataset.assets = JSON.stringify(ids);
    dnRenderLinkBtn(dnPickRow);
    dnDirty = true;
  }
  dnCloseAssetPicker();
}

function previewFromEditor() {
  buildPrintFromEditor();
  showPreview(`
    <button class="btn" onclick="closePreview()">닫기</button>
    <button class="btn btn-primary" onclick="closePreview();printFromEditor()">${FS.icon('printer', 16)} 인쇄</button>`);
}

function buildPrint(note, items, cName) {

  while (rows.length < MIN_ROWS) rows.push(null);

  const tableRows = rows.map((item, i) => {
    if (!item) return `<tr class="empty-row"><td class="c">　</td><td>　</td><td class="c">　</td><td class="c">　</td><td class="c">　</td><td>　</td></tr>`;
    return `<tr>
      <td class="c">${i+1}</td>
      <td class="desc">${FS.esc(item.description||'')}</td>
      <td class="c">${FS.esc(item.model||'')}</td>
      <td class="c">${FS.esc(item.qty||1)}</td>
      <td class="c">${FS.esc(item.unit||'EA')}</td>
      <td>${FS.esc(item.note||'')}</td>
    </tr>`;
  }).join('');

  // 서명은 캔버스가 만든 data:image(png/jpeg) base64만 허용 (그 외 값은 HTML·외부 URL 주입 위험 → 생략)
  const supOk = dnSafeSig(note.supplier_sig), recOk = dnSafeSig(note.receiver_sig);
  const supSig = supOk && !isBlank(supOk,400,110)
    ? `<img src="${supOk}">`
    : '<div class="sig-empty-line"></div>';
  const recSig = recOk && !isBlank(recOk,400,110)
    ? `<img src="${recOk}">`
    : '<div class="sig-empty-line"></div>';

  const doc = document.getElementById('print-doc');
  doc.className = 'print-doc' + (items.length <= DN_ONE_PAGE_MAX ? ' pd-one-page' : '');
  doc.innerHTML = `
    <div class="pd-topbar"></div>

    <div class="pd-header">
      <div class="pd-brand">
        <div class="pd-brand-name">xiilab</div>
        <div class="pd-brand-contact">${[
          note.contact_mobile ? `M. ${FS.esc(note.contact_mobile)}` : '',
          note.contact_tel    ? `T. ${FS.esc(note.contact_tel)}`    : '',
          note.contact_fax    ? `F. ${FS.esc(note.contact_fax)}`    : '',
          note.contact_email  ? `E. ${FS.esc(note.contact_email)}`  : '',
        ].filter(Boolean).join(' &nbsp; ')}</div>
      </div>
      <div class="pd-doc-title">납 품 확 인 서</div>
      <div class="pd-doc-meta">
        <div><span>문서번호</span>&ensp;<strong>${FS.esc(note.doc_number||'—')}</strong></div>
        <div><span>납품일자</span>&ensp;<strong>${FS.esc(note.delivery_date||'—')}</strong></div>
        <div><span>작성일자</span>&ensp;${new Date().toLocaleDateString('ko-KR')}</div>
      </div>
    </div>

    <div class="pd-recipient-block">
      <div class="pd-recipient">
        <div class="pd-recipient-label">수 신</div>
        <div>
          <span class="pd-recipient-name">${FS.esc(cName||'　')}</span>
          <span class="pd-recipient-suffix">귀중</span>
        </div>
      </div>
      <div class="pd-project-block">
        <div class="pd-project-label">프로젝트</div>
        <div class="pd-project-name">${FS.esc(note.project_name||'—')}</div>
      </div>
    </div>

    <div class="pd-intro">아래와 같이 물품을 납품하였음을 확인합니다.</div>

    <table class="pd-table">
      <thead>
        <tr>
          <th style="width:32px;">No.</th>
          <th>품목명 / Description</th>
          <th style="width:72px;">모델/규격</th>
          <th style="width:40px;">수량</th>
          <th style="width:40px;">단위</th>
          <th style="width:100px;">비고</th>
        </tr>
      </thead>
      <tbody>${tableRows}</tbody>
    </table>

    <div class="pd-confirm">
      상기 물품이 정상적으로 납품 완료되었음을 확인합니다.
    </div>

    <div class="pd-sigs">
      <div class="pd-sig">
        <div class="pd-sig-head">공 급 자</div>
        <div class="pd-sig-name">${FS.esc(note.supplier_name||'　')}</div>
        <div class="pd-sig-canvas">${supSig}</div>
        <div class="pd-sig-date">${FS.esc(note.delivery_date||'　　　　')}</div>
      </div>
      <div class="pd-sig">
        <div class="pd-sig-head">인 수 자</div>
        <div class="pd-sig-name">${FS.esc(note.receiver_name||'　')}</div>
        <div class="pd-sig-canvas">${recSig}</div>
        <div class="pd-sig-date">${FS.esc(note.delivery_date||'　　　　')}</div>
      </div>

    ${note.note ? `<div style="margin-top:5mm;font-size:8pt;color:#666;padding:2mm 0;border-top:1px solid #eee;">※ 비고: ${FS.esc(note.note)}</div>` : ''}

    <div class="pd-footer">
      <span class="pd-footer-left">본 문서는 xiilab에서 발행한 납품확인서입니다.</span>

}

/* ── 캔버스 서명 ────────────────────────── */
// 서명 값 검증: data:image/png|jpeg;base64 만 통과, 아니면 ''
function dnSafeSig(v) {
  return (typeof v === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v)) ? v : '';
}

// 캔버스 요소마다 한 번만 리스너 등록 (openEditor 때마다 중복 등록되지 않도록)
function initCanvases() {
  ['canvas-supplier','canvas-receiver'].forEach(id => {
    const canvas = document.getElementById(id);
    if (!canvas || canvas.dataset.bound) return;
    canvas.dataset.bound = '1';
    const ctx = canvas.getContext('2d');
    let drawing = false;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width/r.width, sy = canvas.height/r.height;
      const s = e.touches ? e.touches[0] : e;
      return [(s.clientX-r.left)*sx, (s.clientY-r.top)*sy];
    }
    function start(e) { e.preventDefault(); drawing=true; dnDirty=true; dnSigToken[id]=(dnSigToken[id]||0)+1; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); }
    function move(e)  { if(!drawing) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); }
    function end()    { drawing=false; }
    canvas.addEventListener('mousedown',start);
    canvas.addEventListener('mousemove',move);
    canvas.addEventListener('mouseup',end);
    canvas.addEventListener('mouseleave',end);
    canvas.addEventListener('touchstart',start,{passive:false});
    canvas.addEventListener('touchmove',move,{passive:false});
    canvas.addEventListener('touchend',end);
  });
}

// 서명 이미지가 비어 있는지 (값 없음 또는 같은 크기의 빈 캔버스와 동일)
function isBlank(dataUrl, w, h) {
  if (!dataUrl) return true;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return dataUrl === c.toDataURL();
}

function clearCanvas(id) {
  dnSigToken[id] = (dnSigToken[id]||0) + 1;   // 로딩 중인 서명 이미지가 나중에 그려지지 않도록
  const c=document.getElementById(id); c.getContext('2d').clearRect(0,0,c.width,c.height);
}
function drawSig(id, dataUrl) {
  const safe = dnSafeSig(dataUrl);
  if (!safe) return;
  const tok = dnSigToken[id] = (dnSigToken[id]||0) + 1;
  const img = new Image();
  img.onload = () => {
    if (tok !== dnSigToken[id]) return;   // 그 사이 다른 문서를 열었거나 지움·새로 서명함
    const c = document.getElementById(id);
    if (c) c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  };
  img.src = safe;
}

init();
</script>
