<!-- 개요 (홈): 현장에서 앱을 열자마자 볼 것 — 오늘의 이슈 수, 신호 3칸, 먼저 확인 + 다가오는 작업 (PC는 2단) -->
<style>
  .ov-head { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .ov-eyebrow { display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; color:var(--text-sub); }
  .ov-eyebrow::before { content:''; width:8px; height:8px; background:var(--primary); flex-shrink:0; }
  .ov-hello { font-family:var(--font-heading); font-size:26px; font-weight:700; letter-spacing:-0.03em; line-height:1.2; }
  .ov-hello em { font-style:normal; color:var(--primary-text); }
  .ov-hello .ov-name { white-space:nowrap; }

  /* 장비 검색 (폰 전용 — PC는 상단 검색 Ctrl K) */
  .ov-search-wrap { margin-bottom:14px; }
  .ov-search { display:flex; align-items:center; gap:10px; height:52px; padding:0 14px; background:var(--surface); border:2px solid var(--ink); }
  .ov-search:focus-within { box-shadow:0 0 0 3px var(--signal); }
  .ov-search input { flex:1; min-width:0; height:100%; border:none; outline:none; background:transparent; color:var(--text); font-family:var(--font-mono); font-size:16px; }   /* 16px 미만이면 iOS가 확대 */
  .ov-search input::placeholder { font-family:var(--font-body); }   /* 한글이 고정폭 글꼴로 벌어지지 않도록 */
  .ov-hits { border:1px solid var(--ink); border-top:none; background:var(--surface); }
  .ov-hit { display:flex; flex-direction:column; gap:3px; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .ov-hit:last-child { border-bottom:none; }
  .ov-hit:hover { background:var(--primary-light); }
  .ov-hit-name { font-family:var(--font-mono); font-size:14px; font-weight:600; }
  .ov-hit-meta { font-size:12px; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 신호 3칸: 한 패널, 색은 0이 아닌 장애 숫자에만 */
  .ov-signals { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); background:var(--surface); border:1px solid var(--ink); margin-bottom:20px; }
  .ov-sig { display:flex; align-items:baseline; gap:12px; padding:14px 18px; cursor:pointer; background:none; color:var(--text); border:none; text-align:left; font-family:inherit; min-width:0; }
  .ov-sig + .ov-sig { border-left:1px solid var(--border); }
  .ov-sig:hover { background:var(--surface-2); }
  .ov-sig-n { font-family:var(--font-display); font-size:38px; line-height:1; flex-shrink:0; }
  .ov-sig.hot .ov-sig-n { color:var(--primary-text); }
  .ov-sig.zero .ov-sig-n { color:var(--text-hint); }
  .ov-sig-txt { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ov-sig-l { font-size:13px; font-weight:600; }
  .ov-sig-s { font-size:12px; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 먼저 확인 · 다가오는 작업: PC는 2단 */
  .ov-cols { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; align-items:start; }
  .ov-panel { background:var(--surface); border:1px solid var(--ink); }
  .ov-panel-head { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--ink); }
  .ov-panel-head h2 { font-size:15px; font-weight:700; }
  .ov-panel-head small { font-family:var(--font-mono); font-size:12px; color:var(--text-sub); }
  .ov-panel-head .ov-more { background:none; border:none; padding:0; font-family:inherit; font-size:12px; font-weight:600; color:var(--primary-text); text-decoration:underline; cursor:pointer; }

  .ov-row { display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .ov-row:last-child { border-bottom:none; }
  .ov-row:hover { background:var(--surface-2); }
  .ov-cat { width:40px; flex-shrink:0; font-size:11px; font-weight:600; color:var(--text-sub); }
  .ov-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .ov-title { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-meta { font-size:12px; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 태그: 긴급=주황 채움, 기한 지남=검정+주황 글자, 임박=노랑, 나머지=테두리만 */
  .ov-tag { flex-shrink:0; font-variant-numeric:tabular-nums; font-size:12px; font-weight:600; padding:3px 8px; border:1px solid var(--ink); background:var(--surface); color:var(--text); white-space:nowrap; }
  .ov-tag.t-urgent { background:var(--primary); color:#111111; }
  .ov-tag.t-over { background:#111111; color:#FF7A45; border-color:#111111; }
  .ov-tag.t-soon { background:var(--signal); color:#111111; }
  .ov-tag.t-muted { color:var(--text-sub); border-color:var(--border); }
  html[data-theme="dark"] .ov-tag.t-over { background:#000000; border-color:#5A564D; }

  /* 작업 행 */
  .ov-job { display:flex; gap:14px; padding:13px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .ov-job:last-child { border-bottom:none; }
  .ov-job:hover { background:var(--surface-2); }
  .ov-job-when { width:66px; flex-shrink:0; display:flex; flex-direction:column; gap:4px; }
  .ov-job-when .ov-tag { text-align:center; }
  .ov-job-time { font-family:var(--font-mono); font-size:11px; color:var(--text-sub); }
  .ov-prep { display:flex; align-items:center; gap:8px; }
  .ov-prep-bar { flex:1; height:6px; background:var(--border); }
  .ov-prep-bar span { display:block; height:100%; background:var(--ink); }
  .ov-prep-n { font-size:12px; font-variant-numeric:tabular-nums; color:var(--text); }
  .ov-warn { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-warn::before { content:''; width:8px; height:8px; flex-shrink:0; }
  .ov-warn.w-over { color:var(--primary-text); }
  .ov-warn.w-over::before { background:var(--primary); }
  .ov-warn.w-today::before { background:var(--signal); outline:1px solid #111111; }

  .ov-allclear { padding:22px 16px; text-align:center; font-size:13px; color:var(--text-sub); }

  @media (min-width:769px) { .ov-search-wrap { display:none; } }
  @media (max-width:1100px) { .ov-cols { grid-template-columns:minmax(0,1fr); } }
  @media (max-width:768px) {
    .ov-hello { font-size:22px; }
    .ov-hello .ov-name { display:none; }   /* 폰은 폭이 좁아 이름 생략 */
    .ov-signals { margin-bottom:16px; }
    .ov-sig { flex-direction:column; gap:4px; padding:10px 12px; }
    .ov-sig-n { font-size:28px; }
    .ov-sig-s { display:none; }
    .ov-sig-l { font-size:12px; }
    .ov-cols { gap:16px; }
    .ov-row { min-height:60px; padding:8px 14px; }
    .ov-cat { display:none; }
    .ov-job { padding:12px 14px; }
  }
</style>

<div class="ov-head">
  <span class="ov-eyebrow" id="ov-date">TODAY</span>
  <h1 class="ov-hello" id="ov-hello">오늘의 이슈</h1>
</div>

<div class="ov-search-wrap">
  <label class="ov-search">
    <i data-icon="search" data-size="20"></i>
    <input type="search" id="ov-q" placeholder="호스트명 · S/N · IP" aria-label="장비 검색" oninput="renderHits()" autocomplete="off">
  </label>
  <div class="ov-hits" id="ov-hits" style="display:none;"></div>
</div>

<div class="ov-signals" id="ov-signals"></div>

<div class="ov-cols">
  <section class="ov-panel">
    <div class="ov-panel-head"><h2>먼저 확인</h2><small id="ov-todo-count"></small></div>
    <div id="ov-todo"></div>
  </section>
  <section class="ov-panel">
    <div class="ov-panel-head"><h2>다가오는 작업</h2><button class="ov-more" onclick="loadPage('jobs')">작업 일정 보기</button></div>
    <div id="ov-jobs"></div>
  </section>
</div>

<script>
FS.requireAuth();

let ovData = { customers: [], projects: [], assets: [] };

function init() {
  const d = new Date();
  const W = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  document.getElementById('ov-date').textContent =
    `TODAY · ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${W[d.getDay()]}`;

  // 뒤로 가기로 돌아온 경우 검색어 복원
  if (window.hwPageFilter && window.hwPageFilter.page === 'overview') {
    document.getElementById('ov-q').value = window.hwPageFilter.q || '';
    window.hwPageFilter = null;
  }
  FS.watch([
    ['customers'],
    ['projects'],
    ['assets'],
    ['tickets'],
    ['jobs'],
    ['parts'],
  ], data => renderOverview(...data));
}

function pageViewState() {
  return { filter: { q: document.getElementById('ov-q').value }, label: '홈' };
}

// ── 장비 검색: 결과를 누르면 고객사 화면의 해당 장비 상세로 ──
function renderHits() {
  const q = document.getElementById('ov-q').value.trim().toLowerCase();
  const box = document.getElementById('ov-hits');
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const has = v => String(v ?? '').toLowerCase().includes(q);
  const custName = id => (ovData.customers.find(c => c.id === id) || {}).name || '-';
  const projName = id => (ovData.projects.find(p => p.id === id) || {}).name || '-';
  const hits = ovData.assets.filter(a =>
    has(a.hostname) || has(a.serial) || has(a.ip_address) || has(a.bmc_ip) || has(a.model) || has(a.location)).slice(0, 8);
  box.style.display = '';
  box.innerHTML = hits.length ? hits.map(a => `
    <div class="ov-hit" onclick="openAssetFromHome('${a.id}')">
      <span class="ov-hit-name">${FS.esc(a.hostname || '-')}</span>
      <span class="ov-hit-meta">${FS.esc(custName(a.customer_id))} › ${FS.esc(projName(a.project_id))}${a.ip_address ? ' · ' + FS.esc(a.ip_address) : ''}${a.serial ? ' · ' + FS.esc(a.serial) : ''}</span>
    </div>`).join('')
    : '<div class="ov-hit" style="cursor:default;"><span class="ov-hit-meta">일치하는 장비가 없습니다</span></div>';
}

function openAssetFromHome(id) {
  window.hwPageFilter = { page: 'customers', assetId: id };
  loadPage('customers');
}

function renderOverview(customers, projects, assets, tickets, jobs, parts) {
  ovData = { customers, projects, assets };
  if (document.getElementById('ov-q').value) renderHits();

  const today = new Date(); today.setHours(0,0,0,0);
  function daysLeft(exp) {
    if (!exp) return null;
    let d = typeof exp === 'string' ? new Date(exp.replace(/-/g,'/')) : (exp.toDate ? exp.toDate() : new Date(exp));
    return Math.ceil((d - today) / 86400000);
  }
  const custMap = Object.fromEntries(customers.map(c => [c.id, c.name || c.id]));
  const openTickets = tickets.filter(t => t.status !== '완료');

  // ── 다가오는 작업: 7일 이내 예정 (지난 날짜인데 완료 안 한 것 포함) + 준비 기한 경고 ──
  const dayDiff = ds => Math.round((new Date(ds + 'T00:00:00') - today) / 86400000);
  const shiftDate = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return FS.localDate(d); };
  const upcoming = jobs
    .filter(j => (j.status || '예정') === '예정' && j.date && dayDiff(j.date) <= 7)
    .sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
  const jobWarn = j => {
    const urgent = Object.values(j.items || {})
      .filter(it => !it.done && it.due_days !== null && it.due_days !== undefined)
      .map(it => ({ text: it.text, d: dayDiff(shiftDate(j.date, -it.due_days)) }))
      .filter(x => x.d <= 0).sort((a, b) => a.d - b.d);
    if (!urgent.length) return null;
    const x = urgent[0];
    return { cls: x.d < 0 ? 'w-over' : 'w-today',
             text: `${x.text} — ${x.d < 0 ? `${-x.d}일 지남` : '오늘까지'}${urgent.length > 1 ? ` 외 ${urgent.length - 1}건` : ''}` };
  };
  const jobsWarned = upcoming.filter(j => jobWarn(j)).length;
  const returning = parts.map(p => ({ p, due: Parts.due(p) })).filter(x => x.due);

  // ── 오늘의 이슈 수: 하단 탭 '홈' 배지와 같은 기준 (index.html _todayCounts)
  //    긴급 미완료 장애 + 오늘·지난 예정 작업 또는 준비 기한 도래 + 반납 기한 3일 이내 부품
  const issues = openTickets.filter(t => t.priority === '긴급').length
    + jobs.filter(j => (j.status || '예정') === '예정' && j.date && (dayDiff(j.date) <= 0 || jobWarn(j))).length
    + returning.filter(x => x.due.d <= 3).length;
  const first = (FS.getCurrentUser()?.displayName || '').split(' ')[0];
  document.getElementById('ov-hello').innerHTML =
    (first ? `<span class="ov-name">${FS.esc(first)}님, </span>` : '') +
    (issues ? `오늘의 이슈 <em>${issues}</em>건` : '오늘은 급한 이슈가 없습니다');

  // ── 신호 3칸 ──
  const pri = p => openTickets.filter(t => t.priority === p).length;
  const sub = [pri('긴급') && `긴급 ${pri('긴급')}`, pri('높음') && `높음 ${pri('높음')}`].filter(Boolean).join(' · ');
  const overdueParts = returning.filter(x => x.due.d < 0).length;
  const sig = (n, label, subText, hot, onclick) =>
    `<button class="ov-sig${!n ? ' zero' : hot ? ' hot' : ''}" onclick="${onclick}">
      <span class="ov-sig-n">${n}</span>
      <span class="ov-sig-txt"><span class="ov-sig-l">${label}</span><span class="ov-sig-s">${FS.esc(subText || '')}</span></span>
    </button>`;
  document.getElementById('ov-signals').innerHTML =
    sig(openTickets.length, '진행중 장애', sub, pri('긴급') > 0, "window.hwPageFilter={page:'tickets',status:'처리중'};loadPage('tickets')") +
    sig(upcoming.length, '7일 내 작업', jobsWarned ? `준비 급함 ${jobsWarned}건` : '', false, "loadPage('jobs')") +
    sig(returning.length, '부품 반납', overdueParts ? `${overdueParts}건 기한 지남` : '', overdueParts > 0, "loadPage('parts')");

  // ── 먼저 확인: 긴급·높음 장애 → 불량 부품 반납 기한(지남·3일 이내) → 30일 내 워런티 ──
  const PRI = { '긴급': 0, '높음': 1, '보통': 2, '낮음': 3 };
  const todo = [];
  openTickets
    .filter(t => t.priority === '긴급' || t.priority === '높음')
    .sort((a, b) => (PRI[a.priority] ?? 9) - (PRI[b.priority] ?? 9))
    .slice(0, 3)
    .forEach(t => todo.push({
      cat: '장애',
      title: t.title || '(제목 없음)',
      meta: `${custMap[t.customer_id] || '고객사 없음'} · ${t.status || '접수'}${t.assignee ? ' · ' + t.assignee : ''}`,
      tag: t.priority, cls: t.priority === '긴급' ? 't-urgent' : '',
      onclick: `window.hwPageFilter={page:'tickets',ticketId:'${t.id}'};loadPage('tickets')`,   // 해당 티켓 바로 열기
    }));
  returning
    .filter(x => x.due.d <= 3)
    .sort((a, b) => a.due.d - b.due.d)
    .slice(0, 3)
    .forEach(({ p, due }) => todo.push({
      cat: '부품',
      title: `${p.name || '부품'} 불량 반납`,
      meta: [custMap[p.customer_id], p.asset_host, p.case_no ? 'RMA ' + p.case_no : ''].filter(Boolean).join(' · '),
      tag: due.d < 0 ? `반납 D+${-due.d}` : `반납 D-${due.d}`, cls: due.d < 0 ? 't-over' : 't-soon',
      onclick: `window.hwPageFilter={page:'parts',partId:'${p.id}'};loadPage('parts')`,
    }));
  projects
    .filter(p => { const d = daysLeft(p.warranty_expire); return d !== null && d >= 0 && d <= 30; })
    .sort((a, b) => daysLeft(a.warranty_expire) - daysLeft(b.warranty_expire))
    .slice(0, 3)
    .forEach(p => todo.push({
      cat: '워런티',
      title: `${p.name || '-'} 워런티`,
      meta: `${custMap[p.customer_id] || '-'} · ${FS.formatDate(p.warranty_expire) || ''} 만료`,
      tag: `D-${daysLeft(p.warranty_expire)}`, cls: 't-muted',
      onclick: "window.hwPageFilter={page:'warranty',status:'urgent'};loadPage('warranty')",
    }));

  document.getElementById('ov-todo-count').textContent = `${todo.length}건`;
  document.getElementById('ov-todo').innerHTML = todo.length ? todo.map(it => `
    <div class="ov-row" onclick="${it.onclick}">
      <span class="ov-cat">${it.cat}</span>
      <div class="ov-main">
        <span class="ov-title">${FS.esc(it.title)}</span>
        <span class="ov-meta">${FS.esc(it.meta)}</span>
      </div>
      <span class="ov-tag ${it.cls}">${FS.esc(it.tag)}</span>
    </div>`).join('')
    : '<div class="ov-allclear">급한 일 없음 — 긴급·높음 장애, 반납 기한, 30일 내 워런티 만료가 없습니다</div>';

  document.getElementById('ov-jobs').innerHTML = upcoming.length ? upcoming.slice(0, 5).map(j => {
    const items = Object.values(j.items || {});
    const done = items.filter(it => it.done).length;
    const d = dayDiff(j.date);
    const tag = d === 0 ? '<span class="ov-tag t-urgent">D-DAY</span>'
      : d < 0 ? `<span class="ov-tag t-over">D+${-d}</span>`
      : `<span class="ov-tag">D-${d}</span>`;
    const host = (assets.find(a => a.id === j.asset_id) || {}).hostname || j.asset_host || '';
    const meta = [custMap[j.customer_id], host, j.assignee].filter(Boolean).join(' · ');
    const w = jobWarn(j);
    return `<div class="ov-job" onclick="window.hwPageFilter={page:'jobs',jobId:'${j.id}'};loadPage('jobs')">
      <div class="ov-job-when">
        ${tag}
        <span class="ov-job-time">${j.date.slice(5).replace('-', '.')}${j.time ? ' ' + FS.esc(j.time) : ''}</span>
      </div>
      <div class="ov-main" style="gap:5px;">
        <span class="ov-title">${FS.esc(j.title || '(제목 없음)')}</span>
        ${meta ? `<span class="ov-meta">${FS.esc(meta)}</span>` : ''}
        ${items.length ? `<span class="ov-prep"><span class="ov-prep-bar"><span style="width:${Math.round(done / items.length * 100)}%;"></span></span><span class="ov-prep-n">준비 ${done}/${items.length}</span></span>` : ''}
        ${w ? `<span class="ov-warn ${w.cls}">${FS.esc(w.text)}</span>` : ''}
      </div>
    </div>`;
  }).join('') + (upcoming.length > 5 ? `<div class="ov-allclear"><button class="btn btn-sm" onclick="loadPage('jobs')">작업 ${upcoming.length - 5}건 더 보기</button></div>` : '')
    : `<div class="ov-allclear" style="cursor:pointer;" onclick="loadPage('jobs')">7일 안에 예정된 작업이 없습니다 — 작업 일정 열기</div>`;
}

init();
</script>
