<!-- 장애 티켓 -->
<style>
  .ticket-layout { display:flex; gap:16px; }
  .ticket-list-col { flex:1; min-width:0; }
  .ticket-detail-col { width:380px; flex-shrink:0; }
  @media (max-width:768px) {
    .ticket-layout { flex-direction:column; }
    /* 세로 배치에서 flex:1(기준 0)이면 iOS Safari가 높이를 잘못 계산해 상세 하단이 잘림 */
    .ticket-list-col, .ticket-detail-col { flex:none; }
    .ticket-detail-col { width:100%; }
    /* 필터: 2열 그리드로 줄바꿈 */
    .ticket-toolbar { flex-direction:column; align-items:stretch; gap:8px; }
    .ticket-filters { display:grid !important; grid-template-columns:1fr 1fr; }
    .ticket-filters > * { width:100% !important; max-width:none !important; }
  }
  .priority-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .history-item { padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; }
  .history-item:last-child { border-bottom:none; }
</style>

<div id="stat-grid"></div>

<div class="flex-between mb-3 ticket-toolbar">
  <div class="flex gap-2 ticket-filters">
    <input type="text" class="form-input" id="ticket-search" placeholder="제목·고객사·담당자·내용 검색" oninput="renderTickets()" style="max-width:280px;">
    <select class="form-select" id="filter-status" style="width:140px;" onchange="renderStats();renderTickets()">
      <option value="">전체 상태</option>
      <option value="처리중">처리중 (완료 제외)</option>
      <option>접수</option><option>진행중</option><option>보류</option><option>완료</option>
    </select>
    <select class="form-select" id="filter-priority" style="width:130px;" onchange="renderTickets()">
      <option value="">전체 우선순위</option>
      <option>긴급</option><option>높음</option><option>보통</option><option>낮음</option>
    </select>
    <select class="form-select" id="filter-customer" style="width:160px;" onchange="renderTickets()">
      <option value="">전체 고객사</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="openModal()">+ 티켓 등록</button>
</div>

<div class="ticket-layout">
  <div class="ticket-list-col">
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
      <table class="table table-clickable">
        <thead>
          <tr><th style="width:36px;"></th><th>제목</th><th>고객사</th><th>상태</th><th>우선순위</th><th>담당자</th><th>등록일</th><th>완료일</th></tr>
        </thead>
        <tbody id="ticket-tbody"></tbody>
      </table>
      </div>
      <div id="ticket-empty" class="empty-state" style="display:none;">
        <div class="empty-icon">🔧</div><div>등록된 티켓이 없습니다</div>
      </div>
    </div>
  </div>

  <div class="ticket-detail-col" id="detail-col" style="display:none;">
    <div class="card" id="detail-panel"></div>
  </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="ticket-modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h3 id="modal-title">티켓 등록</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-group"><label class="form-label">제목 *</label><input type="text" class="form-input" id="f-title" placeholder="장애 내용 요약"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">고객사</label>
          <select class="form-select" id="f-customer"><option value="">선택 안 함</option></select>
        </div>
        <div class="form-group"><label class="form-label">담당자</label>
          <input type="text" class="form-input" id="f-assignee" placeholder="담당자 이름">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">우선순위</label>
          <select class="form-select" id="f-priority">
            <option>보통</option><option>긴급</option><option>높음</option><option>낮음</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">상태</label>
          <select class="form-select" id="f-status" onchange="toggleCompletedAt()">
            <option>접수</option><option>진행중</option><option>보류</option><option>완료</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="completed-at-group" style="display:none;">
        <label class="form-label">완료일</label>
        <input type="date" class="form-input" id="f-completed-at">
      </div>
      <div class="form-group"><label class="form-label">증상</label><textarea class="form-textarea" id="f-symptom" rows="3" placeholder="발생한 증상을 상세히 기술"></textarea></div>
      <div class="form-group"><label class="form-label">조치내용</label><textarea class="form-textarea" id="f-action" rows="3" placeholder="처리한 내용"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveTicket()">저장</button>
    </div>
  </div>
</div>

<script>
FS.requireAuth();

let allTickets = [];
let ticketCusts = {};
let ticketSelectedId = null;

const STATUS_BADGE = { '접수':'badge-info','진행중':'badge-warning','보류':'badge-gray','완료':'badge-success' };
const PRIORITY_COLOR = { '긴급':'#dc2626','높음':'#d97706','보통':'#2563eb','낮음':'#9b9b9b' };

function init() {
  ticketSelectedId = null;
  // 개요에서 '처리중 티켓'을 눌러 들어온 경우
  if (window.hwPageFilter && window.hwPageFilter.page === 'tickets') {
    document.getElementById('filter-status').value = window.hwPageFilter.status || '';
    window.hwPageFilter = null;
  }
  FS.watch([['tickets'], ['customers']], ([tickets, custList]) => {
    allTickets = tickets;
    allTickets.sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));
    ticketCusts = {};
    custList.forEach(c=>ticketCusts[c.id]=c.name||c.id);

    custList.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const opts = custList.map(c=>({ value:c.id, label:c.name||c.id }));
    FS.setOptions(document.getElementById('filter-customer'), opts);
    FS.setOptions(document.getElementById('f-customer'), opts);

    renderStats();
    renderTickets();

    // 열려 있는 상세 패널 갱신 (다른 기기에서 삭제되면 닫기)
    const detailCol = document.getElementById('detail-col');
    if (ticketSelectedId && detailCol.style.display !== 'none') {
      if (allTickets.some(t=>t.id===ticketSelectedId)) showDetail(ticketSelectedId);
      else detailCol.style.display = 'none';
    }
  });
}

function renderStats() {
  const total      = allTickets.length;
  const open       = allTickets.filter(t=>t.status==='접수').length;
  const inProgress = allTickets.filter(t=>t.status==='진행중').length;
  const hold       = allTickets.filter(t=>t.status==='보류').length;
  const done       = allTickets.filter(t=>t.status==='완료').length;
  const sf = document.getElementById('filter-status')?.value || '';
  function item(label, count, filter) {
    const active = sf === filter ? ' active' : '';
    return `<div class="ts-item${active}" onclick="setStatusFilter('${filter}')">
      <span class="ts-count">${count}</span>
      <span class="ts-label">${label}</span>
    </div>`;
  }
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-bar">
      ${item('전체', total, '')}
      <div class="ts-divider"></div>
      ${item('접수', open, '접수')}
      <div class="ts-divider"></div>
      ${item('진행중', inProgress, '진행중')}
      <div class="ts-divider"></div>
      ${item('보류', hold, '보류')}
      <div class="ts-divider"></div>
      ${item('완료', done, '완료')}
    </div>`;
}

function setStatusFilter(status) {
  document.getElementById('filter-status').value = status;
  renderStats();
  renderTickets();
}

function renderTickets() {
  const q = document.getElementById('ticket-search').value.toLowerCase();
  const sf = document.getElementById('filter-status').value;
  const pf = document.getElementById('filter-priority').value;
  const cf = document.getElementById('filter-customer').value;

  const data = allTickets.filter(t =>
    (!q || [t.title, ticketCusts[t.customer_id], t.assignee, t.symptom, t.action]
      .some(v => String(v ?? '').toLowerCase().includes(q))) &&
    (!sf || (sf === '처리중' ? t.status !== '완료' : t.status===sf)) &&
    (!pf || t.priority===pf) &&
    (!cf || t.customer_id===cf)
  );

  document.getElementById('ticket-empty').style.display = data.length?'none':'';
  document.getElementById('ticket-tbody').innerHTML = data.map(t=>`
    <tr onclick="showDetail('${t.id}', true)">
      <td><span class="priority-dot" style="background:${PRIORITY_COLOR[t.priority||'보통']||'#9b9b9b'};"></span></td>
      <td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${FS.esc(t.title||'')}</td>
      <td style="font-size:12px;">${FS.esc(ticketCusts[t.customer_id]||'-')}</td>
      <td><span class="badge ${STATUS_BADGE[t.status||'접수']||'badge-gray'}">${FS.esc(t.status||'접수')}</span></td>
      <td style="font-size:12px;color:${PRIORITY_COLOR[t.priority]||'var(--text-sub)'};">${FS.esc(t.priority||'-')}</td>
      <td style="font-size:12px;">${FS.esc(t.assignee||'-')}</td>
      <td style="font-size:12px;">${FS.formatDate(t.created_at)||'-'}</td>
      <td style="font-size:12px;color:${t.completed_at?'var(--success)':'var(--text-hint)'};">${t.completed_at ? FS.formatDate(t.completed_at) : '-'}</td>
    </tr>`).join('');
}

function showDetail(id, scroll) {
  ticketSelectedId = id;
  const t = allTickets.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('detail-col').style.display='';
  document.getElementById('detail-panel').innerHTML=`
    <div class="flex-between mb-2">
      <span class="badge ${STATUS_BADGE[t.status||'접수']||'badge-gray'}">${FS.esc(t.status||'접수')}</span>
      <div class="flex gap-1">
        <button class="btn btn-sm" onclick="openModal('${id}')">수정</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTicket('${id}')">삭제</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('detail-col').style.display='none'">✕</button>
      </div>
    </div>
    <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">${FS.esc(t.title||'')}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:12px;">
      <div><span class="text-hint">고객사</span><br>${FS.esc(ticketCusts[t.customer_id]||'-')}</div>
      <div><span class="text-hint">담당자</span><br>${FS.esc(t.assignee||'-')}</div>
      <div><span class="text-hint">우선순위</span><br><span style="color:${PRIORITY_COLOR[t.priority]||'inherit'}">${FS.esc(t.priority||'-')}</span></div>
      <div><span class="text-hint">등록일</span><br>${FS.formatDate(t.created_at)||'-'}</div>
      ${t.completed_at?`<div><span class="text-hint">완료일</span><br><span style="color:var(--success);font-weight:500;">${FS.formatDate(t.completed_at)||'-'}</span></div>`:''}
    </div>
    ${t.symptom?`<div class="mb-2"><div class="text-hint" style="font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:4px;">증상</div><p style="font-size:13px;white-space:pre-wrap;line-height:1.6;">${FS.esc(t.symptom)}</p></div>`:''}
    ${t.action?`<div class="mb-2"><div class="text-hint" style="font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:4px;">조치내용</div><p style="font-size:13px;white-space:pre-wrap;line-height:1.6;">${FS.esc(t.action)}</p></div>`:''}
    <div class="mt-3">
      <label class="form-label">상태 변경</label>
      <div class="flex gap-1">
        ${['접수','진행중','보류','완료'].map(s=>`
          <button class="btn btn-sm ${t.status===s?'btn-primary':''}" onclick="changeStatus('${id}','${s}')">${s}</button>
        `).join('')}
      </div>
    </div>`;
  // 모바일: 상세가 목록 아래에 붙으므로 상세 위치로 스크롤
  if (scroll && window.innerWidth <= 768) {
    FS.scrollToEl(document.getElementById('detail-col'));
  }
}

async function changeStatus(id, status) {
  const cur = allTickets.find(x=>x.id===id);
  if (cur && cur.status === status) return;   // 같은 상태 재선택 시 완료일 덮어쓰기 방지
  const today = FS.localDate();
  const updateData = {
    status,
    completed_at: status === '완료' ? today : null,
  };
  await FS.update('tickets', id, updateData);
  const t = allTickets.find(x=>x.id===id);
  if (t) {
    t.status = status;
    t.completed_at = status === '완료' ? today : null;
  }
  showDetail(id);
  renderStats();
  renderTickets();
}

function toDateInputVal(ts) {
  if (!ts) return '';
  if (typeof ts === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ts)) return ts;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return FS.localDate(d);
}

function toggleCompletedAt() {
  const isDone = document.getElementById('f-status').value === '완료';
  const group = document.getElementById('completed-at-group');
  group.style.display = isDone ? '' : 'none';
  if (isDone && !document.getElementById('f-completed-at').value) {
    document.getElementById('f-completed-at').value = FS.localDate();
  }
}

function openModal(id) {
  document.getElementById('ticket-modal').style.display='flex';
  if (id) {
    const t = allTickets.find(x=>x.id===id);
    document.getElementById('modal-title').textContent='티켓 수정';
    document.getElementById('edit-id').value=id;
    document.getElementById('f-title').value=t.title||'';
    document.getElementById('f-customer').value=t.customer_id||'';
    document.getElementById('f-assignee').value=t.assignee||'';
    document.getElementById('f-priority').value=t.priority||'보통';
    document.getElementById('f-status').value=t.status||'접수';
    document.getElementById('f-completed-at').value=toDateInputVal(t.completed_at);
    document.getElementById('f-symptom').value=t.symptom||'';
    document.getElementById('f-action').value=t.action||'';
  } else {
    document.getElementById('modal-title').textContent='티켓 등록';
    document.getElementById('edit-id').value='';
    ['f-title','f-assignee','f-symptom','f-action','f-completed-at'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-priority').value='보통';
    document.getElementById('f-status').value='접수';
    document.getElementById('f-customer').value='';
  }
  toggleCompletedAt();
}
function closeModal() { document.getElementById('ticket-modal').style.display='none'; }

async function saveTicket() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { Toast.error('제목을 입력하세요'); return; }
  const status = document.getElementById('f-status').value;
  const data = {
    title,
    customer_id: document.getElementById('f-customer').value,
    assignee: document.getElementById('f-assignee').value.trim(),
    priority: document.getElementById('f-priority').value,
    status,
    symptom: document.getElementById('f-symptom').value.trim(),
    action: document.getElementById('f-action').value.trim(),
  };
  const id = document.getElementById('edit-id').value;
  if (status === '완료') {
    data.completed_at = document.getElementById('f-completed-at').value
      || FS.localDate();
  } else {
    data.completed_at = null;
  }
  if (id) {
    await FS.update('tickets', id, data);
    const idx = allTickets.findIndex(x=>x.id===id);
    if (idx >= 0) allTickets[idx] = {...allTickets[idx], ...data};
    Toast.success('티켓이 수정되었습니다');
  } else {
    const newId = await FS.add('tickets', data);
    allTickets.unshift({id:newId, ...data});
    Toast.success('티켓이 등록되었습니다');
  }
  closeModal();
  renderStats();
  renderTickets();
  if (ticketSelectedId===id) showDetail(id);
}

async function deleteTicket(id) {
  if (!await Dialog.confirm('이 티켓을 삭제하시겠습니까?', true)) return;
  await FS.remove('tickets', id);
  allTickets = allTickets.filter(x=>x.id!==id);
  document.getElementById('detail-col').style.display='none';
  renderStats();
  renderTickets();
  Toast.success('티켓이 삭제되었습니다');
}

init();
</script>
