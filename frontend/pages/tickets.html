<!-- 장애 티켓 -->
<style>
  .ticket-layout { display:flex; gap:16px; }
  .ticket-list-col { flex:1; min-width:0; }
  .ticket-detail-col { width:420px; flex-shrink:0; }
  @media (max-width:768px) {
    .ticket-layout { flex-direction:column; }
    /* 세로 배치에서 flex:1(기준 0)이면 iOS Safari가 높이를 잘못 계산해 상세 하단이 잘림 */
    .ticket-list-col, .ticket-detail-col { flex:none; }
    .ticket-detail-col { width:100%; }
    /* 상세를 열면 목록을 숨기고 상세만 (긴 목록 아래로 내려가지 않도록). 닫기·뒤로가기 → 목록 */
    .ticket-layout.detail-open .ticket-list-col { display:none; }
    /* 필터: 2열 그리드로 줄바꿈 */
    .ticket-toolbar { flex-direction:column; align-items:stretch; gap:8px; }
    .ticket-filters { display:grid !important; grid-template-columns:1fr 1fr; }
    .ticket-filters > * { width:100% !important; max-width:none !important; }
  }
  /* 폰 목록: 우선순위 점 · 제목(장비·고객사) · 상태만 — 가로 스크롤 없이 한눈에 */
  .tk-cust-m { display:none; }
  @media (max-width:768px) {
    #ticket-tbody td:nth-child(n+5), #ticket-tbody td:nth-child(3),
    .ticket-list-col thead th:nth-child(n+5), .ticket-list-col thead th:nth-child(3) { display:none; }
    #ticket-tbody td:nth-child(2) { max-width:none !important; width:100%; white-space:normal !important; }
    #ticket-tbody td { padding-top:11px; padding-bottom:11px; }
    .tk-cust-m { display:inline; }
  }
  .priority-dot { width:10px; height:10px; border:1.5px solid var(--ink); display:inline-block; margin-right:6px; }
  @media (max-width:768px) {
    .tl-chip { height:40px; padding:0 14px; }
    .tl-actions button { width:40px; height:40px; }
    .tl-when { font-size:16px !important; height:44px !important; }
  }

  /* ── 진행 기록 (타임라인) ── */
  .td-elapsed { font-family:var(--font-mono); font-size:12px; font-weight:700; background:var(--ink); color:var(--bg); padding:3px 7px; white-space:nowrap; }
  html[data-theme="dark"] .td-elapsed { background:#ECEAE4; color:#111111; }
  .tl-compose { border:2px solid var(--ink); background:var(--surface-2); padding:10px; margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .tl-types { display:flex; flex-wrap:wrap; gap:6px; }
  .tl-chip { height:32px; padding:0 11px; border:1.5px solid var(--ink); background:var(--surface); color:var(--text); font-family:inherit; font-size:12px; font-weight:800; cursor:pointer; }
  .tl-chip.on { background:var(--ink); color:var(--bg); }
  html[data-theme="dark"] .tl-chip.on { background:#ECEAE4; color:#111111; }
  .tl-compose textarea { min-height:60px; }
  .tl-compose-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tl-when-btn { background:none; border:none; padding:0; font-family:inherit; font-size:12px; font-weight:700; color:var(--text-sub); text-decoration:underline; cursor:pointer; }
  .tl-when { height:32px !important; width:auto !important; font-size:13px !important; }
  .tl-head { display:flex; justify-content:space-between; align-items:center; margin:18px 0 6px; font-size:14px; font-weight:900; }
  .tl-list { border-left:3px solid var(--ink); margin-left:6px; }
  .tl-item { position:relative; padding:8px 0 10px 16px; }
  .tl-item::before { content:''; position:absolute; left:-8px; top:13px; width:11px; height:11px; background:var(--surface); border:2.5px solid var(--ink); }
  .tl-item.auto::before { background:var(--ink); }
  .tl-item.t-부품::before, .tl-item.t-조치::before { background:var(--primary); }
  .tl-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--text-hint); }
  .tl-time { font-family:var(--font-mono); font-weight:700; color:var(--text-sub); }
  .tl-type { font-size:11px; font-weight:800; padding:1px 6px; border:1.5px solid var(--ink); color:var(--text); background:var(--surface); }
  .tl-item.auto .tl-type { background:var(--surface-2); color:var(--text-sub); border-color:var(--border); }
  .tl-text { margin-top:4px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .tl-item.auto .tl-text { color:var(--text-sub); }
  .tl-actions { margin-left:auto; display:flex; gap:2px; }
  .tl-actions button { width:30px; height:30px; border:none; background:none; color:var(--text-hint); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tl-actions button:hover { color:var(--text); background:var(--surface-2); }
  .tl-edit { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .tl-empty { font-size:12px; color:var(--text-hint); padding:6px 0 4px 16px; }
  /* 부품: P/N · FRU */
  .tl-parts { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px; }
  .tl-parts input { font-family:var(--font-mono); }
  .tl-pn { display:inline-flex; gap:4px; align-items:center; font-family:var(--font-mono); font-size:12px; font-weight:700; padding:2px 6px; background:var(--signal); color:#111111; border:1.5px solid var(--ink); margin:4px 4px 0 0; user-select:all; }
  .tl-pn b { font-family:var(--font-body); font-size:10px; font-weight:900; }
  /* 장비 · 관련 티켓 */
  .td-asset { font-family:var(--font-mono); font-weight:700; color:var(--primary-text); cursor:pointer; text-decoration:underline; }
  .td-related { border:2px solid var(--ink); margin-top:14px; }
  .td-related-head { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; background:var(--ink); color:var(--bg); font-size:12px; font-weight:800; }
  html[data-theme="dark"] .td-related-head { background:#0C0C0B; color:#ECEAE4; }
  .td-related-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-top:1px solid var(--border); font-size:12px; cursor:pointer; background:var(--surface); }
  .td-related-item:hover { background:var(--surface-2); }
  .td-related-item span:first-of-type { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .tk-host { display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-hint); font-weight:400; }
</style>

<div id="stat-grid"></div>

<div class="flex-between mb-3 ticket-toolbar">
  <div class="flex gap-2 ticket-filters">
    <input type="text" class="form-input" id="ticket-search" placeholder="제목·고객사·담당자·내용 검색" oninput="renderTickets()" style="max-width:280px;">
    <select class="form-select" id="filter-status" style="width:140px;" onchange="renderStats();renderTickets()">
      <option value="">전체 상태</option>
      <option value="처리중">처리중 (완료 제외)</option>
      <option>접수</option><option>진행중</option><option>보류</option><option>완료</option>
    </select>
    <select class="form-select" id="filter-priority" style="width:130px;" onchange="renderTickets()">
      <option value="">전체 우선순위</option>
      <option>긴급</option><option>높음</option><option>보통</option><option>낮음</option>
    </select>
    <select class="form-select" id="filter-customer" style="width:160px;" onchange="renderTickets()">
      <option value="">전체 고객사</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="openModal()">+ 티켓 등록</button>
</div>

<div class="ticket-layout">
  <div class="ticket-list-col">
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
      <table class="table table-clickable">
        <thead>
          <tr><th style="width:36px;"></th><th>제목</th><th>고객사</th><th>상태</th><th>우선순위</th><th>담당자</th><th>등록일</th><th>완료일</th></tr>
        </thead>
        <tbody id="ticket-tbody"></tbody>
      </table>
      </div>
      <div id="ticket-empty" class="empty-state" style="display:none;">
        <div class="empty-icon">🔧</div><div>등록된 티켓이 없습니다</div>
      </div>
    </div>
  </div>

  <div class="ticket-detail-col" id="detail-col" style="display:none;">
    <div class="card" id="detail-panel"></div>
  </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="ticket-modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h3 id="modal-title">티켓 등록</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-group"><label class="form-label">제목 *</label><input type="text" class="form-input" id="f-title" placeholder="장애 내용 요약"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">고객사</label>
          <select class="form-select" id="f-customer" onchange="tkFillAssets()"><option value="">선택 안 함</option></select>
        </div>
        <div class="form-group"><label class="form-label">장비</label>
          <select class="form-select" id="f-asset" onchange="tkAssetPicked()"><option value="">선택 안 함</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">담당자</label>
          <input type="text" class="form-input" id="f-assignee" placeholder="담당자 이름">
        </div>
        <div class="form-group"><label class="form-label">우선순위</label>
          <select class="form-select" id="f-priority">
            <option>보통</option><option>긴급</option><option>높음</option><option>낮음</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">상태</label>
        <select class="form-select" id="f-status" onchange="toggleCompletedAt()">
          <option>접수</option><option>진행중</option><option>보류</option><option>완료</option>
        </select>
      </div>
      <div class="form-group" id="completed-at-group" style="display:none;">
        <label class="form-label">완료일</label>
        <input type="date" class="form-input" id="f-completed-at">
      </div>
      <!-- 예전 방식(증상·조치 칸)으로 작성된 티켓을 수정할 때만 표시. 새 티켓은 진행 기록으로 -->
      <div id="legacy-fields" style="display:none;">
        <div class="form-group"><label class="form-label">증상 (예전 기록)</label><textarea class="form-textarea" id="f-symptom" rows="3"></textarea></div>
        <div class="form-group"><label class="form-label">조치내용 (예전 기록)</label><textarea class="form-textarea" id="f-action" rows="3"></textarea></div>
      </div>
      <div id="new-hint" class="text-hint" style="font-size:12px;font-weight:600;">등록 후 진행 기록에 증상·점검·조치 내용을 시간순으로 남기세요.</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveTicket()">저장</button>
    </div>
  </div>
</div>

<script>
FS.requireAuth();

let allTickets = [];
let ticketCusts = {};
let ticketAssets = [];   // 장비 연결용
let ticketJobs = [];     // 이 티켓으로 잡은 작업 일정
let ticketSelectedId = null;

const STATUS_BADGE = { '접수':'badge-info','진행중':'badge-warning','보류':'badge-gray','완료':'badge-success' };
const PRIORITY_COLOR = { '긴급':'#FF5A1F','높음':'#FFD23F','보통':'#9DB5FF','낮음':'#D8D5CC' };   // 점(배경)용
const PRIORITY_BADGE = { '긴급':'badge-danger','높음':'badge-warning','보통':'badge-info','낮음':'badge-gray' };

function init() {
  ticketSelectedId = null;
  tlStop = null; tlTicketId = null; tlLogs = [];   // 페이지 재진입 시 (구독은 loadPage가 해제)
  // 개요에서 '처리중 티켓'을 눌러 들어온 경우
  // 장비 상세에서 '장애 등록'으로 온 경우: 첫 데이터가 오면 장비가 채워진 등록 창 열기
  let pendingNew = null, pendingOpen = null, pendingCustomer = '';
  if (window.hwPageFilter && window.hwPageFilter.page === 'tickets') {
    const f = window.hwPageFilter;
    document.getElementById('filter-status').value = f.status || '';
    document.getElementById('filter-priority').value = f.priority || '';   // 뒤로 가기로 돌아온 경우 필터·검색 복원
    document.getElementById('ticket-search').value = f.q || '';
    pendingCustomer = f.customer || '';
    pendingNew = f.newFor || null;
    pendingOpen = f.ticketId || null;   // 홈·장비 이력에서 특정 티켓, 또는 보던 티켓
    window.hwPageFilter = null;
  }
  // 기록 입력칸이나 등록 창에 쓰던 내용이 있으면 다른 화면으로 가기 전에 확인
  window.beforePageLeave = async () => {
    const typing = (document.getElementById('tl-text')?.value.trim())
      || (document.getElementById('ticket-modal')?.style.display === 'flex' && document.getElementById('f-title').value.trim());
    return !typing || await Dialog.confirm('작성 중인 내용이 있습니다.\n저장하지 않고 이동하시겠습니까?', true);
  };
  FS.watch([['tickets'], ['customers'], ['assets'], ['jobs'], ['parts']], ([tickets, custList, assets, jobs, parts]) => {
    allTickets = tickets;
    ticketAssets = assets;
    ticketJobs = jobs;
    ticketParts = parts;
    allTickets.sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));
    ticketCusts = {};
    custList.forEach(c=>ticketCusts[c.id]=c.name||c.id);

    custList.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const opts = custList.map(c=>({ value:c.id, label:c.name||c.id }));
    FS.setOptions(document.getElementById('filter-customer'), opts);
    FS.setOptions(document.getElementById('f-customer'), opts);
    if (pendingCustomer) { document.getElementById('filter-customer').value = pendingCustomer; pendingCustomer = ''; }

    renderStats();
    renderTickets();
    if (pendingNew) { const p = pendingNew; pendingNew = null; openModal(null, p); }
    if (pendingOpen) { const tid = pendingOpen; pendingOpen = null; if (allTickets.some(x => x.id === tid)) showDetail(tid, true); }

    // 열려 있는 상세 패널 갱신 (다른 기기에서 삭제되면 닫기)
    const detailCol = document.getElementById('detail-col');
    if (ticketSelectedId && detailCol.style.display !== 'none') {
      if (allTickets.some(t=>t.id===ticketSelectedId)) showDetail(ticketSelectedId);
      else closeTicketDetail();
    }
  });
}

// 화면 상태 (뒤로 가기로 돌아왔을 때 복원 — index.html)
function pageViewState() {
  const t = ticketSelectedId && document.getElementById('detail-col').style.display !== 'none'
    ? allTickets.find(x => x.id === ticketSelectedId) : null;
  const v = id => document.getElementById(id).value;
  return {
    filter: { status: v('filter-status'), priority: v('filter-priority'), customer: v('filter-customer'), q: v('ticket-search'), ticketId: t ? t.id : null },
    key: t ? 'ticket:' + t.id : '',
    label: t ? (t.title || '장애 티켓') : '장애 티켓',
  };
}

function renderStats() {
  const total      = allTickets.length;
  const open       = allTickets.filter(t=>t.status==='접수').length;
  const inProgress = allTickets.filter(t=>t.status==='진행중').length;
  const hold       = allTickets.filter(t=>t.status==='보류').length;
  const done       = allTickets.filter(t=>t.status==='완료').length;
  const sf = document.getElementById('filter-status')?.value || '';
  function item(label, count, filter) {
    const active = sf === filter ? ' active' : '';
    return `<div class="ts-item${active}" onclick="setStatusFilter('${filter}')">
      <span class="ts-count">${count}</span>
      <span class="ts-label">${label}</span>
    </div>`;
  }
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-bar">
      ${item('전체', total, '')}
      <div class="ts-divider"></div>
      ${item('접수', open, '접수')}
      <div class="ts-divider"></div>
      ${item('진행중', inProgress, '진행중')}
      <div class="ts-divider"></div>
      ${item('보류', hold, '보류')}
      <div class="ts-divider"></div>
      ${item('완료', done, '완료')}
    </div>`;
}

function setStatusFilter(status) {
  document.getElementById('filter-status').value = status;
  renderStats();
  renderTickets();
}

function renderTickets() {
  const q = document.getElementById('ticket-search').value.toLowerCase();
  const sf = document.getElementById('filter-status').value;
  const pf = document.getElementById('filter-priority').value;
  const cf = document.getElementById('filter-customer').value;

  const data = allTickets.filter(t =>
    (!q || [t.title, ticketCusts[t.customer_id], t.assignee, t.symptom, t.action, tkHost(t.asset_id, t), (t.log_keys || []).join(' ')]
      .some(v => String(v ?? '').toLowerCase().includes(q))) &&
    (!sf || (sf === '처리중' ? t.status !== '완료' : t.status===sf)) &&
    (!pf || t.priority===pf) &&
    (!cf || t.customer_id===cf)
  );

  document.getElementById('ticket-empty').style.display = data.length?'none':'';
  document.getElementById('ticket-tbody').innerHTML = data.map(t=>`
    <tr onclick="showDetail('${t.id}', true)">
      <td><span class="priority-dot" style="background:${PRIORITY_COLOR[t.priority||'보통']||'#9b9b9b'};"></span></td>
      <td style="font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${FS.esc(t.title||'')}<span class="tk-host">${FS.esc(tkHost(t.asset_id, t))}${ticketCusts[t.customer_id] ? `<span class="tk-cust-m">${tkHost(t.asset_id, t) ? ' · ' : ''}${FS.esc(ticketCusts[t.customer_id])}</span>` : ''}</span></td>
      <td style="font-size:12px;">${FS.esc(ticketCusts[t.customer_id]||'-')}</td>
      <td><span class="badge ${STATUS_BADGE[t.status||'접수']||'badge-gray'}">${FS.esc(t.status||'접수')}</span></td>
      <td>${t.priority ? `<span class="badge ${PRIORITY_BADGE[t.priority]||'badge-gray'}">${FS.esc(t.priority)}</span>` : '-'}</td>
      <td style="font-size:12px;">${FS.esc(t.assignee||'-')}</td>
      <td style="font-size:12px;">${FS.formatDate(t.created_at)||'-'}</td>
      <td style="font-size:12px;color:${t.completed_at?'var(--success)':'var(--text-hint)'};">${t.completed_at ? FS.formatDate(t.completed_at) : '-'}</td>
    </tr>`).join('');
}

// 진행 기록 종류 (자동: 등록·상태)
const TL_TYPES = ['증상', '점검', '조치', '벤더', '부품', '고객연락', '메모'];
const TL_HINTS = {
  '증상': '예: 부팅 중 PSOD 발생, iDRAC에 메모리 경고',
  '점검': '예: HDD fail 확인 (Slot 3)',
  '조치': '예: BIOS 2.13.0 업데이트 후 재부팅',
  '벤더': '예: Dell 케이스 오픈 (SR 123456789)',
  '부품': '예: Slot 3 HDD 교체 (RMA 접수)',
  '고객연락': '예: 고객 담당자에게 작업 일정 공유',
  '메모': '',
};
let tlStop = null;          // 열린 티켓의 기록 구독 해제 함수
let tlTicketId = null;
let tlLogs = [];
let tlType = '점검';        // 마지막으로 고른 종류 유지 (점검 기록을 연달아 남기기 편하도록)
let tlEditingId = null;
let tlSaving = false;

function tlUid() { return FS.getCurrentUser()?.uid; }
function tlDate(v) { if (!v) return null; return v.toDate ? v.toDate() : new Date(v); }
function tlFmt(d) {
  if (!d) return '';
  const p = n => String(n).padStart(2, '0');
  const y = d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}.` : '';
  return `${y}${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function tlLocalInput(d) {   // datetime-local 입력값
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function tlDur(ms) {
  if (!(ms > 0)) return '';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d}일 ${h % 24}시간`;
  if (h) return `${h}시간 ${m % 60}분`;
  return `${m}분`;
}

// 등록 시각을 첫 기록으로 합쳐서 시간순(오래된 것 먼저) 정렬
function tlAllLogs(t) {
  const created = tlDate(t.created_at);
  const list = [...tlLogs];
  if (created) list.push({ id: '_created', type: '등록', text: '티켓 등록', at: created, auto: true, by_name: t.created_by_name || '' });
  return list.sort((a, b) => (tlDate(a.at) || 0) - (tlDate(b.at) || 0));
}

function tlElapsed(t) {
  // 시작 = 등록 시각과 기록 중 가장 이른 시각 (장애 발생 후 늦게 등록한 경우 소급 기록 기준)
  const times = [tlDate(t.created_at), ...tlLogs.map(l => tlDate(l.at))].filter(Boolean);
  if (!times.length) return '';
  const created = new Date(Math.min(...times));
  if (t.status === '완료') {
    const done = [...tlLogs].filter(l => l.auto && l.to === '완료').sort((a, b) => tlDate(b.at) - tlDate(a.at))[0];
    let end = done ? tlDate(done.at) : null;
    if (!end && typeof t.completed_at === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.completed_at)) end = new Date(t.completed_at + 'T23:59:59');
    return end && end > created ? `총 ${tlDur(end - created)}` : '';
  }
  // 달력 날짜 기준 (어제 23:50 접수 → 오늘은 2일째)
  const day0 = new Date(created); day0.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = Math.max(0, Math.round((today - day0) / 86400000));
  return d ? `${d + 1}일째` : '오늘 접수';
}

function showDetail(id, scroll) {
  ticketSelectedId = id;
  const t = allTickets.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('detail-col').style.display='';
  document.querySelector('.ticket-layout').classList.add('detail-open');

  // 다른 티켓을 열면 패널 뼈대를 새로 만들고 기록 구독을 바꿈.
  // 같은 티켓의 실시간 갱신이면 정보 영역만 다시 그림 (입력 중인 기록이 지워지지 않도록)
  if (tlTicketId !== id || !document.getElementById('td-info')) {
    if (tlStop) tlStop();
    tlTicketId = id; tlLogs = []; tlEditingId = null;
    document.getElementById('detail-panel').innerHTML = `
      <div id="td-info"></div>
      <div class="tl-compose">
        <div class="tl-types" id="tl-types"></div>
        <div class="tl-parts" id="tl-parts" style="display:none;">
          <input type="text" class="form-input" id="tl-pn" placeholder="P/N" autocomplete="off">
          <input type="text" class="form-input" id="tl-fru" placeholder="FRU" autocomplete="off">
        </div>
        <textarea class="form-textarea" id="tl-text" rows="2" placeholder="예: HDD fail 확인 (Slot 3)" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')tlAdd()"></textarea>
        <div class="tl-compose-foot">
          <button class="tl-when-btn" id="tl-when-btn" onclick="tlToggleWhen()">시간 지정</button>
          <input type="datetime-local" class="form-input tl-when" id="tl-when" style="display:none;">
          <span style="flex:1;"></span>
          <button class="btn btn-primary btn-sm" id="tl-save" onclick="tlAdd()">${FS.icon('plus', 14)} 기록</button>
        </div>
      </div>
      <div class="tl-head">
        <span>진행 기록</span>
        <button class="btn btn-sm" onclick="tlCopyReport()">${FS.icon('copy', 14)} 보고용 복사</button>
      </div>
      <div id="td-timeline" class="tl-list"></div>`;
    tlRenderTypes();
    tlStop = FS.watch([[`tickets/${id}/logs`]], ([logs]) => {
      if (tlTicketId !== id) return;
      tlLogs = logs;
      tlRenderInfo();
      tlRenderTimeline();
    });
  }
  tlRenderInfo();
  tlRenderTimeline();

  // 모바일: 목록이 숨겨지므로 맨 위부터 보이도록
  if (scroll && window.innerWidth <= 768) {
    document.getElementById('page-content').scrollTop = 0;
  }
}

function closeTicketDetail() {
  document.getElementById('detail-col').style.display = 'none';
  document.querySelector('.ticket-layout')?.classList.remove('detail-open');
  if (tlStop) tlStop();
  tlStop = null; tlTicketId = null; ticketSelectedId = null;
}

      ${t.completed_at?`<div><span class="text-hint">완료일</span><br><span style="color:var(--success);font-weight:700;">${FS.formatDate(t.completed_at)||'-'}</span></div>`:''}

// ── 부품·RMA: 이 티켓의 교체 부품. 카드 아래 버튼 한 번으로 다음 단계 (static/js/parts.js) ──
let ticketParts = [];
function tkPartsHtml(t) {
  const list = ticketParts.filter(p => p.ticket_id === t.id)
    .sort((a, b) => Parts.isOpen(b) - Parts.isOpen(a) || (a.created_at?.seconds || 0) - (b.created_at?.seconds || 0));
  return `<div class="td-related">
    <div class="td-related-head">
      <span>부품·RMA ${list.length ? list.length + '건' : ''}</span>
      <button class="btn btn-sm" onclick="tkAddPart('${t.id}')">${FS.icon('plus', 14)} 부품 추가</button>
    </div>
    ${list.map(p => {
      const due = Parts.due(p);
      const n = Parts.next(p);
      const meta = [p.pn && 'P/N ' + p.pn, p.case_no && 'RMA ' + p.case_no, p.old_sn && '불량 ' + p.old_sn].filter(Boolean).join(' · ');
      return `<div class="pt-card${due?.cls === 'over' ? ' over' : ''}">
        <div class="pt-card-body" onclick="Parts.openModal('${p.id}', null, ticketParts)">
          <div class="pt-card-main">
            <span class="pt-card-name">${FS.esc(p.name)}${p.qty > 1 ? ' ×' + p.qty : ''}</span>
            ${meta ? `<span class="pt-card-meta">${FS.esc(meta)}</span>` : ''}
          </div>
          <div class="pt-card-side">
            <span class="pt-stage">${FS.esc(p.status || '요청')}</span>
            ${Parts.stepsHtml(p)}
            ${due ? `<span class="pt-due ${due.cls}">${due.text}</span>` : ''}
          </div>
        </div>
        ${n ? `<button class="pt-next" onclick="Parts.advance('${p.id}', ticketParts)">${FS.icon('check', 16)} ${n} 처리 <span class="text-hint" style="font-weight:600;">— ${Parts.STAGE_HINT[n]}</span></button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}
function tkAddPart(ticketId) {
  const t = allTickets.find(x => x.id === ticketId);
  if (!t) return;
  Parts.openModal(null, { ticket_id: t.id, ticket_title: t.title || '', customer_id: t.customer_id || '',
                          asset_id: t.asset_id || '', asset_host: tkHost(t.asset_id, t) || '' }, ticketParts);
}

// ── 작업 일정 (부품 교체 방문 등): 이 티켓으로 잡은 작업과 준비 진행 ──
function tkJobsHtml(t) {
  const jobs = ticketJobs.filter(j => j.ticket_id === t.id)
    .sort((a, b) => ((a.status || '예정') !== '예정') - ((b.status || '예정') !== '예정') || (a.date || '').localeCompare(b.date || ''));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dday = ds => { const d = Math.round((new Date(ds + 'T00:00:00') - today) / 86400000); return d === 0 ? 'D-DAY' : d < 0 ? `D+${-d}` : `D-${d}`; };
  return `<div class="td-related">
    <div class="td-related-head">
      <span>작업 일정 ${jobs.length ? jobs.length + '건' : ''}</span>
      <button class="btn btn-sm" onclick="tkPlanJob('${t.id}')">${FS.icon('plus', 14)} 작업 일정 잡기</button>
    </div>
    ${jobs.map(j => {
      const items = Object.values(j.items || {});
      const st = j.status || '예정';
      return `<div class="td-related-item" onclick="window.hwPageFilter={page:'jobs',jobId:'${j.id}'};loadPage('jobs')">
        <span>${FS.esc(j.title || '')}<span class="tk-host">${FS.esc(j.date || '')}${j.time ? ' ' + FS.esc(j.time) : ''}${items.length ? ` · 준비 ${items.filter(i => i.done).length}/${items.length}` : ''}</span></span>
        <span class="badge ${st === '예정' ? 'badge-warning' : 'badge-gray'}">${st === '예정' && j.date ? dday(j.date) : FS.esc(st)}</span>
      </div>`;
    }).join('')}
  </div>`;
}
function tkPlanJob(ticketId) {
  const t = allTickets.find(x => x.id === ticketId);
  if (!t) return;
  window.hwPageFilter = { page: 'jobs', newFor: { ticket_id: t.id, customer_id: t.customer_id, asset_id: t.asset_id, assignee: t.assignee } };
  loadPage('jobs');
}

// ── 장비 연결 ──
function tkHost(assetId, t) {
  const a = ticketAssets.find(x => x.id === assetId);
  if (a) return a.hostname || a.serial || '';
  return t?.asset_host || '';   // 장비가 삭제된 경우 등록 당시 이름
}
function tkAssetInfo(assetId) {
  const a = ticketAssets.find(x => x.id === assetId);
  return a ? { asset_host: a.hostname || '', asset_serial: a.serial || '', asset_model: a.model || '' } : {};
}
function tkFillAssets(selected) {
  const cid = document.getElementById('f-customer').value;
  const sel = document.getElementById('f-asset');
  const list = ticketAssets
    .filter(a => !cid || a.customer_id === cid)
    .sort((a, b) => (a.hostname || '').localeCompare(b.hostname || ''));
  FS.setOptions(sel, list.map(a => ({
    value: a.id,
    label: `${a.hostname || '-'}${a.serial ? ' · ' + a.serial : ''}${cid ? '' : ' (' + (ticketCusts[a.customer_id] || '-') + ')'}`,
  })));
  if (selected !== undefined) sel.value = selected || '';
}
function tkAssetPicked() {
  // 장비를 먼저 고르면 고객사 자동 지정
  const a = ticketAssets.find(x => x.id === document.getElementById('f-asset').value);
  if (a && a.customer_id && document.getElementById('f-customer').value !== a.customer_id) {
    document.getElementById('f-customer').value = a.customer_id;
    tkFillAssets(a.id);
  }
}
function tkOpenAsset(assetId) {
  window.hwPageFilter = { page: 'customers', assetId };
  loadPage('customers');
}
// 같은 장비의 다른 장애 (HDD·DIMM처럼 장애마다 티켓을 따로)
function tkRelatedHtml(t) {
  if (!t.asset_id) return '';
  const others = allTickets.filter(x => x.id !== t.id && x.asset_id === t.asset_id)
    .sort((a, b) => ((a.status === '완료') - (b.status === '완료')) || ((b.created_at?.seconds || 0) - (a.created_at?.seconds || 0)));
  return `<div class="td-related">
    <div class="td-related-head">
      <span>같은 장비의 장애 ${others.length ? others.length + '건' : ''}</span>
      <button class="btn btn-sm" onclick="tkNewForSameAsset('${t.id}')">${FS.icon('plus', 14)} 같은 장비에 장애 추가</button>
    </div>
    ${others.slice(0, 6).map(x => `<div class="td-related-item" onclick="showDetail('${x.id}', true)">
      <span>${FS.esc(x.title || '')}</span>
      <span class="badge ${STATUS_BADGE[x.status||'접수']||'badge-gray'}">${FS.esc(x.status||'접수')}</span>
    </div>`).join('')}
  </div>`;
}
function tkNewForSameAsset(ticketId) {
  const t = allTickets.find(x => x.id === ticketId);
  if (!t) return;
  openModal(null, { customer_id: t.customer_id, asset_id: t.asset_id, assignee: t.assignee });
}

function tlRenderTypes() {
  document.getElementById('tl-types').innerHTML = TL_TYPES.map(ty =>
    `<button class="tl-chip${ty === tlType ? ' on' : ''}" onclick="tlPickType('${ty}')">${ty}</button>`).join('');
  document.getElementById('tl-parts').style.display = tlType === '부품' ? '' : 'none';
  document.getElementById('tl-text').placeholder = TL_HINTS[tlType] || '';
}
function tlPartsHtml(l) {
  return (l.pn ? `<span class="tl-pn"><b>P/N</b>${FS.esc(l.pn)}</span>` : '') +
         (l.fru ? `<span class="tl-pn"><b>FRU</b>${FS.esc(l.fru)}</span>` : '');
}
function tlPickType(ty) { tlType = ty; tlRenderTypes(); document.getElementById('tl-text').focus(); }

function tlToggleWhen() {
  const el = document.getElementById('tl-when');
  const show = el.style.display === 'none';
  el.style.display = show ? '' : 'none';
  document.getElementById('tl-when-btn').textContent = show ? '지금 시간으로' : '시간 지정';
  if (show && !el.value) el.value = tlLocalInput(new Date());
  if (!show) el.value = '';
}

function tlRenderTimeline() {
  const t = allTickets.find(x => x.id === tlTicketId);
  const box = document.getElementById('td-timeline');
  if (!t || !box) return;
  // 수정 중인 기록의 입력값 보존 (실시간 갱신으로 다시 그려도 지워지지 않도록)
  const keep = tlEditingId && document.getElementById('tl-e-text')
    ? ['tl-e-type', 'tl-e-at', 'tl-e-pn', 'tl-e-fru', 'tl-e-text'].map(i => [i, document.getElementById(i).value])
    : null;
  const restore = () => keep && keep.forEach(([i, v]) => { const el = document.getElementById(i); if (el) el.value = v; });
  const uid = tlUid();
  const list = tlAllLogs(t).reverse();   // 최신이 위
  box.innerHTML = list.length ? list.map(l => {
    const mine = !l.auto && l.by === uid;
    if (l.id === tlEditingId) {
      return `<div class="tl-item t-${FS.esc(l.type)}">
        <div class="tl-edit">
          <div class="flex gap-1" style="flex-wrap:wrap;">
            <select class="form-select" id="tl-e-type" style="width:auto;height:32px;">${TL_TYPES.map(ty => `<option${ty === l.type ? ' selected' : ''}>${ty}</option>`).join('')}</select>
            <input type="datetime-local" class="form-input tl-when" id="tl-e-at" value="${tlLocalInput(tlDate(l.at) || new Date())}">
          </div>
          <div class="tl-parts">
            <input type="text" class="form-input" id="tl-e-pn" placeholder="P/N" value="${FS.esc(l.pn || '')}">
            <input type="text" class="form-input" id="tl-e-fru" placeholder="FRU" value="${FS.esc(l.fru || '')}">
          </div>
          <textarea class="form-textarea" id="tl-e-text" rows="2">${FS.esc(l.text || '')}</textarea>
          <div class="flex gap-1" style="justify-content:flex-end;">
            <button class="btn btn-sm" onclick="tlEditingId=null;tlRenderTimeline()">취소</button>
            <button class="btn btn-primary btn-sm" onclick="tlSaveEdit('${l.id}')">저장</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="tl-item t-${FS.esc(l.type)}${l.auto ? ' auto' : ''}">
      <div class="tl-meta">
        <span class="tl-time">${tlFmt(tlDate(l.at))}</span>
        <span class="tl-type">${FS.esc(l.type)}</span>
        ${l.by_name ? `<span>${FS.esc(l.by_name)}</span>` : ''}
        ${mine ? `<span class="tl-actions">
          <button onclick="tlEditingId='${l.id}';tlRenderTimeline()" aria-label="기록 수정">${FS.icon('edit', 15)}</button>
          <button onclick="tlDelete('${l.id}')" aria-label="기록 삭제">${FS.icon('trash', 15)}</button>
        </span>` : ''}
      </div>
      ${l.text ? `<div class="tl-text">${FS.esc(l.text)}</div>` : ''}
      ${tlPartsHtml(l)}
    </div>`;
  }).join('') : '<div class="tl-empty">아직 기록이 없습니다</div>';
  restore();
}

function tlLogsRef(ticketId) { return firebase.firestore().collection('tickets').doc(ticketId).collection('logs'); }
function tlAuthor() {
  const u = FS.getCurrentUser();
  return { by: u.uid, by_name: u.displayName || u.email || '' };
}

async function tlAdd() {
  if (tlSaving || !tlTicketId) return;
  const textEl = document.getElementById('tl-text');
  const text = textEl.value.trim();
  const isPart = tlType === '부품';
  const pn  = isPart ? document.getElementById('tl-pn').value.trim() : '';
  const fru = isPart ? document.getElementById('tl-fru').value.trim() : '';
  if (!text && !pn && !fru) { Toast.error('내용을 입력하세요'); textEl.focus(); return; }
  const whenEl = document.getElementById('tl-when');
  const when = whenEl.style.display !== 'none' && whenEl.value ? new Date(whenEl.value) : null;
  // 시각은 입력한 순간의 기기 시각 (전산실처럼 오프라인이면 서버 시각은 동기화 시점이 되어 순서가 틀어짐).
  // 서버 응답을 기다리지 않음: 로컬 캐시에 바로 보이고 연결되면 올라감
  tlLogsRef(tlTicketId).add({
    type: tlType, text,
    ...(isPart ? { pn, fru } : {}),
    at: firebase.firestore.Timestamp.fromDate(when || new Date()),
    ...tlAuthor(), auto: false,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(e => Toast.error('기록 실패: ' + (e.code || e.message)));
  tlIndex(tlTicketId, [text, pn, fru]);
  textEl.value = '';
  if (isPart) { document.getElementById('tl-pn').value = ''; document.getElementById('tl-fru').value = ''; }
  if (when) tlToggleWhen();
  textEl.focus();   // 같은 종류로 바로 다음 기록
  if (!navigator.onLine) Toast.info('오프라인 — 연결되면 자동으로 저장됩니다');
}

// 티켓 검색용: 기록 내용·P/N·FRU를 티켓 문서에 모아 둠 (목록 검색에서 SR 번호·부품번호로 찾기)
function tlIndex(ticketId, values) {
  const keys = values.map(v => String(v || '').trim()).filter(Boolean).map(v => v.slice(0, 200));
  if (!keys.length) return;
  firebase.firestore().collection('tickets').doc(ticketId)
    .update({ log_keys: firebase.firestore.FieldValue.arrayUnion(...keys) })
    .catch(e => console.warn('검색 색인 실패', e));
}

// 상태가 바뀔 때 자동 기록
async function tlAutoStatus(ticketId, from, to) {
  try {
    tlLogsRef(ticketId).add({
      type: '상태', text: `${from || '접수'} → ${to}`, to,
      at: firebase.firestore.Timestamp.now(),
      ...tlAuthor(), auto: true,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch(e => console.warn('상태 기록 실패', e));
  } catch (e) { console.warn('상태 기록 실패', e); }
}

async function tlSaveEdit(logId) {
  const text = document.getElementById('tl-e-text').value.trim();
  const atVal = document.getElementById('tl-e-at').value;
  const pn  = document.getElementById('tl-e-pn').value.trim();
  const fru = document.getElementById('tl-e-fru').value.trim();
  if (!text && !pn && !fru) { Toast.error('내용을 입력하세요'); return; }
  tlLogsRef(tlTicketId).doc(logId).update({
    type: document.getElementById('tl-e-type').value,
    text, pn, fru,
    ...(atVal ? { at: firebase.firestore.Timestamp.fromDate(new Date(atVal)) } : {}),
    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(e => Toast.error('수정 실패: ' + (e.code || e.message)));
  tlIndex(tlTicketId, [text, pn, fru]);
  tlEditingId = null;
  tlRenderTimeline();
}

async function tlDelete(logId) {
  if (!await Dialog.confirm('이 기록을 삭제하시겠습니까?', true)) return;
  try { await tlLogsRef(tlTicketId).doc(logId).delete(); }
  catch (e) { Toast.error('삭제 실패: ' + (e.code || e.message)); }
}

// 보고서·메일에 붙여 넣을 수 있는 시간순 정리
async function tlCopyReport() {
  const t = allTickets.find(x => x.id === tlTicketId);
  if (!t) return;
  const lines = [
    `[장애 보고] ${t.title || ''}${ticketCusts[t.customer_id] ? ' / ' + ticketCusts[t.customer_id] : ''}`,
    `상태: ${t.status || '접수'}${t.priority ? ' · 우선순위 ' + t.priority : ''}${t.assignee ? ' · 담당 ' + t.assignee : ''}`,
  ];
  // 벤더 RMA·SR에 필요한 장비 정보
  const a = ticketAssets.find(x => x.id === t.asset_id);
  const host = tkHost(t.asset_id, t), sn = a?.serial || t.asset_serial, model = a?.model || t.asset_model;
  if (host || sn || model) lines.push(`장비: ${[host, model, sn ? 'S/N ' + sn : ''].filter(Boolean).join(' · ')}`);
  if (t.symptom) lines.push('', '■ 증상', t.symptom);
  lines.push('', '■ 진행 경과');
  tlAllLogs(t).forEach(l => {
    const parts = [l.pn ? `P/N ${l.pn}` : '', l.fru ? `FRU ${l.fru}` : ''].filter(Boolean).join(', ');
    const body = [(l.text || '').split('\n').join('\n    '), parts ? `(${parts})` : ''].filter(Boolean).join(' ');
    lines.push(`- ${tlFmt(tlDate(l.at))} [${l.type}] ${body}`);
  });
  if (t.action) lines.push('', '■ 조치 결과', t.action);
  const el = tlElapsed(t);
  if (el.startsWith('총')) lines.push('', `${el} 소요`);
  const text = lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    Toast.success('진행 경과를 복사했습니다');
  } catch (e) {
    // 클립보드 권한이 없으면 선택 가능한 창으로
    const ta = document.createElement('textarea');
    ta.value = text; ta.readOnly = true; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);   // iOS
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) Toast.success('진행 경과를 복사했습니다');
    else Toast.error('복사하지 못했습니다. 브라우저 권한을 확인하세요');
  }
}

async function changeStatus(id, status) {
  const cur = allTickets.find(x=>x.id===id);
  if (cur && cur.status === status) return;   // 같은 상태 재선택 시 완료일 덮어쓰기 방지
  const today = FS.localDate();
  const updateData = {
    status,
    completed_at: status === '완료' ? today : null,
  };
  FS.updateNow('tickets', id, updateData);   // 오프라인이어도 바로 반영
  tlAutoStatus(id, cur?.status, status);
  const t = allTickets.find(x=>x.id===id);
  if (t) {
    t.status = status;
    t.completed_at = status === '완료' ? today : null;
  }
  showDetail(id);
  renderStats();
  renderTickets();
}

function toDateInputVal(ts) {
  if (!ts) return '';
  if (typeof ts === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ts)) return ts;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return FS.localDate(d);
}

function toggleCompletedAt() {
  const isDone = document.getElementById('f-status').value === '완료';
  const group = document.getElementById('completed-at-group');
  group.style.display = isDone ? '' : 'none';
  if (isDone && !document.getElementById('f-completed-at').value) {
    document.getElementById('f-completed-at').value = FS.localDate();
  }
}

function openModal(id, prefill) {
  document.getElementById('ticket-modal').style.display='flex';
  if (id) {
    const t = allTickets.find(x=>x.id===id);
    document.getElementById('modal-title').textContent='티켓 수정';
    document.getElementById('edit-id').value=id;
    document.getElementById('f-title').value=t.title||'';
    document.getElementById('f-customer').value=t.customer_id||'';
    tkFillAssets(t.asset_id || '');
    document.getElementById('f-assignee').value=t.assignee||'';
    document.getElementById('f-priority').value=t.priority||'보통';
    document.getElementById('f-status').value=t.status||'접수';
    document.getElementById('f-completed-at').value=toDateInputVal(t.completed_at);
    document.getElementById('f-symptom').value=t.symptom||'';
    document.getElementById('f-action').value=t.action||'';
    const legacy = !!(t.symptom || t.action);
    document.getElementById('legacy-fields').style.display = legacy ? '' : 'none';
    document.getElementById('new-hint').style.display = 'none';
  } else {
    document.getElementById('modal-title').textContent='티켓 등록';
    document.getElementById('edit-id').value='';
    ['f-title','f-assignee','f-symptom','f-action','f-completed-at'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('legacy-fields').style.display = 'none';
    document.getElementById('new-hint').style.display = '';
    setTimeout(() => document.getElementById('f-title').focus(), 50);
    document.getElementById('f-priority').value='보통';
    document.getElementById('f-status').value='접수';
    document.getElementById('f-customer').value=prefill?.customer_id||'';
    tkFillAssets(prefill?.asset_id || '');
    if (prefill?.assignee) document.getElementById('f-assignee').value = prefill.assignee;
    if (prefill?.asset_id) {
      const host = tkHost(prefill.asset_id);
      document.getElementById('modal-title').textContent = host ? `티켓 등록 — ${host}` : '티켓 등록';
      setTimeout(() => document.getElementById('f-title').focus(), 50);
    }
  }
  toggleCompletedAt();
}
function closeModal() { document.getElementById('ticket-modal').style.display='none'; }

async function saveTicket() {
  if (window._tkSaving) return;   // 두 번 탭해 중복 등록 방지
  const title = document.getElementById('f-title').value.trim();
  if (!title) { Toast.error('제목을 입력하세요'); return; }
  const status = document.getElementById('f-status').value;
  const data = {
    title,
    customer_id: document.getElementById('f-customer').value,
    asset_id: document.getElementById('f-asset').value,
    ...tkAssetInfo(document.getElementById('f-asset').value),   // 장비가 삭제돼도 남도록 이름·S/N 보관
    assignee: document.getElementById('f-assignee').value.trim(),
    priority: document.getElementById('f-priority').value,
    status,
  };
  // 예전 증상·조치 칸은 표시된 경우(예전 티켓 수정)에만 저장
  if (document.getElementById('legacy-fields').style.display !== 'none') {
    data.symptom = document.getElementById('f-symptom').value.trim();
    data.action  = document.getElementById('f-action').value.trim();
  }
  const id = document.getElementById('edit-id').value;
  if (status === '완료') {
    data.completed_at = document.getElementById('f-completed-at').value
      || FS.localDate();
  } else {
    data.completed_at = null;
  }
  if (id) {
    const before = allTickets.find(x=>x.id===id);
    FS.updateNow('tickets', id, data);
    FS.audit('수정', '티켓', id, data.title, data.asset_host || '');
    if (before && (before.status || '접수') !== status) tlAutoStatus(id, before.status, status);
    const idx = allTickets.findIndex(x=>x.id===id);
    if (idx >= 0) allTickets[idx] = {...allTickets[idx], ...data};
    Toast.success('티켓이 수정되었습니다');
  } else {
    window._tkSaving = true;
    setTimeout(() => { window._tkSaving = false; }, 800);
    const newId = FS.addNow('tickets', { ...data, ...FS.creator() });
    FS.audit('등록', '티켓', newId, data.title, data.asset_host || '');
    if (!allTickets.some(x => x.id === newId))
      allTickets.unshift({id:newId, ...data, created_at: { toDate: () => new Date(), seconds: Date.now() / 1000 }});
    if (status !== '접수') tlAutoStatus(newId, '접수', status);   // 바로 진행중·완료로 등록한 경우도 기록
    Toast.success('티켓이 등록되었습니다 — 진행 기록을 남겨 주세요');
    closeModal();
    renderStats();
    renderTickets();
    // 등록 직후: 상세(타임라인)를 열고 '증상' 기록부터
    tlType = '증상';
    showDetail(newId, true);
    setTimeout(() => document.getElementById('tl-text')?.focus(), 100);
    return;
  }
  closeModal();
  renderStats();
  renderTickets();
  if (ticketSelectedId===id) showDetail(id);
}

async function deleteTicket(id) {
  const t = allTickets.find(x=>x.id===id);
  if (!await Dialog.confirm(`'${t?.title || ''}' 티켓을 삭제하시겠습니까?\n진행 기록도 함께 삭제됩니다.`, true)) return;
  try {
    const logs = await tlLogsRef(id).get();
    await Promise.allSettled(logs.docs.map(d => d.ref.delete()));
    await FS.remove('tickets', id);
    FS.audit('삭제', '티켓', id, t?.title, [t?.status, tkHost(t?.asset_id, t), `기록 ${logs.size}건`].filter(Boolean).join(' · '));
  } catch (e) {
    Toast.error('삭제 실패: ' + (e.code || e.message));
    return;
  }
  allTickets = allTickets.filter(x=>x.id!==id);
  closeTicketDetail();
  renderStats();
  renderTickets();
  Toast.success('티켓이 삭제되었습니다');
}

init();
</script>
