<!-- 회원 관리 -->
<style>
  .acc-row { display:flex; align-items:center; gap:8px; padding:9px 14px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:13px; }
  .acc-row:first-child { border-top:none; }
  .acc-row span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .acc-add { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--ink); background:var(--surface-2); flex-wrap:wrap; }
  .acc-add input { flex:1 1 220px; min-width:0; }
</style>

<!-- 로그인 허용 계정 (Firestore config/access) -->
<div class="card mb-3" style="padding:0;overflow:hidden;">
  <div style="padding:10px 14px;background:#111;color:#ECEAE4;font-weight:700;font-size:13px;">로그인 허용 계정</div>
  <div id="acc-list"></div>
  <div class="acc-add">
    <input type="email" class="form-input" id="acc-email" placeholder="someone@gmail.com" autocomplete="off"
      onkeydown="if(event.key==='Enter')addAccess()">
    <button class="btn btn-primary" onclick="addAccess()">추가</button>
  </div>
  <div style="padding:10px 14px;font-size:12px;color:var(--text-sub);line-height:1.6;border-top:1px solid var(--border);">
    추가한 계정은 <b>Google Cloud 콘솔 → OAuth 동의 화면 → 테스트 사용자</b>에도 등록해야 로그인할 수 있습니다
    (캘린더 권한 때문에 앱이 테스트 모드). 목록에서 빼면 다음 화면 이동부터 접근이 막힙니다.
  </div>
</div>
<div class="card" style="padding:0;overflow:hidden;">
  <div class="table-wrap">
  <table class="table">
    <thead>
      <tr><th>이름</th><th>이메일</th><th>역할</th><th>가입일</th><th style="width:160px;">역할 변경</th></tr>
    </thead>
    <tbody id="users-tbody"></tbody>
  </table>
  </div>
  <div id="users-empty" class="empty-state" style="display:none;">
    <div class="empty-icon"></div><div>회원 정보가 없습니다</div>
  </div>
</div>

<div class="card mt-3" style="background:var(--info-bg);border-color:var(--info);">
  <div style="font-size:13px;color:var(--info);">
    <strong>안내:</strong> 회원 가입 시 이 목록에 자동으로 등록됩니다.
    역할을 <strong>admin</strong>으로 변경하면 회원 관리 메뉴 접근 권한이 부여됩니다.
  </div>
</div>

<script>
FS.requireAuth();

let allUsers = [];

async function init() {
  // admin 여부 확인
  const current = FS.getCurrentUser();
  if (current) {
    const me = await FS.getOne('users', current.uid);
    if (!me || me.role !== 'admin') {
      document.querySelector('.content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"></div>
          <div>관리자 권한이 필요합니다</div>
        </div>`;
      return;
    }
  }

  loadAccess();
  FS.watch([['users']], ([users]) => {
    allUsers = users;
    allUsers.sort((a,b)=>(a.email||'').localeCompare(b.email||''));
    renderUsers();
  });
}

// ── 로그인 허용 계정 ──
const accRef = () => firebase.firestore().collection('config').doc('access');
let accEmails = [];
async function loadAccess() {
  try {
    const snap = await accRef().get({ source: 'server' });
    accEmails = (snap.data()?.emails || []).slice().sort();
  } catch (e) {
    Toast.error('허용 계정을 불러오지 못했습니다: ' + (e.code || e.message));
  }
  renderAccess();
}
function renderAccess() {
  const me = (FS.getCurrentUser()?.email || '').toLowerCase();
  document.getElementById('acc-list').innerHTML = accEmails.map(e => `
    <div class="acc-row">
      <span>${FS.esc(e)}</span>
      ${e === me ? '<span class="badge badge-gray" style="flex:none;">나</span>'
        : `<button class="btn btn-sm btn-danger" onclick="removeAccess('${FS.esc(e)}')">빼기</button>`}
    </div>`).join('') || '<div class="acc-row"><span>없음</span></div>';
}
async function addAccess() {
  const el = document.getElementById('acc-email');
  const email = el.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.error('이메일 형식을 확인하세요'); return; }
  try {
    await accRef().set({ emails: firebase.firestore.FieldValue.arrayUnion(email) }, { merge: true });
    el.value = '';
    Toast.success(`${email} 추가됨 — Google 콘솔 테스트 사용자에도 등록하세요`);
    loadAccess();
  } catch (e) { Toast.error('추가 실패: ' + (e.code || e.message)); }
}
async function removeAccess(email) {
  if (!await Dialog.confirm(`${email} 계정의 접근을 막을까요?`, true)) return;
  try {
    await accRef().update({ emails: firebase.firestore.FieldValue.arrayRemove(email) });
    Toast.success('제외했습니다');
    loadAccess();
  } catch (e) { Toast.error('실패: ' + (e.code || e.message)); }
}

function renderUsers() {
  document.getElementById('users-empty').style.display = allUsers.length?'none':'';
  document.getElementById('users-tbody').innerHTML = allUsers.map(u=>`
    <tr>
      <td style="font-weight:500;">${FS.esc(u.displayName||u.name||'-')}</td>
      <td>${FS.esc(u.email||'-')}</td>
      <td><span class="badge ${u.role==='admin'?'badge-orange':'badge-gray'}">${FS.esc(u.role||'user')}</span></td>
      <td>${FS.formatDate(u.created_at)||'-'}</td>
      <td>
        <select class="form-select" onchange="changeRole('${u.id}',this.value)">
          <option ${(u.role||'user')==='user'?'selected':''} value="user">user</option>
          <option ${u.role==='admin'?'selected':''} value="admin">admin</option>
        </select>
      </td>
    </tr>`).join('');
}

async function changeRole(id, role) {
  if (role !== 'user' && role !== 'admin') { renderUsers(); return; }
  // 관리자가 자기 자신을 user로 내리면 이 화면·권한을 바로 잃으므로 한 번 더 경고
  const isSelfDemote = id === FS.getCurrentUser()?.uid && role !== 'admin';
  const otherAdmins = allUsers.filter(u => u.id !== id && u.role === 'admin').length;
  const msg = isSelfDemote
    ? '본인의 관리자 권한을 해제합니다.\n해제 후에는 회원 관리 메뉴에 접근할 수 없고, '
      + (otherAdmins ? '다른 관리자만 되돌릴 수 있습니다.' : '다른 관리자가 없어 관리 스크립트(set_admin.py)로만 복구할 수 있습니다.')
      + '\n계속하시겠습니까?'
    : `역할을 '${role}'로 변경하시겠습니까?`;
  if (!await Dialog.confirm(msg, isSelfDemote)) {
    renderUsers();   // 선택 상자를 원래 값으로 되돌림
    return;
  }
  try {
    await FS.update('users', id, { role });
  } catch (e) {
    console.error('[users] changeRole', e);
    Toast.error('역할 변경 실패: ' + (e.code || e.message));
    renderUsers();   // 실패: 선택 상자를 원래 값으로 되돌림
    return;
  }
  const u = allUsers.find(x=>x.id===id);
  if (u) u.role = role;
  renderUsers();
  Toast.success(`역할이 '${role}'로 변경되었습니다`);
  // 본인 권한 해제: 메뉴·권한 상태를 다시 읽도록 새로고침
  if (isSelfDemote) setTimeout(() => location.reload(), 1200);
}

init();
</script>
